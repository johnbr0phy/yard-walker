  return {sr,sockets:{
    cockpit:FR([bx+ph*0.2,0,bz+Rp*0.34],[1,0,0],[0,1,0],[0,0,1],
               {x:Rp*0.55,y:ph*1.8,z:Rp*0.45},true),
    wing:FR([-Rp*0.2,0,Rp*ez*0.92],[0,0,1],[0,1,0],[1,0,0],{x:Rp*0.5,y:ph*1.4,z:Rp*0.7}),
    tail:FR([-Rp*0.3,ph*0.9,0],[0,1,0],[1,0,0],[0,0,1],{x:Rp*0.45,y:Rp*0.45,z:Rp*0.45}),
    booster:FR([-Rp*ex*0.88,0,0],[-1,0,0],[0,1,0],[0,0,1],{x:Rp*0.42,y:ph*1.6,z:Rp*0.62}),
    gear:FR([0,-ph*0.95,0],[0,-1,0],[1,0,0],[0,0,1],{x:Rp*0.5,y:Rp*0.9,z:Rp*0.8})
  }};
}},

/* ------------- 4. catamaran: twin hulls, one bridge, paired sterns ------------- */
{n:"CATAMARAN",role:["TND","ORBITAL TENDER"],spine:true,make(R,rr,P,out,lock,opts){
  const sr=1.5+P.fuse*0.85, L=(11+P.fuse*12)*rr(0.9,1.1), off=sr*rr(2.6,3.8);
  const tmp=[], sp=composeSpine(-L*0.5,L*0.5,sr,rr,R,P,tmp,lock,opts);
  for(const q of tmp) out.push(xlate(q,[0,0,off]));
  const bx=L*rr(0.02,0.16), bw=L*rr(0.13,0.20);
  out.push(BOX([bx,sr*0.30,0],[bw,0,0],[0,sr*0.62,0],[0,0,off*0.94],{det:{ribs:4}}));
  for(const cx of [bx+bw*1.6,bx-bw*1.9])
    out.push(TUB([cx,0,off*0.9],[cx,0,-off*0.9],sr*0.26,sr*0.26,{hideA:true,hideB:true}));
  return {sr,spine:sp,sockets:{
    cockpit:FR([bx+bw,sr*0.30,0],[1,0,0],[0,1,0],[0,0,1],{x:L*0.30,y:sr*2.0,z:off*0.9}),
    wing:FR([sp.wingX,0,off+sp.wingZ*0.9],[0,0,1],[0,1,0],[1,0,0],{x:L*0.34,y:sr*1.4,z:L*0.28}),
    tail:FR([bx-bw*0.6,sr*0.95,0],[0,1,0],[1,0,0],[0,0,1],{x:L*0.24,y:L*0.22,z:off*0.9}),
    booster:FR([-L*0.5,0,off],[-1,0,0],[0,1,0],[0,0,1],{x:L*0.34,y:sr*2.0,z:sr*2.0}),
    gear:FR([bx,-sr*0.4,0],[0,-1,0],[1,0,0],[0,0,1],{x:sr*2.4,y:L*0.28,z:off*0.9})
  }};
}},

/* ---- 6. trimaran: engines are full-length bodies flanking the hull, not a stern ---- */
{n:"TRIMARAN",role:["PBT","PATROL TENDER"],spine:true,make(R,rr,P,out,lock,opts){
  const sr=1.5+P.fuse*0.85, L=(12+P.fuse*13)*rr(0.92,1.1);
  const orr=sr*rr(0.62,0.88), off=sr*rr(2.4,3.4);
  const sp=composeSpine(-L*0.5,L*0.5,sr,rr,R,P,out,lock,opts);
  /* one outrigger, running most of the hull's length; the mirror pass makes the pair */
  const oL=L*rr(0.74,0.96), ox=L*rr(-0.08,0.10);
  out.push(CAP([ox+oL*0.5,0,off],[ox-oL*0.5,0,off],orr,{hideB:true,
    det:hullDet([0.16,0.34,0.52,0.70,0.88],[0.5,3.9],[])}));
  out.push(TUB([ox+oL*0.5,0,off],[ox+oL*0.5+orr*0.8,0,off],orr*0.92,orr*0.38,
    {det:hullDet([0.5],[],[])}));
  for(const px of [ox+oL*rr(0.22,0.34),ox-oL*rr(0.16,0.30)])
    out.push(PNL([[px+L*0.045,-sr*0.12,sr*0.55],[px+L*0.045,-sr*0.12,off-orr*0.5],
                  [px-L*0.045,-sr*0.12,off-orr*0.5],[px-L*0.045,-sr*0.12,sr*0.55]],null,
                 [0,1,0],sr*rr(0.34,0.5),{ribs:2}));
  return {sr,spine:sp,sockets:{
    cockpit:FR([L*0.5,0,0],[1,0,0],[0,1,0],[0,0,1],{x:L*0.34,y:sr*2.2,z:sr*2.2}),
    wing:FR([ox,0,off+orr*0.82],[0,0,1],[0,1,0],[1,0,0],{x:L*0.30,y:orr*1.6,z:L*0.26}),
    tail:FR([sp.tailX,sp.tailY,0],[0,1,0],[1,0,0],[0,0,1],{x:L*0.24,y:L*0.22,z:L*0.20}),
    booster:FR([ox-oL*0.5,0,off],[-1,0,0],[0,1,0],[0,0,1],{x:L*0.26,y:orr*2.1,z:orr*2.1}),
    gear:FR([L*0.02,-sr*0.9,0],[0,-1,0],[1,0,0],[0,0,1],{x:sr*2.2,y:L*0.3,z:off*0.85})
  }};
}},

/* ---- 7. edge-on: the hull's long axis is not the flight axis. It stands on its
   stern to land and flies flat-face-forward, so thrust leaves through the narrow
   trailing edge and the crew module is gimballed to stay level in both attitudes. ---- */
{n:"EDGE-ON",role:["PTL","EDGE-ON PATROL CRAFT"],note:"ATTITUDE 90°",make(R,rr,P,out){
  const Hh=(10+P.fuse*10)*rr(0.9,1.1);      /* long axis — vertical in flight */
  const Lx=Hh*rr(0.44,0.60);                /* fore-aft depth */
  const th=Hh*rr(0.15,0.22);                /* beam */
  const sr=th*0.5;
  const spade=[[Lx*0.50,Hh*0.06],[Lx*0.28,Hh*0.44],[-Lx*0.20,Hh*0.50],[-Lx*0.50,Hh*0.18],
               [-Lx*0.46,-Hh*0.34],[-Lx*0.06,-Hh*0.50],[Lx*0.38,-Hh*0.28]];
  out.push(PNL(spade.map(q=>[q[0],q[1],0]),null,[0,0,1],th,
    {ribs:Math.round(3+P.detail*3)}));
  /* raised flank superstructure — mirrored to both faces */
  const sp2=spade.map(q=>[q[0]*0.68,q[1]*0.66,0]);
  out.push(PNL(sp2.map(q=>[q[0],q[1],th*0.5]),null,[0,0,1],th*rr(0.20,0.34),{ribs:2}));
  /* gimbal ring the crew module turns in */
  const cy=Hh*rr(0.24,0.34);
  out.push(DSC([Lx*0.30,cy,0],[1,0,0],th*rr(0.62,0.80),th*0.34));
  if(P.detail>0.35){
    out.push(BOX([-Lx*0.24,Hh*0.40,0],[Lx*0.09,0,0],[0,Hh*0.04,0],[0,0,th*0.62],{det:{ribs:3}}));
    out.push(TUB([Lx*0.10,-Hh*0.46,0],[Lx*0.10,-Hh*0.56,0],th*0.14,th*0.20));
  }
  return {sr,sockets:{
    cockpit:FR([Lx*0.32,cy,0],[1,0,0],[0,1,0],[0,0,1],{x:Lx*0.55,y:th*1.9,z:th*1.6}),
    wing:FR([-Lx*0.06,-Hh*0.06,th*0.60],[0,0,1],[0,1,0],[1,0,0],{x:Hh*0.34,y:Hh*0.34,z:Lx*0.6}),
    tail:FR([-Lx*0.28,Hh*0.48,0],[0,1,0],[1,0,0],[0,0,1],{x:Hh*0.26,y:Lx*0.5,z:th*1.6}),
    booster:FR([-Lx*0.48,-Hh*0.02,0],[-1,0,0],[0,1,0],[0,0,1],{x:Lx*0.42,y:Hh*0.42,z:th*1.5}),
    /* the drop and the foot spread are the beam's business, not the height's:
       scaling them off Hh put the feet out past the sloping bottom edge and
       asked for stilts to reach back up to it */
    gear:FR([-Lx*0.04,-Hh*0.48,0],[0,-1,0],[1,0,0],[0,0,1],{x:th*1.8,y:Lx*0.30,z:th*1.5})
  }};
}},

/* ---- 8. lattice: no pressure hull at all — an open frame with modules clipped in ---- */
{n:"LATTICE",role:["CRV","CONSTRUCTION RIG"],spine:true,make(R,rr,P,out,lock,opts){
  const sr=1.5+P.fuse*0.8, L=(15+P.fuse*15)*rr(0.9,1.1);
  const w=sr*rr(1.8,2.6), h=sr*rr(1.4,2.1), bays=Math.max(3,Math.round(L/(sr*2.6)));
  const cor=[[h,w],[h,-w],[-h,-w],[-h,w]];
  const at=(t,c)=>[L*0.5-L*t,c[0],c[1]];
  for(const c of cor) out.push(CAP(at(0,c),at(1,c),sr*0.22));
  for(let i=0;i<=bays;i++){
    const t=i/bays;
    for(let j=0;j<4;j++) out.push(CAP(at(t,cor[j]),at(t,cor[(j+1)%4]),sr*0.17));
    if(i<bays){const t2=(i+1)/bays;
      for(let j=0;j<4;j++) out.push(CAP(at(t,cor[j]),at(t2,cor[(j+1)%4]),sr*0.12));}
  }
  /* payload rides inside the frame instead of being part of it */
  const pr=Math.min(h,w)*0.62;
  const sp=composeSpine(-L*0.40,L*0.40,pr,rr,R,P,out,lock,opts);
  out.push(DSC([L*0.5,0,0],[1,0,0],Math.min(h,w)*1.05,sr*0.5));
  return {sr,spine:sp,sockets:{
    cockpit:FR([L*0.5,0,0],[1,0,0],[0,1,0],[0,0,1],
               {x:L*0.26,y:h*1.5,z:w*1.5},false,Math.min(h,w)*0.8),
    wing:FR([L*rr(-0.1,0.1),0,w],[0,0,1],[0,1,0],[1,0,0],
            {x:L*0.30,y:h*1.2,z:L*0.24},false,sr*0.5),
    tail:FR([-L*rr(0.22,0.36),h,0],[0,1,0],[1,0,0],[0,0,1],
            {x:L*0.2,y:L*0.18,z:w*1.2},false,sr*0.5),
    booster:FR([sp.xTail,0,0],[-1,0,0],[0,1,0],[0,0,1],
               {x:L*0.28,y:h*1.6,z:w*1.6},false,pr),
    gear:FR([L*0.02,-h,0],[0,-1,0],[1,0,0],[0,0,1],
            {x:h*1.6,y:L*0.28,z:w*1.2},false,sr*0.6)
  }};
}},

{n:"SPINAL",role:["SMV","SPINAL MOUNT VESSEL"],spine:true,make(R,rr,P,out,lock,opts){
  const sr=1.6+P.fuse*0.9, L=(16+P.fuse*16)*rr(0.9,1.1), br=sr*rr(1.9,2.6);
  out.push(TUB([L*0.5,0,0],[L*0.34,0,0],br*0.72,br,{det:hullDet([0.5],[],[])}));
  out.push(DSC([L*0.5,0,0],[1,0,0],br*0.78,br*0.52));
  for(let i=0;i<3;i++) out.push(DSC([L*(0.3-i*0.16),0,0],[1,0,0],br*1.1,br*0.94));
  const sp=composeSpine(-L*0.36,L*0.34,br,rr,R,P,out,lock,opts);
  const tail=sp.xTail;
  out.push(TUB([tail,0,0],[tail-br*0.5,0,0],br,br*0.7,{hideB:true}));
  /* the crew section is a small mass hung off the big one */
  const cy=br*rr(0.95,1.25), cx=tail*rr(0.2,0.5);
  out.push(CAP([cx+L*0.10,cy,0],[cx-L*0.10,cy,0],sr*0.9,
    {det:hullDet([0.3,0.6],[0.5,3.9],[])}));
  out.push(CAP([cx,cy*0.45,0],[cx,0,0],sr*0.5,{hideB:true}));
  return {sr,spine:sp,sockets:{
    cockpit:FR([cx+L*0.10,cy,0],[1,0,0],[0,1,0],[0,0,1],
               {x:L*0.2,y:sr*2.0,z:sr*2.0},false,sr*0.9),
    wing:FR([sp.wingX,0,sp.wingZ],[0,0,1],[0,1,0],[1,0,0],
            {x:L*0.32,y:br*1.2,z:L*0.24},false,br*0.5),
    tail:FR([sp.tailX,sp.tailY,0],[0,1,0],[1,0,0],[0,0,1],
            {x:L*0.2,y:L*0.18,z:L*0.18},false,br*0.5),
    booster:FR([tail-br*0.5,0,0],[-1,0,0],[0,1,0],[0,0,1],
               {x:L*0.26,y:br*1.5,z:br*1.5},false,br*0.7),
    gear:FR([sp.gearX,sp.gearY,0],[0,-1,0],[1,0,0],[0,0,1],
            {x:br*1.5,y:L*0.28,z:br*1.3},false,br*0.45)
  }};
}},

/* ---- 10. stack: plates on a vertical column, flying edge-on ---- */
{n:"STACK",role:["HSV","HEAVY SURVEY VESSEL"],make(R,rr,P,out){
  const n=3+Math.round(R()*1.4), Rd=(5+P.fuse*3.4)*rr(0.9,1.1);
  const gap=Rd*rr(0.32,0.48), ex=rr(0.9,1.25), col=Rd*0.17, sr=col;
  const top=(n-1)*gap*0.5;
  out.push(CAP([0,top+gap*0.6,0],[0,-top-gap*0.6,0],col,{hideA:true,hideB:true,
    det:hullDet([0.3,0.5,0.7],[],[])}));
  let wideR=0, wideY=0;
  for(let i=0;i<n;i++){
    const y=top-i*gap, k=1-Math.abs(i-(n-1)/2)/n*0.5, rd=Rd*k, th=gap*rr(0.26,0.4);
    if(rd>wideR){wideR=rd;wideY=y;}
    out.push(LTH([0,y,0],[0,1,0],
      [[-th,rd*0.5],[-th*0.4,rd*0.92],[0,rd],[th*0.4,rd*0.9],[th,rd*0.48]],
      {rings:[1,2,3],mer:Math.round(5+P.detail*4)},{ell:[1,ex]}));
  }
  for(let i=0;i<4;i++){
    const a=i/4*Math.PI*2+0.4;
    out.push(CAP([Math.cos(a)*Rd*0.62,top,Math.sin(a)*Rd*0.62],
                 [Math.cos(a)*Rd*0.62,-top,Math.sin(a)*Rd*0.62],col*0.9));
  }
  /* a bridge pod forward and an engine pod aft, both spanning the stack, so the
     cockpit and the boosters continue an existing body instead of sitting on a rim */
  const pr=gap*rr(0.62,0.82), py=wideY;
  out.push(CAP([wideR*ex*0.55,py,0],[wideR*ex*1.02,py,0],pr,{hideB:true,
    det:hullDet([0.4,0.75],[0.5,3.9],[])}));
  out.push(CAP([-wideR*ex*0.55,py-gap*0.35,0],[-wideR*ex*1.0,py-gap*0.35,0],pr*1.1,
    {hideB:true,det:hullDet([0.35,0.7],[],[])}));
  return {sr,sockets:{
    cockpit:FR([wideR*ex*1.02,py,0],[1,0,0],[0,1,0],[0,0,1],
               {x:Rd*0.55,y:pr*2.2,z:pr*2.2},false,pr),
    wing:FR([0,wideY,wideR*0.96],[0,0,1],[0,1,0],[1,0,0],
            {x:Rd*0.70,y:gap*1.1,z:Rd*0.8},false,gap*0.34),
    tail:FR([0,top+gap*0.6,0],[0,1,0],[1,0,0],[0,0,1],
            {x:Rd*0.5,y:Rd*0.45,z:Rd*0.45},false,col),
    booster:FR([-wideR*ex*1.0,py-gap*0.35,0],[-1,0,0],[0,1,0],[0,0,1],
               {x:Rd*0.5,y:pr*2.0,z:pr*2.0},false,pr*1.1),
    gear:FR([0,-top-gap*0.6,0],[0,-1,0],[1,0,0],[0,0,1],
            {x:Rd*0.55,y:Rd*0.7,z:Rd*0.7},false,col)
  }};
}},

/* ---- 11. delta: the whole ship is one lifting planform ---- */
{n:"DELTA",role:["ASV","AEROSPACE VEHICLE"],make(R,rr,P,out){
  const L=(15+P.fuse*13)*rr(0.9,1.1), W=L*rr(0.46,0.64), H=L*rr(0.12,0.18);
  const sp=H*rr(0.30,0.38), sr=sp;
  const plan=[[L*0.5,0],[L*0.06,W*0.62],[-L*0.42,W],[-L*0.5,W*0.82],
              [-L*0.5,-W*0.82],[-L*0.42,-W],[L*0.06,-W*0.62]];
  const top=plan.map(q=>[q[0]*0.9,q[1]*0.78]);
  out.push(PNL(top.map(q=>[q[0],0,q[1]]),plan.map(q=>[q[0],0,q[1]]),[0,1,0],H,{ribs:0}));
  out.push(CAP([L*0.36,H*0.36,0],[-L*0.30,H*0.40,0],sp,
    {det:hullDet([0.25,0.5,0.75],[0.5,3.9],[])}));
  if(P.detail>0.3)for(const sgn of [1,-1])
    out.push(BOX([-L*0.30,H*0.12,sgn*W*0.5],[L*0.12,0,0],[0,H*0.40,0],[0,0,W*0.11],{det:{ribs:3}}));
  out.push(TUB([-L*0.5,H*0.06,0],[-L*0.54,H*0.06,0],H*0.58,H*0.52,{hideA:true}));
  return {sr,sockets:{
    cockpit:FR([L*0.46,H*0.38,0],[1,0,0],[0,1,0],[0,0,1],
               {x:L*0.20,y:sp*2.4,z:sp*2.4},false,sp),
    wing:FR([-L*0.30,0,W*0.94],[0,0,1],[0,1,0],[1,0,0],
            {x:L*0.17,y:H*0.9,z:L*0.20},false,H*0.42),
    tail:FR([-L*0.34,H*0.62,0],[0,1,0],[1,0,0],[0,0,1],
            {x:L*0.18,y:L*0.16,z:W*0.55},false,sp*0.9),
    booster:FR([-L*0.54,H*0.06,0],[-1,0,0],[0,1,0],[0,0,1],
               {x:L*0.18,y:H*1.2,z:W*0.45},false,H*0.52),
    gear:FR([0,-H*0.5,0],[0,-1,0],[1,0,0],[0,0,1],
            {x:H*1.6,y:L*0.26,z:W*0.55},false,H*0.45)
  }};
}},

{n:"ASYMMETRIC",role:["ITV","INDEPENDENT TRADER"],spine:true,make(R,rr,P,out,lock,opts){
  const sr=1.7+P.fuse*1.0, L=(13+P.fuse*13)*rr(0.9,1.1);
  const sp=composeSpine(-L*0.5,L*0.5,sr,rr,R,P,out,lock,opts);
  const tail=sp.xTail;
  /* a big cargo mass on one side only */
  const pz=sr*rr(2.0,2.8), pr=sr*rr(0.9,1.3), px=L*rr(-0.16,0.10);
  out.push(CAP([px+L*0.20,0,pz],[px-L*0.20,0,pz],pr,{solo:true,
    det:hullDet([0.2,0.45,0.7],[0.5,3.9],[])}));
  for(const dx of [px+L*0.13,px-L*0.11])
    out.push(CAP([dx,0,sr*0.7],[dx,0,pz-pr*0.7],sr*0.24,{solo:true}));
  /* and a counterweight boom the other way */
  const bz=-sr*rr(2.2,3.4);
  out.push(CAP([px+L*0.03,0,-sr*0.7],[px+L*0.03,0,bz],sr*0.2,{solo:true}));
  out.push(SPH([px+L*0.03,0,bz],sr*rr(0.42,0.62),{solo:true,det:{rings:[0.3,0.5,0.7]}}));
  return {sr,spine:sp,sockets:{
    cockpit:FR([L*0.5,0,0],[1,0,0],[0,1,0],[0,0,1],{x:L*0.28,y:sr*2.2,z:sr*2.2},false,sr),
    wing:FR([px,-pr*0.2,pz+pr*0.85],[0,0,1],[0,1,0],[1,0,0],
            {x:L*0.28,y:pr*1.4,z:L*0.22},true,pr*0.7),
    tail:FR([sp.tailX,sp.tailY,0],[0,1,0],[1,0,0],[0,0,1],
            {x:L*0.22,y:L*0.20,z:L*0.18},false,sr*0.7),
    booster:FR([tail,0,0],[-1,0,0],[0,1,0],[0,0,1],{x:L*0.28,y:sr*2.2,z:sr*2.2},false,sr),
    gear:FR([sp.gearX,sp.gearY,0],[0,-1,0],[1,0,0],[0,0,1],
            {x:sr*1.9,y:L*0.28,z:sr*1.5},false,sr*0.6)
  }};
}},

/* --------------- 5. ring: an annulus around a spine, no keel at all --------------- */
{n:"RING",role:["SRV","SURVEY RING"],make(R,rr,P,out){
  const sr=1.5+P.fuse*0.8, Rr=(6+P.fuse*4)*rr(0.9,1.1), tr=Rr*rr(0.08,0.13);
  const L=Rr*rr(0.95,1.4), rx=-L*rr(0.0,0.16);
  out.push(CAP([L*0.5,0,0],[-L*0.5,0,0],sr,{hideA:true,hideB:true,
    det:hullDet([0.25,0.5,0.75],[0.5,3.9],[])}));
  const seg=20;
  for(let i=0;i<seg;i++){
    const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2;
    out.push(CAP([rx+Math.cos(a0)*Rr,0,Math.sin(a0)*Rr],
                 [rx+Math.cos(a1)*Rr,0,Math.sin(a1)*Rr],tr,{solo:true}));
  }
  for(let i=0;i<4;i++){
    const a=i/4*Math.PI*2+Math.PI/4;
    out.push(TUB([rx,0,0],[rx+Math.cos(a)*(Rr-tr),0,Math.sin(a)*(Rr-tr)],
                 sr*0.30,sr*0.20,{solo:true,hideA:true}));
  }
  if(P.detail>0.35) for(let i=0;i<4;i++){
    const a=i/4*Math.PI*2;
    out.push(BOX([rx+Math.cos(a)*Rr,0,Math.sin(a)*Rr],
      [Math.cos(a)*tr*1.5,0,Math.sin(a)*tr*1.5],[0,tr*1.4,0],
      [-Math.sin(a)*tr*2.2,0,Math.cos(a)*tr*2.2],{solo:true}));
  }
  return {sr,sockets:{
    cockpit:FR([L*0.5,0,0],[1,0,0],[0,1,0],[0,0,1],{x:L*0.5,y:sr*2.2,z:sr*2.2}),
    wing:FR([rx,0,Rr+tr*0.5],[0,0,1],[0,1,0],[1,0,0],{x:Rr*0.45,y:tr*3,z:Rr*0.5}),
    tail:FR([rx,sr*0.85,0],[0,1,0],[1,0,0],[0,0,1],{x:Rr*0.4,y:Rr*0.4,z:Rr*0.4}),
    booster:FR([-L*0.5,0,0],[-1,0,0],[0,1,0],[0,0,1],{x:L*0.45,y:sr*2.0,z:sr*2.0}),
    gear:FR([L*0.1,-sr*0.9,0],[0,-1,0],[1,0,0],[0,0,1],{x:sr*2.0,y:L*0.4,z:sr*1.6})
  }};
}},
/* ---- 12. vane: the pressure hull is a single sphere and nothing else. Two
   lateral pylons carry flat hexagonal vanes standing square to the beam —
   radiator, collector and armour in one plate — so there is no fore-aft body
   to hang anything on, and the ship's whole planform is the pair of vanes. ---- */
{n:"VANE",role:["ICP","VANED INTERCEPTOR"],make(R,rr,P,out){
  const Rb=(3.2+P.fuse*2.4)*rr(0.92,1.10);   /* the pressure sphere is the hull */
  const sr=Rb*0.46;
  const Rp=Rb*rr(1.9,2.6);                   /* vane half-height */
  const hx=Rp*rr(0.50,0.64);                 /* vane half-chord  */
  const h1=Rp*rr(0.56,0.74);                 /* shoulder height  */
  const th=Rb*rr(0.15,0.22);                 /* vane thickness   */
  const zp=Rb+Rp*rr(0.34,0.54)+th;           /* vane mid-plane   */

  out.push(SPH([0,0,0],Rb,{det:hullDet([0.3,0.5,0.7],[],[])}));
  /* the forward hatch ring stays visible around whatever cockpit plugs in */
  out.push(DSC([Rb*0.80,0,0],[1,0,0],Rb*0.56,Rb*0.30));
  if(P.detail>0.45)
    out.push(BOX([-Rb*0.60,Rb*0.54,0],[Rb*0.20,0,0],[0,Rb*0.10,0],[0,0,Rb*0.34],
                 {det:{ribs:3}}));

  /* one pylon and one vane, authored to starboard: the mirror pass makes the
     pair, and everything the vane carries comes back with it */
  const hex=[[hx,h1],[0,Rp],[-hx,h1],[-hx,-h1],[0,-Rp],[hx,-h1]];
  const at=(k,z)=>hex.map(q=>[q[0]*k,q[1]*k,z]);
  out.push(TUB([0,0,Rb*0.55],[0,0,zp-th*0.5],Rb*0.42,Rb*0.28,{hideA:true}));
  out.push(TUB([0,0,Rb*0.58],[0,0,Rb*0.92],Rb*0.56,Rb*0.46,{hideA:true}));
  out.push(PNL(at(1,zp),null,[0,0,1],th,{}));
  /* a frame plate stands proud of each face, spoked out to the corners: two
     concentric outlines edge-on, and the vane is braced from both sides so the
     inboard one is not a blank slab when the pictorial looks at its back */
  const fk=rr(0.64,0.76), tt=th*rr(0.34,0.52), rt=th*0.18, rw=th*0.52;
  for(const sg of [1,-1]){
    const zf=zp+sg*(th*0.5+tt*0.5);
    out.push(PNL(at(fk,zf),null,[0,0,1],tt,{}));
    if(P.detail>0.4){
      const zs=zf+sg*(tt*0.5+rt);
      for(const q of hex){
        const vx=q[0]*fk*0.94, vy=q[1]*fk*0.94, L2=Math.hypot(vx,vy)||1;
        out.push(BOX([vx*0.5,vy*0.5,zs],[vx*0.5,vy*0.5,0],
                     [-vy/L2*rw,vx/L2*rw,0],[0,0,rt]));
      }
    }
  }
  return {sr,sockets:{
    cockpit:FR([Rb*0.92,0,0],[1,0,0],[0,1,0],[0,0,1],{x:Rb*1.25,y:Rb*1.1,z:Rb*1.1}),
    /* the wing socket rides the pylon and is stopped short of the vane, so a
       wing reads as the strake between hull and plate instead of piercing it */
    wing:FR([0,0,Rb*0.74],[0,0,1],[0,1,0],[1,0,0],
            {x:Math.max(sr*1.2,(zp-th*0.5-Rb*0.74)*0.80),y:Rb*0.62,z:Rb*1.15}),
    tail:FR([0,Rb*0.90,0],[0,1,0],[1,0,0],[0,0,1],{x:Rb*0.85,y:Rb*0.95,z:Rb*0.75}),
    booster:FR([-Rb*0.92,0,0],[-1,0,0],[0,1,0],[0,0,1],{x:Rb*1.15,y:Rb*1.0,z:Rb*1.0}),
    gear:FR([0,-Rb*0.90,0],[0,-1,0],[1,0,0],[0,0,1],{x:Rb*1.5,y:Rb*1.0,z:Rb*1.4})
  }};
}}
];

/* ===================== fit-out =====================
   Everything above decides what the ship IS: which masses, which chain of
   sections, which variant fills each socket. This runs once all of that has
   settled and decides what has been BOLTED TO it — cable runs, receptacles,
   access plates, inspection ports. It reads the finished parts list back and
   works in each surface's own parameter space, the same trick the hatch uses,
   so a run follows the form instead of swimming across it.

   Nothing here is mirrored. Plumbing is the one thing on a ship with no reason
   to be symmetrical, and that asymmetry is most of what makes two hulls off the
   same slot recipe read as different ships. It is also why the pass runs after
   the registry: a cable is not displacement, so the length, beam and tonnage on
   the plate must not move when the detail slider does. */
const inPoly=(poly,X,Y)=>{
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    if((poly[i][1]>Y)!==(poly[j][1]>Y)&&
       X<(poly[j][0]-poly[i][0])*(Y-poly[i][1])/((poly[j][1]-poly[i][1])||1e-9)+poly[i][0])
      inside=!inside;
  }
  return inside;
};
/* one host surface, parameterised on the unit square. u wraps where the form
   wraps, so a run that leaves one edge comes back on the other by itself. */
function surfaceOf(p,R){
  if(p.k==="sphere")
    return {span:p.r*2.2,curv:p.r,at:(u,v)=>{
      const th=u*Math.PI*2, ph=Math.acos(Math.max(-1,Math.min(1,1-2*v)));
      const n=[Math.cos(ph),Math.sin(ph)*Math.cos(th),Math.sin(ph)*Math.sin(th)];
      return {q:V.add(p.c,V.mul(n,p.r)),n};
    }};
  if(p.k==="capsule"||p.k==="tube"){
    const d=V.sub(p.b,p.a), L=V.len(d);
    if(L<1e-6)return null;
    const ax=V.mul(d,1/L), [bu,bv]=basis(ax);
    const r1=p.k==="capsule"?p.r:p.r1, r2=p.k==="capsule"?p.r:p.r2;
    const dr=(r2-r1)/L;
    return {span:Math.min(L,Math.max(r1,r2)*3),curv:Math.min(r1,r2),at:(u,v)=>{
      const th=u*Math.PI*2;
      const rad=V.add(V.mul(bu,Math.cos(th)),V.mul(bv,Math.sin(th)));
      const r=r1+(r2-r1)*v;
      return {q:V.add(V.add(p.a,V.mul(ax,L*v)),V.mul(rad,r)),
              n:V.norm(V.sub(rad,V.mul(ax,dr)))};
    }};
  }
  if(p.k==="box"){
    const f=Math.floor(R()*6), s=(f&1)?1:-1;
    const [e1,e2,e3]=f<2?[p.v,p.w,p.u]:f<4?[p.u,p.w,p.v]:[p.u,p.v,p.w];
    const n=V.norm(V.mul(e3,s)), o=V.add(p.c,V.mul(e3,s));
    return {span:Math.max(V.len(e1),V.len(e2))*2,flat:true,at:(u,v)=>
      ({q:V.add(o,V.add(V.mul(e1,u*2-1),V.mul(e2,v*2-1))),n})};
  }
  if(p.k==="panel"){
    const s=R()<0.5?1:-1, n=V.norm(V.mul(p.n,s));
    const [bu,bv]=basis(p.n), o=V.add(p.pts[0],V.mul(n,p.th*0.5));
    const poly=p.pts.map(q=>[V.dot(V.sub(q,p.pts[0]),bu),V.dot(V.sub(q,p.pts[0]),bv)]);
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
    for(const q of poly){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);
                         y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);}
    return {span:Math.max(x1-x0,y1-y0),flat:true,
      ok:(u,v)=>inPoly(poly,x0+(x1-x0)*u,y0+(y1-y0)*v),
      at:(u,v)=>({q:V.add(o,V.add(V.mul(bu,x0+(x1-x0)*u),V.mul(bv,y0+(y1-y0)*v))),n})};
  }
  return null;
}
function fitOut(parts,R,rr,P,sr){
  if(P.detail<0.18)return;
  const hosts=[];
  for(const p of parts){
    if(p.k==="disc"||p.k==="lathe")continue;
    const s=p.k==="sphere"?p.r
           :p.k==="box"?Math.max(V.len(p.u),V.len(p.v),V.len(p.w))
           :p.k==="panel"?p.th*8
           :V.len(V.sub(p.b,p.a));
    if(s>sr*0.7)hosts.push(p);
  }
  if(!hosts.length)return;
  const solids=parts.slice();
  const clear=q=>{for(const c of solids)if(inSolid(q,c))return false;return true;};
  const out=[];
  /* the budget is the detail slider's, and it is spent per feature rather than
     per part: a cable run is one feature however many segments it takes */
  const N=Math.round(7+P.detail*26);
  /* a hard ceiling on the whole pass. The sheet is redrawn every frame of the
     spin, so fit-out has to be affordable at 60 Hz on a phone, not merely
     affordable once. */
  const CAP=Math.round(34+P.detail*76);
  const used=new Map();
  for(let i=0;i<N;i++){
    if(out.length>=CAP)break;
    const host=hosts[Math.floor(R()*hosts.length)];
    /* three features is a fitted-out part; six is a rash */
    const nu=used.get(host)||0;
    if(nu>=4)continue;
    const S2=surfaceOf(host,R);
    if(!S2)continue;
    used.set(host,nu+1);
    const g=sr*rr(0.11,0.19);                        /* gauge of the fit-out */
    const u0=R(), v0=rr(0.12,0.88);
    if(S2.ok&&!S2.ok(u0,v0))continue;
    const a=S2.at(u0,v0);
    if(!a||!clear(V.add(a.q,V.mul(a.n,g*1.6))))continue;
    /* A cable run wants curvature to read against. On a flat host it comes out
       as a straight bar lying on a straight face — indistinguishable from
       structure, and on a vane it reads as a spoke that has slipped. So flat
       surfaces take plates and receptacles only, and the runs live on the
       fuselages, bells and spheres where they look like plumbing. */
    const roll=S2.flat?0.42+R()*0.58:R();
    if(roll<0.42){
      /* a cable run: stepped along the surface, clamped at both ends */
      /* runs go along the form rather than round it: a cable that wraps out
         of sight is a cable nobody sees */
      const du=rr(-0.10,0.10), dv=rr(-0.52,0.52);
      const u1=u0+du, v1=Math.max(0.06,Math.min(0.94,v0+dv));
      const seg=Math.max(3,Math.round(4+P.detail*4));
      const pts=[],nrm=[];
      for(let k2=0;k2<=seg;k2++){
        const t2=k2/seg, s3=S2.at(u0+(u1-u0)*t2,v0+(v1-v0)*t2);
        if(!s3){pts.length=0;break;}
        /* half proud, half bedded in: a run that merely touches the surface
           is a run that reads as floating the moment the hull curves away
           under it, and a cable is laid in a trough anyway */
        pts.push(V.add(s3.q,V.mul(s3.n,g*0.5)));nrm.push(s3.n);
      }
      if(pts.length<3)continue;
      /* the offset for a parallel pair is taken against the LOCAL normal at
         each station, not the one where the run started: on a sphere a fixed
         sideways vector walks the second cable off the hull within a few steps */
      const sideAt=k2=>{
        const t1=V.norm(V.sub(pts[Math.min(k2+1,pts.length-1)],pts[Math.max(k2-1,0)]));
        return V.norm(V.cross(t1,nrm[k2]));
      };
      const nw=1+Math.floor(R()*2);                  /* one cable or a pair */
      for(let w2=0;w2<nw;w2++){
        const off=(w2-(nw-1)*0.5)*g*2.3;
        for(let k2=0;k2<pts.length-1;k2++)
          out.push(TUB(V.add(pts[k2],V.mul(sideAt(k2),off)),
                       V.add(pts[k2+1],V.mul(sideAt(k2+1),off)),
                       g,g,{hideA:true,hideB:true,bare:true}));
      }
      for(const k2 of [0,pts.length-1]){
        const t1=V.norm(V.sub(pts[Math.min(k2+1,pts.length-1)],pts[Math.max(k2-1,0)]));
        out.push(BOX(V.add(pts[k2],V.mul(nrm[k2],g*0.1)),V.mul(t1,g*0.8),
                     V.mul(nrm[k2],g*0.9),V.mul(sideAt(k2),g*(1.1+nw*0.8)),{bare:true}));
      }
    }else if(roll<0.72){
      /* receptacles: a stub and its face, in a little cluster */
      const nk=1+Math.floor(R()*3);
      for(let k2=0;k2<nk;k2++){
        const s3=S2.at(u0+k2*g/(S2.span||1)*rr(1.4,2.6),v0+k2*rr(-0.05,0.05));
        if(!s3)continue;
        if(S2.ok&&!S2.ok(u0+k2*0.04,v0))continue;
        const r=Math.min(g*rr(1.7,2.8),(S2.curv||1e9)*0.5), h=g*rr(0.9,1.7);
        if(r<g*0.8)continue;
        out.push(TUB(V.sub(s3.q,V.mul(s3.n,g*0.4)),V.add(s3.q,V.mul(s3.n,h)),r,r*0.86,
                     {hideA:true,bare:true}));
        out.push(DSC(V.add(s3.q,V.mul(s3.n,h)),s3.n,r*0.86,r*rr(0.30,0.46),{bare:true}));
      }
    }else{
      /* an access plate, lying flush and lipped */
      const t1=V.norm(V.cross(a.n,Math.abs(a.n[1])>0.9?[1,0,0]:[0,1,0]));
      const t2=V.cross(a.n,t1);
      /* a plate is flat and the hull under it is often not. Sized off the
         gauge alone it hangs off a slim pylon like a shelf, so it is clamped
         to the host's own radius of curvature and to the room on that face. */
      const lim=Math.min((S2.curv||1e9)*0.62,(S2.span||1e9)*0.34);
      const w2=Math.min(g*rr(3.6,8.0),lim), h2=Math.min(g*rr(2.6,6.0),lim),
            th=g*rr(0.34,0.62);
      if(w2<g*1.4||h2<g*1.1)continue;
      const c=V.add(a.q,V.mul(a.n,th*0.34));   /* bedded, not balanced on top */
      if(!clear(V.add(c,V.mul(t1,w2*0.98))))continue;
      /* a plate is the one feature with real corners, so it is the one that can
         hang off the edge of a cut face. Test them in the host's own parameter
         space before committing it. */
      if(S2.ok){
        const du2=w2/(S2.span||1), dv2=h2/(S2.span||1);
        let off=false;
        for(const [su,sv] of [[1,1],[1,-1],[-1,1],[-1,-1]])
          if(!S2.ok(u0+su*du2,v0+sv*dv2))off=true;
        if(off)continue;
      }
      out.push(BOX(c,V.mul(t1,w2),V.mul(t2,h2),V.mul(a.n,th),
                   {bare:true,det:{ribs:2+Math.floor(R()*3)}}));
      if(R()<0.5)
        out.push(DSC(V.add(c,V.mul(a.n,th*0.6)),a.n,Math.min(w2,h2)*0.28,0,{bare:true}));
    }
  }
  /* inspection ports cost no geometry at all: they are circles cut on a surface
     the drawing is already stroking, so they are free where a plate is not */
  const rings=parts.filter(p=>(p.k==="tube"||p.k==="capsule")&&p.det&&!p.bare);
  for(let i=0;i<Math.round(P.detail*10);i++){
    if(!rings.length)break;
    const p=rings[Math.floor(R()*rings.length)], d=p.det;
    p.det={rings:d.rings,longs:d.longs,
           ports:(d.ports||[]).concat([{t:rr(0.15,0.85),th:R()*Math.PI*2,
                                        r:sr*rr(0.10,0.22)}])};
  }
  for(const q of out)parts.push(q);
}

function buildShip(seed,P,lock){
  const R=mulberry32(seed|0), rr=(a,b)=>a+(b-a)*R(), pick=a=>a[Math.floor(R()*a.length)|0];
  const parts=[], envs=[], chosen={};

  const tIdx=(lock&&lock.topo!=null)?Math.min(lock.topo,TOPO.length-1):Math.floor(R()*TOPO.length);
  const topo=TOPO[tIdx];
  chosen.topo={i:tIdx,n:topo.n};
  const NA={i:0,n:"—"};
  chosen.fore=chosen.joint=chosen.aft=chosen.nsec=NA;chosen.recipe="";
  const chassis=topo.make(R,rr,P,parts,lock);

  /* rolled on its own, so three ships in four carry more than one hull */
  const hIdx=(lock&&lock.hulls!=null)?Math.min(lock.hulls,HULLN.length-1)
                                     :Math.floor(R()*HULLN.length);
  const nHull=hIdx+1;
  chosen.hulls={i:hIdx,n:HULLN[hIdx].n};
  if(nHull>1){
    const extra=addHulls(nHull,leadExtent(parts),chassis.sr,R,rr,P,parts,lock,{});
    if(extra&&extra.gear)chassis.sockets.gear=extra.gear;
  }

  if(chassis.spine){
    const sp=chassis.spine;
    chosen.fore={i:sp.fore.i,n:sp.fore.n};
    chosen.aft={i:sp.aft.i,n:sp.aft.n};
    chosen.joint={i:sp.joint.i,n:sp.joint.n};
    chosen.nsec={i:sp.nSec-2,n:sp.nSec+" SECTION"+(sp.nSec>1?"S":"")};
    chosen.recipe=chassis.recipe||sp.secs.map(q=>q.n).join(" + ");
    chosen.recipeShort=chassis.recipeShort||chosen.recipe;
  }

  /* The mount is a point, but a variant that spreads out — gear legs, twin
     fins — needs the hull surface at each of its feet, not at the socket. */
  const hullSoFar=parts.slice();
  /* The reach used to be chassis.sr*5, which is the beam — fine on a hull whose
     feet spread about as far as it is wide, hopeless on an edge-on spade that
     is six times taller than it is broad. A foot out past the old reach found
     nothing, took the 0, and rooted its leg in mid-air with the buried cap
     still flagged hidden: a strut open at the top, floating. The reach now
     follows the socket's own envelope, and a miss falls back to the depth under
     the socket origin — which is on the hull by construction — instead of 0. */
  const probeFor=(fr,E)=>{
    const back=V.mul(V.norm(fr.f),-1);
    const M=Math.max(chassis.sr*5,E.x*1.7+E.y*0.9), N=48;
    const hit=(u,v)=>{
      const base=V.add(fr.o,V.add(V.mul(fr.u,u),V.mul(fr.s,v)));
      for(let i=0;i<=N;i++){
        const d=M*i/N, q=V.add(base,V.mul(back,d));
        for(const cp of hullSoFar) if(inSolid(q,cp)) return d;
      }
      return -1;
    };
    const home=Math.max(0,hit(0,0));
    /* an open frame is mostly gaps, so a ray straight up can slip between two
       members with solid metal either side of it. Nudge and retry before giving
       up — the leg then roots on the member it was a hair away from. */
    const du=E.y*0.11, dv=E.z*0.11;
    return (u,v)=>{
      let d=hit(u,v);
      if(d<0)for(const [au,av] of [[du,0],[-du,0],[0,dv],[0,-dv],[du,dv],[-du,-dv]]){
        d=hit(u+au,v+av);
        if(d>=0)break;
      }
      /* no ceiling on the depth: clamping it was quietly guaranteeing the very
         thing this is here to prevent, since a truncated root sits below the
         surface it was meant to bury itself in. A long leg is handled by making
         it thicker, not by cutting it short. */
      return d<0?home:d;
    };
  };

  for(const id of ["cockpit","wing","tail","booster","gear"]){
    const sock=chassis.sockets[id];
    if(!sock)continue;
    const list=VAR[id];
    let idx=(lock&&lock[id]!=null)?Math.min(lock[id],list.length-1):Math.floor(R()*list.length);
    /* Gear is grounded for now. A deployed leg is sized to reach the ground
       under the HULL, but on a vaned ship the lowest point is the bottom edge
       of a vane, so the legs stopped short and the ship hung off them in mid
       air. Until the probe measures to the whole ship's underside rather than
       the hull's, nothing rolls gear down — the roll still happens so the seed
       stream is unchanged, and locking the rail still deploys any of them. */
    if(id==="gear"&&(!lock||lock.gear==null))idx=0;
    const v=list[idx];
    chosen[id]={i:idx,n:v.n,crew:v.crew||0};
    const out=[];
    const mr=sock.sr||Math.min(chassis.sr,sock.E.y*0.8,sock.E.z*0.8);
    v.make(builder(sock.fr,out),mr,rr,R,sock.E,probeFor(sock.fr,sock.E));
    for(const p of out){applyOps(p,sock.fr);p.slot=true;p.g=id;p.sd=V.norm(sock.fr.f);
      if(sock.solo)p.solo=true;}
    parts.push(...out);
    const f=sock.fr;
    envs.push({id,c:V.add(f.o,V.mul(f.f,sock.E.x*0.5)),
      u:V.mul(f.f,sock.E.x*0.5),v:V.mul(f.u,sock.E.y),w:V.mul(f.s,sock.E.z)});
  }

  /* Symmetry is a design axis, not a constant. The chassis always mirrors about
     the centreline; what is bolted to it can instead be repeated radially, which
     turns one wing into three fins and one leg into a tripod. Only offered where
     the hull is actually centred on the axis — a forked spine has no axis to
     rotate about, so it falls back to bilateral. */
  const mir=p=>{
    const g=v=>[v[0],v[1],-v[2]];
    const q=Object.assign({},p);
    for(const k of ["c","a","b","n","u","v","w","axis","sd"]) if(q[k])q[k]=g(q[k]);
    if(q.pts)q.pts=q.pts.map(g);
    if(q.pts2)q.pts2=q.pts2.map(g);
    return q;
  };
  const zOf=p=>{
    if(p.pts)return p.pts.reduce((s,q)=>s+q[2],0)/p.pts.length;
    if(p.c)return p.c[2];
    return (p.a[2]+p.b[2])/2;
  };
  const rotX=(p,th)=>{
    const c=Math.cos(th),sn=Math.sin(th);
    const g=v=>[v[0],v[1]*c-v[2]*sn,v[1]*sn+v[2]*c];
    const q=Object.assign({},p);
    for(const k of ["c","a","b","n","u","v","w","axis","sd"]) if(q[k])q[k]=g(q[k]);
    if(q.pts)q.pts=q.pts.map(g);
    if(q.pts2)q.pts2=q.pts2.map(g);
    return q;
  };
  const radOf=p=>{const c=partCentroid(p);return Math.hypot(c[1],c[2]);};

  const forked=chassis.spine?Math.abs(chassis.spine.endOff[2])>1e-6:false;
  const axialOK=!!topo.axial&&!forked&&nHull===1;
  const syI=axialOK?((lock&&lock.sym!=null)?Math.min(lock.sym,SYM.length-1):Math.floor(R()*SYM.length)):0;
  chosen.sym={i:syI,n:axialOK?SYM[syI].n:"BILATERAL"};

  for(const p of parts.slice()) if(!p.solo&&!p.slot&&Math.abs(zOf(p))>1e-4) parts.push(mir(p));
  const slotParts=parts.filter(p=>p.slot&&!p.solo);
  if(syI===0){
    for(const p of slotParts) if(Math.abs(zOf(p))>1e-4){const q=mir(p);q.g=p.g+"#m";parts.push(q);}
  }else{
    const N=SYM[syI].k, thr=chassis.sr*0.25;
    for(const p of slotParts){
      if(radOf(p)<thr)continue;
      for(let k2=1;k2<N;k2++){const q=rotX(p,k2*Math.PI*2/N);q.g=p.g+"#"+k2;parts.push(q);}
    }
  }

  /* ---- attachment guarantee ----
     The probe roots each variant on the surface it actually sits on. This is
     the net under that: every bolted-on group is tested against real solids,
     not bounding boxes, and anything not touching is drawn back along its own
     mounting direction until it is. Dropped only if it never can be. */
  const chassisSolids=parts.filter(p=>!p.slot);
  const touches=grp=>{
    for(const p of grp)
      for(const [q,rd] of partExtents(p)){
        if(chassisSolids.some(c=>inSolid(q,c)))return true;
        if(rd>0){
          for(const ax of [[rd,0,0],[-rd,0,0],[0,rd,0],[0,-rd,0],[0,0,rd],[0,0,-rd]])
            if(chassisSolids.some(c=>inSolid(V.add(q,ax),c)))return true;
        }
      }
    return false;
  };
  const shift=(p,d)=>{
    const t=v=>[v[0]+d[0],v[1]+d[1],v[2]+d[2]];
    for(const k of ["c","a","b"]) if(p[k])p[k]=t(p[k]);
    if(p.pts)p.pts=p.pts.map(t);
    if(p.pts2)p.pts2=p.pts2.map(t);
  };
  const groups={};
  for(const p of parts) if(p.slot){(groups[p.g]=groups[p.g]||[]).push(p);}
  const dropped=[];
  for(const key in groups){
    const gp=groups[key];
    if(touches(gp))continue;
    /* first try straight back down the mount, then radially inward */
    const dirs=[];
    if(gp[0].sd) dirs.push(V.mul(V.norm(gp[0].sd),-1));
    let cen=[0,0,0],n=0;
    for(const p of gp){cen=V.add(cen,partCentroid(p));n++;}
    cen=V.mul(cen,1/Math.max(n,1));
    const rad=Math.hypot(cen[1],cen[2]);
    if(rad>1e-6)dirs.push([0,-cen[1]/rad,-cen[2]/rad]);
    dirs.push([cen[0]>0?-1:1,0,0]);
    let fixed=false;
    for(const dir of dirs){
      const span=Math.max(rad,Math.abs(cen[0]),chassis.sr)||1;
      const stepv=V.mul(dir,span/26);
      for(let k2=1;k2<=30;k2++){
        for(const p of gp)shift(p,stepv);
        if(touches(gp)){fixed=true;break;}
      }
      if(fixed)break;
      for(const p of gp)shift(p,V.mul(stepv,-30));   /* rewind and try the next direction */
    }
    if(!fixed)dropped.push(key);
  }
  if(dropped.length){
    const kill=new Set(dropped);
    for(let i=parts.length-1;i>=0;i--) if(parts[i].slot&&kill.has(parts[i].g)) parts.splice(i,1);
  }

  /* registry, derived from what actually got built */
  let vol=0;const pts=[];
  for(const p of parts){
    if(p.k==="sphere"){vol+=4/3*Math.PI*p.r**3;pts.push([p.c,p.r]);}
    else if(p.k==="capsule"){vol+=Math.PI*p.r*p.r*V.len(V.sub(p.b,p.a))+4/3*Math.PI*p.r**3;
      pts.push([p.a,p.r],[p.b,p.r]);}
    else if(p.k==="tube"){vol+=Math.PI/3*(p.r1*p.r1+p.r1*p.r2+p.r2*p.r2)*V.len(V.sub(p.b,p.a));
      pts.push([p.a,p.r1],[p.b,p.r2]);}
    else if(p.k==="disc"){vol+=Math.PI*p.r*p.r*p.r*0.18;pts.push([p.c,p.r]);}
    else if(p.k==="lathe"){
      const e=p.ell?p.ell[0]*p.ell[1]:1;
      for(let i=1;i<p.prof.length;i++){
        const h=Math.abs(p.prof[i][0]-p.prof[i-1][0]),r1=p.prof[i-1][1],r2=p.prof[i][1];
        vol+=Math.PI/3*(r1*r1+r1*r2+r2*r2)*h*e;
      }
      for(const [tt,r] of p.prof)pts.push([V.add(p.c,V.mul(p.axis,tt)),r*Math.max(p.ell?p.ell[0]:1,p.ell?p.ell[1]:1)]);}
    else if(p.k==="box"){vol+=8*V.len(p.u)*V.len(p.v)*V.len(p.w);
      for(let i=0;i<8;i++)pts.push([V.add(p.c,V.add(V.mul(p.u,i&1?1:-1),
        V.add(V.mul(p.v,i&2?1:-1),V.mul(p.w,i&4?1:-1)))),0]);}
    else if(p.k==="panel"){
      let a2=0;for(let i=1;i<p.pts.length-1;i++)
        a2+=V.len(V.cross(V.sub(p.pts[i],p.pts[0]),V.sub(p.pts[i+1],p.pts[0])))/2;
      vol+=a2*p.th;
      for(const q of p.pts)pts.push([q,p.th]);
      if(p.pts2)for(const q of p.pts2)pts.push([q,p.th]);}
  }
  const bb=[[1e9,1e9,1e9],[-1e9,-1e9,-1e9]];
  for(const [q,r] of pts)for(let i=0;i<3;i++){
    bb[0][i]=Math.min(bb[0][i],q[i]-r);bb[1][i]=Math.max(bb[1][i],q[i]+r);}


  /* No two ships may carry the same designation, and luck is not a good enough
     guarantee. The seed is a 32-bit word; read it as a mixed-radix number whose
     digits ARE the designation — one digit names the ship, two are the yard
     block letters, and the remainder is the pennant. Digit extraction is a
     bijection, so the seed can be reconstructed from the name on the plate and
     all 4,294,967,296 hulls are distinct by construction, not by odds.
       304 names x 26 x 26 letters x 20,900 pennants > 2^32. */
  const NB=BIRDS.length, AZ=26;
  let u=seed>>>0;
  const name=BIRDS[u%NB];             u=(u-u%NB)/NB;
  const b1=u%AZ;                      u=(u-b1)/AZ;
  const b2=u%AZ;                      u=(u-b2)/AZ;
  const block=String.fromCharCode(65+b1,65+b2), pennant=u;
  const klass=pick(BIRDS);
  const role = chosen.gear.i===0&&topo.n==="KEEL" ? ["OSV","ORBITAL SERVICE VEHICLE"] : topo.role;

  /* Dead last: the layout is settled, weighed and named. Running the fit-out
     here rather than a few lines earlier is what keeps it decoration — it draws
     from the same stream, so it cannot shift the class name or the pennant, and
     it lands after the registry, so it cannot shift the tonnage or the
     dimensions either. The same hull with the detail slider at either end is
     the same ship on the plate, wearing more or less plumbing. */
  fitOut(parts,R,rr,P,chassis.sr);
  return {parts,envs,chosen,bb,meta:{
    desig:`${role[0]}-${block}${String(pennant).padStart(5,"0")} ${name}`,
    klass:`${klass}-CLASS ${role[1]}`,
    length:bb[1][0]-bb[0][0], beam:bb[1][2]-bb[0][2], height:bb[1][1]-bb[0][1],
    mass:vol*0.21, crew:chosen.cockpit.crew, note:topo.note||"",
    sym:chosen.sym.n, seed}};
}

/* variant post-ops: cant a fin, shift it outboard, lay it horizontal */
function applyOps(p,fr){
  if(p.k!=="panel")return;
  const rot=(q,ax,ang)=>{
    const c=Math.cos(ang),s=Math.sin(ang),k=V.sub(q,fr.o);
    const r=V.add(V.add(V.mul(k,c),V.mul(V.cross(ax,k),s)),V.mul(ax,V.dot(ax,k)*(1-c)));
    return V.add(fr.o,r);
  };
  if(p.cant){p.pts=p.pts.map(q=>rot(q,V.norm(fr.u),p.cant));p.n=V.norm(
    V.add(V.mul(p.n,Math.cos(p.cant)),V.mul(V.cross(V.norm(fr.u),p.n),Math.sin(p.cant))));}
  if(p.shiftZ)p.pts=p.pts.map(q=>V.add(q,V.mul(fr.s,p.shiftZ)));
}

/* ===================== targets ===================== */
function CanvasTarget(ctx){
  return {
    rect(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);},
    poly(pts,fill,stroke,w){
      if(pts.length<2)return;
      ctx.lineJoin="round";ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.closePath();
      if(fill){ctx.fillStyle=fill;ctx.fill();}
      if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.setLineDash([]);ctx.stroke();}
    },
    path(pts,stroke,w,dash){
      if(pts.length<2)return;
      ctx.lineJoin="round";ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.setLineDash(dash||[]);
      ctx.stroke();ctx.setLineDash([]);
    },
    text(str,x,y,o){
      ctx.fillStyle=o.color;
      ctx.font=`${o.weight||600} ${o.size}px "Saira Condensed","Arial Narrow",sans-serif`;
      ctx.textBaseline="alphabetic";ctx.textAlign="left";
      if(o.tracking){
        const ch=[...str];let tot=0;
        for(const c of ch)tot+=ctx.measureText(c).width+o.tracking;
        tot-=o.tracking;
        let cx=o.anchor==="end"?x-tot:o.anchor==="middle"?x-tot/2:x;
        for(const c of ch){ctx.fillText(c,cx,y);cx+=ctx.measureText(c).width+o.tracking;}
      }else{
        ctx.textAlign=o.anchor==="end"?"right":o.anchor==="middle"?"center":"left";
        ctx.fillText(str,x,y);
      }
    }
  };
}
function SvgTarget(W,H){
  const out=[],f=n=>Math.round(n*10)/10,d=p=>p.map(q=>`${f(q[0])},${f(q[1])}`).join(" ");
  return {
    rect(x,y,w,h,fill){out.push(`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${fill}"/>`);},
    poly(pts,fill,stroke,w){if(pts.length<2)return;
      out.push(`<polygon points="${d(pts)}" fill="${fill||"none"}" stroke-linejoin="round" ${stroke?`stroke="${stroke}" stroke-width="${f(w)}"`:'stroke="none"'}/>`);},
    path(pts,stroke,w,dash){if(pts.length<2)return;
      out.push(`<polyline points="${d(pts)}" fill="none" stroke="${stroke}" stroke-width="${f(w)}" stroke-linecap="round" stroke-linejoin="round"${dash?` stroke-dasharray="${dash.map(f).join(" ")}"`:""}/>`);},
    text(str,x,y,o){
      const esc=str.replace(/[<&>]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
      out.push(`<text x="${f(x)}" y="${f(y)}" fill="${o.color}" font-family="Saira Condensed, Arial Narrow, sans-serif" font-weight="${o.weight||600}" font-size="${f(o.size)}" letter-spacing="${f(o.tracking||0)}" text-anchor="${o.anchor==="end"?"end":o.anchor==="middle"?"middle":"start"}">${esc}</text>`);},
    serialize(){return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${out.join("")}</svg>`;}
  };
}

/* ===================== projections ===================== */
const PROJ={profile:p=>[-p[0],p[1],p[2]],plan:p=>[-p[0],p[2],p[1]],bow:p=>[p[2],p[1],p[0]]};
function isoProj(yaw,pitch){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  return p=>{const x1=p[0]*cy-p[2]*sy,z1=p[0]*sy+p[2]*cy,y1=p[1];
    return [x1,y1*cp-z1*sp,y1*sp+z1*cp];};
}
/* ===================== occlusion =====================
   The see-through flicker was the painter's algorithm. Bodies were sorted by
   centroid depth and each one painted a background-coloured fill beneath its
   own outline, erasing whatever had been drawn before it. Centroid order
   cannot describe two solids that interpenetrate — and on this ship every
   socket interpenetrates by design — so as the pictorial turned, the fill of
   a body behind would land on top of a body in front and punch a hole in it.

   The fills are gone. Each ship is tessellated once — the mesh is invariant
   under yaw, only the projection turns — rasterised into a depth buffer, and
   every line the renderer wants to draw is clipped against that buffer. Draw
   order stops mattering, interpenetration is handled for free, and the output
   is still pure vector polylines, so the SVG export gets the same treatment. */
function shipMesh(ship){
  if(ship._mesh)return ship._mesh;
  const T=[];
  const tri=(a,b,c)=>T.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]);
  const quad=(a,b,c,d)=>{tri(a,b,c);tri(a,c,d);};
  const fan=q=>{for(let i=1;i<q.length-1;i++)tri(q[0],q[i],q[i+1]);};
  const band=(A,B)=>{const n=A.length;
    for(let i=0;i<n;i++)quad(A[i],B[i],B[(i+1)%n],A[(i+1)%n]);};
  const bb=ship.bb;
  const diag=Math.hypot(bb[1][0]-bb[0][0],bb[1][1]-bb[0][1],bb[1][2]-bb[0][2])||1;
  /* the buffer, not the mesh, sets the accuracy floor — facet counts stay modest */
  const SG=r=>Math.max(8,Math.min(40,Math.round(8+r/diag*280)));
  for(const p of ship.parts){
    if(p.k==="sphere"){
      const n=SG(p.r),m=Math.max(4,n>>1),rg=[];
      for(let i=0;i<=m;i++){const th=i/m*Math.PI;
        rg.push(ringPts([p.c[0],p.c[1]+Math.cos(th)*p.r,p.c[2]],
                        Math.sin(th)*p.r,[0,1,0],n));}
      for(let i=0;i<m;i++)band(rg[i],rg[i+1]);
    }else if(p.k==="capsule"){
      const ax=V.norm(V.sub(p.b,p.a)),n=SG(p.r),m=Math.max(3,n>>2);
      const A=ringPts(p.a,p.r,ax,n),B=ringPts(p.b,p.r,ax,n);
      band(A,B);
      let pv=A;
      for(let i=1;i<=m;i++){const th=i/m*Math.PI/2;
        const rg=ringPts(V.add(p.a,V.mul(ax,-Math.sin(th)*p.r)),Math.cos(th)*p.r,ax,n);
        band(pv,rg);pv=rg;}
      pv=B;
      for(let i=1;i<=m;i++){const th=i/m*Math.PI/2;
        const rg=ringPts(V.add(p.b,V.mul(ax,Math.sin(th)*p.r)),Math.cos(th)*p.r,ax,n);
        band(pv,rg);pv=rg;}
    }else if(p.k==="tube"){
      const ax=V.norm(V.sub(p.b,p.a)),n=SG(Math.max(p.r1,p.r2));
      const A=ringPts(p.a,p.r1,ax,n),B=ringPts(p.b,p.r2,ax,n);
      band(A,B);fan(A);fan(B);
    }else if(p.k==="box"){
      const c=[];
      for(let j=0;j<8;j++)c.push(V.add(p.c,V.add(V.mul(p.u,j&1?1:-1),
        V.add(V.mul(p.v,j&2?1:-1),V.mul(p.w,j&4?1:-1)))));
      for(const f of [[0,2,6,4],[1,5,7,3],[0,4,5,1],[2,3,7,6],[0,1,3,2],[4,6,7,5]])
        quad(c[f[0]],c[f[1]],c[f[2]],c[f[3]]);
    }else if(p.k==="disc"){
      const nn=V.norm(p.n),th=V.mul(nn,p.r*0.10),n=SG(p.r);
      const a=V.sub(p.c,th),b=V.add(p.c,th);
      const oA=ringPts(a,p.r,nn,n),oB=ringPts(b,p.r,nn,n);
      band(oA,oB);
      if(p.ri>1e-6){
        const iA=ringPts(a,p.ri,nn,n),iB=ringPts(b,p.ri,nn,n);
        band(iB,iA);band(oA,iA);band(iB,oB);
      }else{fan(oA);fan(oB);}
    }else if(p.k==="lathe"){
      const mr=p.prof.reduce((m,q)=>Math.max(m,q[1]),0),n=SG(mr);
      const [bu,bv]=basis(p.axis),ea=p.ell?p.ell[0]:1,eb=p.ell?p.ell[1]:1;
      const rg=p.prof.map(([tt,r])=>{
        const c=V.add(p.c,V.mul(p.axis,tt)),o=[];
        for(let j=0;j<n;j++){const a=j/n*Math.PI*2;
          o.push(V.add(c,V.add(V.mul(bu,r*ea*Math.cos(a)),V.mul(bv,r*eb*Math.sin(a)))));}
        return o;});
      for(let i=0;i<rg.length-1;i++)band(rg[i],rg[i+1]);
      if(p.prof[0][1]>1e-6)fan(rg[0]);
      if(p.prof[p.prof.length-1][1]>1e-6)fan(rg[rg.length-1]);
    }else if(p.k==="panel"){
      const nn=V.norm(p.n),h=V.mul(nn,p.th*0.5),lo=p.pts2||p.pts;
      const up=p.pts.map(q=>V.add(q,h)),dn=lo.map(q=>V.sub(q,h));
      fan(up);fan(dn);band(up,dn);
    }
  }
  const m={t:new Float32Array(T),diag,tris:T.length/9};
  Object.defineProperty(ship,"_mesh",{value:m});
  return m;
}

/* Every projection here is linear, so it collapses to a 3x3 — that keeps the
   inner rasteriser free of array churn. Row 2 is the depth row; larger is nearer. */
function projMatrix(proj){
  const a=proj([1,0,0]),b=proj([0,1,0]),c=proj([0,0,1]);
  return [a[0],b[0],c[0], a[1],b[1],c[1], a[2],b[2],c[2]];
}
function buildDepth(z,ship,proj,res){
  const m=projMatrix(proj);
  const b=viewBBox(ship,proj);
  const sc=res/Math.max(b.w,b.h,1e-6);
  const W=Math.max(2,Math.min(2600,Math.ceil(b.w*sc)+4));
  const H=Math.max(2,Math.min(2600,Math.ceil(b.h*sc)+4));
  const need=W*H;
  if(!z.buf||z.buf.length<need)z.buf=new Float32Array(need);
  const buf=z.buf;
  buf.fill(-1e30,0,need);
  z.w=W;z.h=H;z.sc=sc;z.ox=2-b.x*sc;z.oy=2-b.y*sc;z.m=m;
  const M=shipMesh(ship);
  /* slope-scaled depth offset. Sockets are flush and detail lines lie exactly
     on the surface they belong to, so the mesh is pushed a hair away from the
     eye rather than biasing every query — the classic polygon-offset trade. */
  const flat=M.diag*0.0012;
  const T=M.t,nT=T.length/9;
  for(let i=0;i<nT;i++){
    const o=i*9;
    const ax=T[o],ay=T[o+1],az=T[o+2],bx=T[o+3],by=T[o+4],bz=T[o+5],
          cx=T[o+6],cy=T[o+7],cz=T[o+8];
    const x0=(m[0]*ax+m[1]*ay+m[2]*az)*sc+z.ox,
          y0=(m[3]*ax+m[4]*ay+m[5]*az)*sc+z.oy,
          z0=m[6]*ax+m[7]*ay+m[8]*az;
    const x1=(m[0]*bx+m[1]*by+m[2]*bz)*sc+z.ox,
          y1=(m[3]*bx+m[4]*by+m[5]*bz)*sc+z.oy,
          z1=m[6]*bx+m[7]*by+m[8]*bz;
    const x2=(m[0]*cx+m[1]*cy+m[2]*cz)*sc+z.ox,
          y2=(m[3]*cx+m[4]*cy+m[5]*cz)*sc+z.oy,
          z2=m[6]*cx+m[7]*cy+m[8]*cz;
    let lo=x0<x1?(x0<x2?x0:x2):(x1<x2?x1:x2);
    let hi=x0>x1?(x0>x2?x0:x2):(x1>x2?x1:x2);
    let minx=lo<0?0:Math.floor(lo), maxx=hi>W-1?W-1:Math.ceil(hi);
    if(minx>maxx)continue;
    lo=y0<y1?(y0<y2?y0:y2):(y1<y2?y1:y2);
    hi=y0>y1?(y0>y2?y0:y2):(y1>y2?y1:y2);
    let miny=lo<0?0:Math.floor(lo), maxy=hi>H-1?H-1:Math.ceil(hi);
    if(miny>maxy)continue;
    const area=(x1-x0)*(y2-y0)-(x2-x0)*(y1-y0);
    if(area<1e-9&&area>-1e-9)continue;
    const ia=1/area;
    const dzdx=((z1-z0)*(y2-y0)-(z2-z0)*(y1-y0))*ia;
    const dzdy=((z2-z0)*(x1-x0)-(z1-z0)*(x2-x0))*ia;
    const push=flat+(Math.abs(dzdx)+Math.abs(dzdy))*0.9;
    const s=area<0?-1:1;
    const A0=-(y2-y1),A1=-(y0-y2),A2=-(y1-y0);
    const fx0=minx+0.5;
    for(let py=miny;py<=maxy;py++){
      const fy=py+0.5;
      let w0=((x2-x1)*(fy-y1)-(y2-y1)*(fx0-x1))*s;
      let w1=((x0-x2)*(fy-y2)-(y0-y2)*(fx0-x2))*s;
      let w2=((x1-x0)*(fy-y0)-(y1-y0)*(fx0-x0))*s;
      const d0=A0*s,d1=A1*s,d2=A2*s;
      let zz=z0+dzdx*(fx0-x0)+dzdy*(fy-y0)-push;
      const row=py*W;
      for(let px=minx;px<=maxx;px++,w0+=d0,w1+=d1,w2+=d2,zz+=dzdx){
        if(w0>=0&&w1>=0&&w2>=0){
          const k=row+px;
          if(zz>buf[k])buf[k]=zz;
        }
      }
    }
  }
  return z;
}
/* one buffer per view slot: the pictorial rebuilds on every frame of a spin,
   the three elevations only when the ship or the sheet geometry changes */
/* the depth pass is the frame's real cost, and it scales with area. A phone
   holds the ceiling well below print resolution; the export lifts it. */
let ZCAP=1500;
const ZSLOT=Object.create(null);
function depthBuffer(ship,proj,res,slot,sig){
  const cur=ZSLOT[slot];
  if(cur&&cur.ship===ship&&cur.sig===sig&&cur.res===res)return cur.z;
  const z=(cur&&cur.z)||{buf:null};
  buildDepth(z,ship,proj,res);
  ZSLOT[slot]={ship,sig,res,z};
  return z;
}
function zVis(z,q){
  const m=z.m,qx=q[0],qy=q[1],qz=q[2];
  const px=Math.floor((m[0]*qx+m[1]*qy+m[2]*qz)*z.sc+z.ox);
  if(px<0||px>=z.w)return true;
  const py=Math.floor((m[3]*qx+m[4]*qy+m[5]*qz)*z.sc+z.oy);
  if(py<0||py>=z.h)return true;
  return (m[6]*qx+m[7]*qy+m[8]*qz)>=z.buf[py*z.w+px];
}

/* ===================== view =====================
   House rules from the reference plate: one silhouette weight, one lighter
   detail weight, nothing else; every body is a single closed outline; arc
   segment counts follow projected size so nothing facets at print scale.

   Nothing is filled and nothing is painted over. A line is drawn where the
   depth buffer says it is the nearest surface along that ray, so bodies never
   swap places as the pictorial turns and a body behind can never erase one in
   front. Silhouettes keep the 3D point each hull vertex came from, which is
   what lets the outline be clipped in depth like every other line. */
function drawView(t,ship,proj,scale,ox,oy,pal,lw,reveal,showEnv,slot,sig,hatch){
  const S=p=>{const q=proj(p);return [ox+q[0]*scale,oy-q[1]*scale];};
  const D=p=>proj(p)[2];
  const ink=pal.ink, dw=lw*0.75, hw=lw*0.55;
  const faces=(p,n)=>D(V.add(p,V.mul(n,1e-3)))>D(p);
  const SEG=rpx=>Math.max(14,Math.min(112,Math.round(6+rpx*1.35)));
  /* the eye direction falls out of the projection: it is the depth row */
  const EYE=V.norm([D([1,0,0]),D([0,1,0]),D([0,0,1])]);

  const bv=viewBBox(ship,proj);
  const res=Math.max(200,Math.min(ZCAP,Math.round(Math.max(bv.w,bv.h)*scale*1.2)));
  const z=depthBuffer(ship,proj,res,slot||"iso",sig||"");
  const VIS=q=>zVis(z,q);

  /* open polyline, cut wherever the depth buffer hides it */
  function runs3(pts3,ok,minLen){
    const out=[];let run=[];
    for(let i=0;i<pts3.length;i++){
      const q=pts3[i];
      if(ok(q))run.push(S(q));else{if(run.length>1)out.push(run);run=[];}
    }
    if(run.length>1)out.push(run);
    if(!minLen)return out;
    return out.filter(r=>{
      let L=0;for(let i=1;i<r.length;i++)L+=Math.hypot(r[i][0]-r[i-1][0],r[i][1]-r[i-1][1]);
      return L>minLen;});
  }
  /* closed loop */
  function runs(pts3,ok,minLen){
    const out=[];let run=[];
    for(let i=0;i<=pts3.length;i++){
      const q=pts3[i%pts3.length];
      if(ok(q))run.push(S(q));else{if(run.length>1)out.push(run);run=[];}
    }
    if(run.length>1)out.push(run);
    if(!minLen)return out;
    return out.filter(r=>{
      let L=0;for(let i=1;i<r.length;i++)L+=Math.hypot(r[i][0]-r[i-1][0],r[i][1]-r[i-1][1]);
      return L>minLen;});
  }
  /* a hidden-line cut can land anywhere along an edge, so long straight edges
     are resampled to roughly a 5 px stride before they are tested */
  function dens(pts3,closed,step){
    const out=[],n=pts3.length,last=closed?n:n-1;
    for(let i=0;i<last;i++){
      const A=pts3[i],B=pts3[(i+1)%n],a=S(A),b=S(B);
      const k=Math.max(1,Math.min(64,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/(step||5))));
      for(let j=0;j<k;j++)out.push(V.lerp(A,B,j/k));
    }
    if(!closed)out.push(pts3[n-1]);
    return out;
  }
  /* a depth test cut shorter than a line width is quantisation noise, not a
     visible sliver of hull — dropping it stops the outline speckling as it turns */
  const MINR=Math.max(1.6,lw*1.5);
  const stroke=(pts3,closed,w,minLen)=>{
    const mn=minLen===undefined?MINR:minLen;
    for(const r of (closed?runs(pts3,VIS,mn):runs3(pts3,VIS,mn)))
      t.path(r,ink,w===undefined?lw:w);
  };
  /* silhouette: hull vertices carry the 3D point they were projected from */
  const tag=(pts3,k)=>pts3.map(q=>{const s=S(q);return [s[0],s[1],k,q];});
  const hullLoop=H=>dens(H.map(h=>h[3]),true);

  /* ---- tone =====================================================
     One light, fixed to the eye rather than to the ship, so the shading stays
     put while the model turns. The hatch is cut in each surface's own parameter
     space — meridians on a body of revolution, small circles about the light on
     a sphere, chords in the plane of a flat face — so it sticks to the form
     instead of swimming across it, and it is clipped by the same depth buffer
     as every other line. Density is an ordered dither over the hatch index:
     eight interleaved passes are what let a coarse family read as continuous
     tone, and what makes the field grow a line at a time instead of popping. */
  const HATCH=!!hatch;
  const PM=projMatrix(proj);
  const LV=[-0.42,0.72,0.55];
  const LOBJ=V.norm([PM[0]*LV[0]+PM[3]*LV[1]+PM[6]*LV[2],
                     PM[1]*LV[0]+PM[4]*LV[1]+PM[7]*LV[2],
                     PM[2]*LV[0]+PM[5]*LV[1]+PM[8]*LV[2]]);
  /* a tight terminator: most of the lit side takes no hatch at all and most of
     the dark side takes the full family, so the two read as tone rather than as
     an even scatter of lines over everything */
  const tone=d=>{const v=(0.30-d)/0.55;return v<0?0:v>1?1:v;};
  const TONE=n=>tone(V.dot(n,LOBJ));
  const DITH=[0,4,2,6,1,5,3,7];
  const thrOf=i=>(DITH[i&7]+0.12)/8;
  /* hatch families are sized so the darkest pass lands near a 3.6 px pitch */
  const hatchN=cpx=>Math.max(8,Math.min(96,Math.round(cpx/22.4)*8));
  const HGAP=2.8/Math.max(scale,1e-6);
  /* a run of hatch is only kept where the surface faces us and is not buried */
  function hatchRun(pts,nrms,keep){
    const out=[];let run=[];
    for(let i=0;i<pts.length;i++){
      const q=pts[i];
      if((!keep||keep[i])&&faces(q,nrms[i])&&VIS(q))run.push(S(q));
      else{if(run.length>1)out.push(run);run=[];}
    }
    if(run.length>1)out.push(run);
    for(const r of out){
      let L=0;for(let i=1;i<r.length;i++)L+=Math.hypot(r[i][0]-r[i-1][0],r[i][1]-r[i-1][1]);
      if(L>MINR)t.path(r,ink,hw);
    }
  }
  function densPN(pts,nrms,step){
    const P=[],N=[],n=pts.length;
    for(let i=0;i<n-1;i++){
      const A=pts[i],B=pts[i+1],a=S(A),b=S(B);
      const k=Math.max(1,Math.min(32,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/(step||7))));
      for(let j=0;j<k;j++){P.push(V.lerp(A,B,j/k));N.push(V.norm(V.lerp(nrms[i],nrms[i+1],j/k)));}
    }
    P.push(pts[n-1]);N.push(nrms[n-1]);
    return [P,N];
  }
  /* meridians on a straight body of revolution */
  function hatchAxial(a,b,r1,r2,axis){
    const [u,v]=basis(axis), L=V.len(V.sub(b,a))||1, dr=(r2-r1)/L;
    const NH=hatchN(2*Math.PI*Math.max(r1,r2)*scale);
    for(let i=0;i<NH;i++){
      const th=i/NH*Math.PI*2;
      const rad=V.add(V.mul(u,Math.cos(th)),V.mul(v,Math.sin(th)));
      const n=V.norm(V.sub(rad,V.mul(axis,dr)));
      if(TONE(n)<thrOf(i))continue;
      const [P,N]=densPN([V.add(a,V.mul(rad,r1)),V.add(b,V.mul(rad,r2))],[n,n]);
      hatchRun(P,N);
    }
  }
  /* small circles about the light: every one is a line of constant tone, so the
     hatch follows the terminator round the ball however it is turned */
  function hatchSphere(c,r){
    const NH=hatchN(2*Math.PI*r*scale), half=Math.max(4,NH>>1);
    for(let i=0;i<half;i++){
      const phi=(i+0.5)/half*Math.PI, cp=Math.cos(phi);
      if(tone(cp)<thrOf(i))continue;
      const rr=r*Math.sin(phi);
      if(rr*scale<1.5)continue;
      const pts=ringPts(V.add(c,V.mul(LOBJ,r*cp)),rr,LOBJ,SEG(rr*scale));
      hatchRun(pts.concat([pts[0]]),pts.map(q=>V.norm(V.sub(q,c))).concat([V.norm(V.sub(pts[0],c))]));
    }
  }
  /* chords in the plane of a flat face, scan-line clipped to its outline */
  function hatchFace(poly3,nrm,hole){
    const tn=TONE(nrm);
    if(tn<thrOf(0))return;
    const [u,v]=basis(nrm), o=poly3[0];
    const P=poly3.map(q=>{const d=V.sub(q,o);return [V.dot(d,u),V.dot(d,v)];});
    let mn=1e30,mx=-1e30;
    for(const q of P){if(q[1]<mn)mn=q[1];if(q[1]>mx)mx=q[1];}
    const K=Math.min(160,Math.floor((mx-mn)/HGAP));
    const hv=hole?V.sub(hole.c,o):null;
    const hc=hv?[V.dot(hv,u),V.dot(hv,v)]:null;
    for(let k=0;k<K;k++){
      if(tn<thrOf(k))continue;
      const y=mn+(k+0.5)*HGAP, xs=[];
      for(let j=0,m=P.length;j<m;j++){
        const A=P[j],B=P[(j+1)%m];
        if((A[1]>y)!==(B[1]>y))xs.push(A[0]+(B[0]-A[0])*(y-A[1])/((B[1]-A[1])||1e-9));
      }
      xs.sort((a,b)=>a-b);
      for(let j=0;j+1<xs.length;j+=2){
        let spans=[[xs[j],xs[j+1]]];
        if(hc&&Math.abs(y-hc[1])<hole.r){            /* an annulus keeps its hole */
          const w=Math.sqrt(hole.r*hole.r-(y-hc[1])*(y-hc[1]));
          spans=[[xs[j],Math.min(xs[j+1],hc[0]-w)],[Math.max(xs[j],hc[0]+w),xs[j+1]]];
        }
        for(const [x0,x1] of spans){
          if(x1-x0<HGAP*0.4)continue;
          const q0=V.add(o,V.add(V.mul(u,x0),V.mul(v,y)));
          const q1=V.add(o,V.add(V.mul(u,x1),V.mul(v,y)));
          const [PP,NN]=densPN([q0,q1],[nrm,nrm]);
          hatchRun(PP,NN);
        }
      }
    }
  }

  if(showEnv){
    const dash=[scale*0.55,scale*0.35];
    for(const e of ship.envs){
      const c=[];
      for(let i=0;i<8;i++)c.push(V.add(e.c,V.add(V.mul(e.u,i&1?1:-1),
        V.add(V.mul(e.v,i&2?1:-1),V.mul(e.w,i&4?1:-1)))));
      for(const [x,y] of [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]])
        for(const r of runs3(dens([c[x],c[y]],false,6),VIS,MINR))t.path(r,ink,lw*0.5,dash);
    }
  }

  /* order no longer decides what is visible — it only decides the order in
     which bodies land during the reveal wipe, back to front */
  const items=ship.parts.map((p,i)=>({p,i,z:D(partCentroid(p))}))
                        .sort((a,b)=>a.z-b.z||a.i-b.i);
  const shown=Math.max(0,Math.min(items.length,Math.round(items.length*reveal)));

  /* walk a tagged hull, stroking every edge except the ones on a buried cap */
  function outline(H,drawA,drawB,w){
    const n=H.length;
    const keep=i=>{
      const p=H[i],q=H[(i+1)%n];
      if(p[2]!==q[2])return true;
      return p[2]===0?drawA:drawB;
    };
    let run=[];
    const flush=()=>{if(run.length>1)stroke(run,false,w);run=[];};
    for(let i=0;i<n;i++){
      if(!keep(i)){flush();continue;}
      const A=H[i][3],B=H[(i+1)%n][3],a=S(A),b=S(B);
      const k=Math.max(1,Math.min(64,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/5)));
      if(!run.length)run.push(A);
      for(let j=1;j<=k;j++)run.push(V.lerp(A,B,j/k));
    }
    flush();
  }
  function surfDet(p,axis,a,b,r1,r2,n){
    if(!p.det)return;
    const d=p.det, minL=Math.max(r1,r2)*scale*0.35;
    for(const tt of (d.rings||[])){
      const c=V.lerp(a,b,tt),r=r1+(r2-r1)*tt,ref=D(c);
      for(const run of runs(ringPts(c,r,axis,n),q=>D(q)>ref&&VIS(q),minL))t.path(run,ink,dw);
    }
    const [u,v]=basis(axis);
    for(const th of (d.longs||[])){
      const dir=V.add(V.mul(u,Math.cos(th)),V.mul(v,Math.sin(th)));
      const pts=[];
      for(let i=0;i<=20;i++){const f=i/20;
        pts.push(V.add(V.lerp(a,b,f),V.mul(dir,r1+(r2-r1)*f)));}
      for(const run of runs3(pts,q=>faces(q,dir)&&VIS(q),0))
        if(run.length>2)t.path(run,ink,dw);
    }
    for(const po of (d.ports||[])){
      const dir=V.add(V.mul(u,Math.cos(po.th)),V.mul(v,Math.sin(po.th)));
      const c=V.add(V.lerp(a,b,po.t),V.mul(dir,r1+(r2-r1)*po.t));
      if(!faces(c,dir))continue;
      for(const run of runs(ringPts(c,po.r,dir,SEG(po.r*scale)),VIS,MINR))t.path(run,ink,dw);
    }
  }

  for(let k=0;k<shown;k++){
    const it=items[k], p=it.p;

    if(p.k==="sphere"){
      const R2=p.r*scale,n=SEG(R2),ref=D(p.c);
      stroke(ringPts(p.c,p.r,EYE,n),true);
      if(p.det&&p.det.rings)for(const tt of p.det.rings){
        const kk=(tt-0.5)*1.72,ax=[1,0,0];
        const cc=V.add(p.c,V.mul(ax,p.r*kk));
        for(const run of runs(ringPts(cc,p.r*Math.sqrt(Math.max(0,1-kk*kk)),ax,n),
                              q=>D(q)>ref&&VIS(q),R2*0.35))t.path(run,ink,dw);
      }
      if(HATCH)hatchSphere(p.c,p.r);
      continue;
    }

    /* body of revolution: silhouette by hull, then only the stations that are
       real edges, plus meridians — never every facet */
    if(p.k==="lathe"){
      const mr=p.prof.reduce((m,q)=>Math.max(m,q[1]),0);
      const n=p.facets||SEG(mr*scale), NP=p.prof.length;
      const cen=i=>V.add(p.c,V.mul(p.axis,p.prof[i][0]));
      const [bu,bv]=basis(p.axis), ea=p.ell?p.ell[0]:1, eb=p.ell?p.ell[1]:1;
      const ring=(i)=>{const o=[];
        for(let j=0;j<n;j++){const a=j/n*Math.PI*2;
          o.push(V.add(cen(i),V.add(V.mul(bu,p.prof[i][1]*ea*Math.cos(a)),
                                    V.mul(bv,p.prof[i][1]*eb*Math.sin(a)))));}
        return o;};
      const rings=p.prof.map((q,i)=>ring(i));
      const all=[];for(const rg of rings)for(const q of rg)all.push(q);
      stroke(hullLoop(hull(tag(all,0))),false);
      const slope=i=>{
        const i0=Math.max(0,i-1),i1=Math.min(NP-1,i+1);
        return [p.prof[i1][0]-p.prof[i0][0],p.prof[i1][1]-p.prof[i0][1]];
      };
      const nrmAt=(i,q)=>{
        const [dt,dr]=slope(i);
        const rad=V.norm(V.sub(q,cen(i)));
        return V.norm(V.sub(V.mul(rad,dt),V.mul(p.axis,dr)));
      };
      const d=p.det||{};
      for(const idx of (d.rings||[])){
        if(idx<0||idx>=NP||p.prof[idx][1]<1e-6)continue;
        for(const run of runs(rings[idx],q=>faces(q,nrmAt(idx,q))&&VIS(q),mr*scale*0.25))
          t.path(run,ink,dw);
      }
      for(let mI=0;mI<(d.mer||0);mI++){
        const th=mI/d.mer*Math.PI*2+(d.merOff||0);
        const rad=V.add(V.mul(bu,Math.cos(th)),V.mul(bv,Math.sin(th)));
        const pts=[],ok=[];
        for(let i=0;i<NP;i++){
          const q=V.add(cen(i),V.add(V.mul(bu,p.prof[i][1]*ea*Math.cos(th)),
                                     V.mul(bv,p.prof[i][1]*eb*Math.sin(th))));
          const [dt,dr]=slope(i);
          pts.push(q);ok.push(faces(q,V.norm(V.sub(V.mul(rad,dt),V.mul(p.axis,dr)))));
        }
        let seq=[];
        for(let i=0;i<NP;i++){
          if(ok[i])seq.push(pts[i]);
          else{if(seq.length>1)stroke(dens(seq,false),false,dw);seq=[];}
        }
        if(seq.length>1)stroke(dens(seq,false),false,dw);
      }
      if(HATCH){
        const NH=hatchN(2*Math.PI*mr*scale);
        for(let i=0;i<NH;i++){
          const th=i/NH*Math.PI*2;
          const rad=V.add(V.mul(bu,Math.cos(th)),V.mul(bv,Math.sin(th)));
          const pts=[],nrm=[];let lit=0;
          for(let j=0;j<NP;j++){
            const q=V.add(cen(j),V.add(V.mul(bu,p.prof[j][1]*ea*Math.cos(th)),
                                       V.mul(bv,p.prof[j][1]*eb*Math.sin(th))));
            const [dt,dr]=slope(j);
            const nq=V.norm(V.sub(V.mul(rad,dt),V.mul(p.axis,dr)));
            pts.push(q);nrm.push(nq);
            const tn=TONE(nq);if(tn>lit)lit=tn;
          }
          if(lit<thrOf(i))continue;
          /* tone varies along an ogive, so the line is cut where it lightens
             rather than dropped whole — that is what keeps the field from popping */
          const [P,N]=densPN(pts,nrm), th0=thrOf(i);
          hatchRun(P,N,N.map(q=>TONE(q)>=th0));
        }
      }
      continue;
    }

    if(p.k==="box"||p.k==="panel"){
      let cor,F,N;
      if(p.k==="box"){
        cor=[];
        for(let j=0;j<8;j++)cor.push(V.add(p.c,V.add(V.mul(p.u,j&1?1:-1),
          V.add(V.mul(p.v,j&2?1:-1),V.mul(p.w,j&4?1:-1)))));
        F=[[0,2,6,4],[1,5,7,3],[0,4,5,1],[2,3,7,6],[0,1,3,2],[4,6,7,5]];
        N=[V.mul(p.u,-1),p.u,V.mul(p.v,-1),p.v,V.mul(p.w,-1),p.w];
      }else{
        const n=p.n,h=V.mul(n,p.th*0.5),m=p.pts.length,lo=p.pts2||p.pts;
        cor=p.pts.map(q=>V.add(q,h)).concat(lo.map(q=>V.sub(q,h)));
        F=[Array.from({length:m},(_,j)=>j),Array.from({length:m},(_,j)=>m+m-1-j)];
        N=[n,V.mul(n,-1)];
        for(let j=0;j<m;j++){
          if(p.skipSide===j)continue;
          const kk=(j+1)%m;
          F.push([j,kk,m+kk,m+j]);
          N.push(V.norm(V.cross(V.sub(p.pts[kk],p.pts[j]),n)));
        }
      }
      const m0=p.k==="panel"?p.pts.length:0;
      F.forEach((f,fi)=>{
        const ctr=V.mul(f.reduce((s,j)=>V.add(s,cor[j]),[0,0,0]),1/f.length);
        if(!faces(ctr,V.norm(N[fi])))return;
        if(p.k==="panel"&&fi<2&&p.skipSide!=null&&p.skipSide>=0){
          const off=fi===0?0:m0, sk=p.skipSide, idx=[];
          for(let j=1;j<=m0;j++)idx.push(off+((sk+j)%m0));
          stroke(dens(idx.map(j=>cor[j]),false),false);
        }else stroke(dens(f.map(j=>cor[j]),true),true);
        if(HATCH&&!p.bare)hatchFace(f.map(j=>cor[j]),V.norm(N[fi]),null);
        const d=p.det;
        if(d&&d.ribs&&fi<2&&f.length===4){
          const q=f.map(j=>cor[j]);
          for(let kk=1;kk<d.ribs;kk++){
            const tk=kk/d.ribs;
            stroke(dens([V.lerp(q[0],q[q.length-1],tk),V.lerp(q[1],q[2],tk)],false),false,dw);
          }
        }
      });
      continue;
    }

    if(p.k==="disc"){
      const n=V.norm(p.n),thk=V.mul(n,p.r*0.10),sg=SEG(p.r*scale);
      const a=V.sub(p.c,thk),b=V.add(p.c,thk);
      const ca=ringPts(a,p.r,n,sg),cb=ringPts(b,p.r,n,sg);
      stroke(hullLoop(hull(tag(ca,0).concat(tag(cb,1)))),false);
      const near=faces(p.c,n)?b:a;
      stroke(ringPts(near,p.r,n,sg),true);
      if(p.ri>1e-6)stroke(ringPts(near,p.ri,n,sg),true);
      if(HATCH&&!p.bare)hatchFace(ringPts(near,p.r,n,Math.min(sg,48)),faces(p.c,n)?n:V.mul(n,-1),
                         p.ri>1e-6?{c:near,r:p.ri}:null);
      continue;
    }

    /* tube / capsule */
    const axis=V.norm(V.sub(p.b,p.a));
    const isCap=p.k==="capsule";
    const ra=isCap?p.r:p.r1, rb=isCap?p.r:p.r2;
    const n=Math.max(SEG(ra*scale),SEG(rb*scale));
    /* under an orthographic view a sphere's outline is the great circle
       square to the eye, so the capsule's caps get real 3D silhouettes */
    const pA=isCap?ringPts(p.a,p.r,EYE,n):ringPts(p.a,ra,axis,n);
    const pB=isCap?ringPts(p.b,p.r,EYE,n):ringPts(p.b,rb,axis,n);
    outline(hull(tag(pA,0).concat(tag(pB,1))),!p.hideA,!p.hideB,p.bare?dw:undefined);
    if(!isCap){
      if(!p.hideA&&faces(p.a,V.mul(axis,-1)))stroke(ringPts(p.a,p.r1,axis,n),true);
      if(!p.hideB&&faces(p.b,axis))stroke(ringPts(p.b,p.r2,axis,n),true);
    }
    surfDet(p,axis,p.a,p.b,ra,rb,n);
    if(HATCH&&!p.bare){
      hatchAxial(p.a,p.b,ra,rb,axis);
      if(isCap){hatchSphere(p.a,p.r);hatchSphere(p.b,p.r);}
    }
  }
}
function hull(pts){
  const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}
  for(let i=p.length-1;i>=0;i--){const q=p[i];
    while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}
  lo.pop();up.pop();return lo.concat(up);
}
function partCentroid(p){
  if(p.k==="lathe")return p.c;
  if(p.pts)return V.mul(p.pts.reduce((s,q)=>V.add(s,q),[0,0,0]),1/p.pts.length);
  if(p.c)return p.c;
  return V.mul(V.add(p.a,p.b),0.5);
}
function partExtents(p){
  const o=[];
  if(p.k==="box"){for(let i=0;i<8;i++)
    o.push([V.add(p.c,V.add(V.mul(p.u,i&1?1:-1),V.add(V.mul(p.v,i&2?1:-1),V.mul(p.w,i&4?1:-1)))),0]);}
  else if(p.k==="panel"){for(const q of p.pts)o.push([q,p.th]);
    if(p.pts2)for(const q of p.pts2)o.push([q,p.th]);}
  else if(p.k==="lathe"){for(const [tt,r] of p.prof)o.push([V.add(p.c,V.mul(p.axis,tt)),r]);}
  else if(p.k==="sphere"||p.k==="disc")o.push([p.c,p.r]);
  else if(p.k==="capsule")o.push([p.a,p.r],[p.b,p.r]);
  else o.push([p.a,p.r1],[p.b,p.r2]);
  return o;
}
function viewBBox(ship,proj){
  let a=[1e9,1e9],b=[-1e9,-1e9];
  for(const p of ship.parts)for(const [q,r] of partExtents(p)){
    const s=proj(q);
    a[0]=Math.min(a[0],s[0]-r);b[0]=Math.max(b[0],s[0]+r);
    a[1]=Math.min(a[1],s[1]-r);b[1]=Math.max(b[1],s[1]+r);}
  return {x:a[0],y:a[1],w:b[0]-a[0],h:b[1]-a[1]};
}
/* one estimator for both targets: text never overruns its cell */
function fitSize(str,size,tracking,max){
  const w=str.length*size*0.58+Math.max(0,str.length-1)*tracking;
  return w>max?size*max/w:size;
}
/* ===================== sheet ===================== */
function renderSheet(t,W,H,ship,P,pal,opts){
  const k=opts.k||1,lw=P.line*k,ink=pal.ink,reveal=opts.reveal===undefined?1:opts.reveal;
  const U=Math.min(W,H);
  const portrait=W<H*1.02;
  const m=U*0.045,band=U*(portrait?0.20:0.165),gutH=U*0.032;
  const labelH=U*(portrait?0.062:0.052), gutV=labelH*1.05;
  const cw=W-m*2,chTop=m,chBot=H-m-band;
  const contH=chBot-chTop;
  const inset=U*0.020;
  const projs={profile:PROJ.profile,plan:PROJ.plan,bow:PROJ.bow,iso:isoProj(opts.yaw,opts.pitch)};
  t.rect(0,0,W,H,pal.bg);

  /* A general-arrangement sheet is four views because a draughtsman needs four.
     On a phone that is four thumbnails, and the pictorial — the only one anybody
     turns — comes out the size of a postage stamp. Solo throws the sheet away
     and gives the whole plate to the pictorial. The corner marks sit outside the
     cell the spin loop repaints, so a frame never wipes them. */
  if(opts.solo){
    const mk=U*0.016, mg=U*0.030, tk=U*0.020;
    const c={x:mg,y:mg,w:W-mg*2,h:H-mg*2};
    /* size from the hull box, not from this frame's silhouette: the spin only
       redraws the pictorial, so a scale that tracked the current yaw would make
       the ship breathe in and out and overrun the plate on its widest quarter */
    const bbS=ship.bb;
    const ctr=[(bbS[0][0]+bbS[1][0])/2,(bbS[0][1]+bbS[1][1])/2,(bbS[0][2]+bbS[1][2])/2];
    const dg=Math.hypot(bbS[1][0]-bbS[0][0],bbS[1][2]-bbS[0][2]);
    const hg=(bbS[1][1]-bbS[0][1])*Math.abs(Math.cos(opts.pitch))
            +dg*Math.abs(Math.sin(opts.pitch));
    const pj=projs.iso;
    const sc1=Math.min(c.w/Math.max(dg,1e-6),c.h/Math.max(hg,1e-6));
    const pc=pj(ctr);
    const o={ox:c.x+c.w/2-pc[0]*sc1, oy:c.y+c.h/2+pc[1]*sc1};
    drawView(t,ship,pj,sc1,o.ox,o.oy,pal,lw,reveal,false,"iso",
             `${opts.yaw},${opts.pitch},${k}`,opts.tone!==false);
    t.path([[mk,mk+tk],[mk,mk],[mk+tk,mk]],ink,lw);
    t.path([[W-mk-tk,mk],[W-mk,mk],[W-mk,mk+tk]],ink,lw);
    t.path([[mk,H-mk-tk],[mk,H-mk],[mk+tk,H-mk]],ink,lw);
    t.path([[W-mk-tk,H-mk],[W-mk,H-mk],[W-mk,H-mk-tk]],ink,lw);
    return {cells:{iso:c},sc:{iso:sc1},origin:{iso:o}};
  }

  const bProf=viewBBox(ship,projs.profile), bPlan=viewBBox(ship,projs.plan);
  const bBow=viewBBox(ship,projs.bow);
  const shipL=Math.max(bProf.w,bPlan.w);
  const cells={}, sc={}, origin={};
  const boxes={profile:bProf,plan:bPlan,bow:bBow};
  const bbS=ship.bb;
  const isoCtr=[(bbS[0][0]+bbS[1][0])/2,(bbS[0][1]+bbS[1][1])/2,(bbS[0][2]+bbS[1][2])/2];
  const isoDiag=Math.hypot(bbS[1][0]-bbS[0][0],bbS[1][2]-bbS[0][2]);
  const isoHgt=(bbS[1][1]-bbS[0][1])*Math.abs(Math.cos(opts.pitch))
              +isoDiag*Math.abs(Math.sin(opts.pitch));
  let scale;

  if(portrait){
    /* narrow screens: pictorial first and as large as the projection set allows,
       each elevation row cut to the drawing rather than a fixed share */
    const sumH=bProf.h+bPlan.h+bBow.h;
    const stackFixed=inset*6+gutV*3;
    let sW=(cw-inset*2)/Math.max(shipL,1e-6);
    let stackH=sumH*sW+stackFixed;
    const minIso=contH*0.34;
    if(contH-stackH<minIso)
      sW=Math.max(1e-6,(contH-minIso-stackFixed)/Math.max(sumH,1e-6));
    scale=sW;
    stackH=sumH*scale+stackFixed;
    const isoNeed=isoHgt*((cw-inset*1.1)/Math.max(isoDiag,1e-6))+inset*2;
    let isoH=Math.max(minIso,Math.min(contH-stackH,isoNeed));
    /* both columns are width-bound, so share any slack instead of pooling it */
    const slack=Math.max(0,contH-stackH-isoH)/4;
    isoH+=slack;
    cells.iso={x:m,y:chTop,w:cw,h:isoH};
    let y=chTop+isoH+gutV;
    for(const key of ["profile","plan","bow"]){
      const hh=boxes[key].h*scale+inset*2+slack;
      cells[key]={x:m,y,w:cw,h:hh};
      y+=hh+gutV;
    }
  }else{
    /* wide: the pictorial takes the larger panel, full height */
    const rightW=cw*0.56, leftW=cw-rightW-gutH, rx=m+leftW+gutH;
    const bowShare=contH*0.24, rem=contH-gutV*2-bowShare;
    scale=Math.min((leftW-inset*2)/Math.max(shipL,1e-6),
                   (rem-inset*4)/Math.max(bProf.h+bPlan.h,1e-6));
    const rP=bProf.h*scale+inset*2, rN=bPlan.h*scale+inset*2;
    cells.profile={x:m,y:chTop,w:leftW,h:rP};
    cells.plan={x:m,y:chTop+rP+gutV,w:leftW,h:rN};
    cells.bow={x:m,y:chTop+rP+rN+gutV*2,w:leftW,
               h:Math.max(contH-(rP+rN+gutV*2),U*0.12)};
    cells.iso={x:rx,y:chTop,w:rightW,h:contH};
  }

  sc.profile=sc.plan=scale;
  sc.bow=Math.min(scale,(cells.bow.w-inset*2)/Math.max(bBow.w,1e-6),
                        (cells.bow.h-inset*2)/Math.max(bBow.h,1e-6));
  for(const key of ["profile","plan","bow"]){
    const c=cells[key],bx=boxes[key],k=sc[key];
    origin[key]={ox:c.x+(c.w-bx.w*k)/2-bx.x*k,oy:c.y+(c.h+bx.h*k)/2+bx.y*k};
  }
  origin.plan.ox=origin.profile.ox;
  boxes.iso=viewBBox(ship,projs.iso);
  {
    const ci=cells.iso;
    sc.iso=Math.min((ci.w-inset*1.1)/Math.max(isoDiag,1e-6),
                    (ci.h-inset*1.6)/Math.max(isoHgt,1e-6));
    const pc=projs.iso(isoCtr);
    origin.iso={ox:ci.x+ci.w/2-pc[0]*sc.iso,oy:ci.y+ci.h/2+pc[1]*sc.iso};
  }

  const cdash=[U*0.016,U*0.007,U*0.004,U*0.007];
  const label=(c,s)=>{
    t.path([[c.x,c.y+c.h],[c.x+c.w,c.y+c.h]],ink,lw*0.9);
    t.text(s,c.x,c.y+c.h+U*0.026,{size:U*0.018,color:ink,weight:600,tracking:U*0.003});
  };
  for(const key of ["profile","plan","bow","iso"]){
    const c=cells[key],o=origin[key];
    if(key==="profile"||key==="plan")
      t.path([[c.x+inset*0.3,o.oy],[c.x+c.w-inset*0.3,o.oy]],ink,lw*0.6,cdash);
    if(key==="bow")
      t.path([[o.ox,c.y+inset*0.3],[o.ox,c.y+c.h-inset*0.3]],ink,lw*0.6,cdash);
    drawView(t,ship,projs[key],sc[key],o.ox,o.oy,pal,lw,reveal,opts.env&&key!=="iso",
             key,key==="iso"?`${opts.yaw},${opts.pitch},${k}`:`${k}`,
             key==="iso"&&opts.tone!==false);
    let tx={profile:"PROFILE — STARBOARD ELEVATION",plan:"PLAN",
            bow:"BOW ELEVATION",iso:"PICTORIAL"}[key];
    if(key==="bow"&&Math.abs(sc.bow/scale-1)>0.04)
      tx+="  ×"+(sc.bow/scale).toFixed(2);
    label(c,tx);
  }

  /* scale bar + 1.8 m crew figure */
  const px=20*scale, by=H-m-band+(portrait?U*0.052:U*0.055),
        bx=portrait?Math.max(m+U*0.34,W-m-px-U*0.13):m;
  t.path([[bx,by],[bx+px,by]],ink,lw);
  for(let i=0;i<=4;i++)t.path([[bx+px*i/4,by],[bx+px*i/4,by-(i%2?U*0.009:U*0.016)]],ink,lw);
  t.text("0",bx,by+U*0.023,{size:U*0.0155,color:ink,weight:500,tracking:U*0.002});
  t.text("20 M",bx+px,by+U*0.023,{size:U*0.0155,color:ink,weight:500,tracking:U*0.002,anchor:"end"});
  const fx=bx+px+U*0.05,fh=1.8*scale,fw=fh*0.26;
  t.poly([[fx-fw*0.5,by],[fx-fw*0.5,by-fh*0.52],[fx-fw*0.85,by-fh*0.78],[fx-fw*0.35,by-fh*0.80],
          [fx,by-fh*0.62],[fx+fw*0.35,by-fh*0.80],[fx+fw*0.85,by-fh*0.78],[fx+fw*0.5,by-fh*0.52],
          [fx+fw*0.5,by]],ink,ink,lw*0.5);
  t.poly(ringPts([0,0,0],fh*0.10,[0,0,1],14).map(p=>[fx+p[0],by-fh*0.90+p[1]]),ink,ink,lw*0.5);
  t.text("1.8 M",fx,by+U*0.023,{size:U*0.014,color:ink,weight:500,tracking:U*0.0018,anchor:"middle"});

  if(opts.block!==false){
    const bw=portrait?cw:Math.min(W*0.40,U*0.56),bh=band*(portrait?0.60:0.88),bxx=W-m-bw,byy=H-m-bh,M=ship.meta;
    const pad=bw*0.024, div=bxx+bw*0.72, rMet=byy+bh*0.70;
    t.rect(bxx,byy,bw,bh,pal.bg);
    t.poly([[bxx,byy],[bxx+bw,byy],[bxx+bw,byy+bh],[bxx,byy+bh]],null,ink,lw);
    t.path([[bxx,rMet],[bxx+bw,rMet]],ink,lw*0.8);
    t.path([[div,byy],[div,rMet]],ink,lw*0.7);

    const lw1=(div-bxx-pad*2)*0.97, rw1=(bxx+bw-pad-(div+pad*0.6))*0.97;
    const T=(str,x,y,size,tr,weight,max,anchor)=>
      t.text(str,x,y,{size:fitSize(str,size,tr,max),color:ink,weight,tracking:tr,anchor});
    T(M.desig,bxx+pad,byy+bh*0.28,bh*0.215,bh*0.016,700,lw1);
    T(M.klass,bxx+pad,byy+bh*0.45,bh*0.092,bh*0.011,500,lw1);
    const sp=ship.chosen.recipeShort||ship.chosen.recipe||ship.chosen.topo.n;
    const cfg=sp+"   "+["cockpit","wing","tail","booster","gear"]
      .map((s2,j)=>"CWTBG"[j]+(ship.chosen[s2].i+1)).join(" · ")
      +(ship.meta.sym!=="BILATERAL"?"   "+ship.meta.sym:"")
      +(ship.meta.note?"   "+ship.meta.note:"");
