const DRIVEN=[{n:"—"}];
const SYM=[{n:"BILATERAL",k:2},{n:"TRILATERAL",k:3},{n:"QUADRILATERAL",k:4}];

/* ===================== rigging =====================
   The polish pass, and the reason it is a pass and not part of the library:
   a variant is authored blind. The forearm does not know a backpack exists, the
   yoke does not know what chassis it landed on, and neither can run a cable to
   the other because neither can see it. Every loom in the variants is therefore
   a loop that starts and ends on the same part — decoration, not plumbing.

   By the time the machine is assembled that constraint is gone. Every part is
   placed, mirrored, attached and final, so this pass can look at the actual
   finished object and ask a question no variant can: what is near what? Then it
   runs conduit BETWEEN groups, bolts a plug where each run lands, and clamps
   the slack down — which is what turns eleven separately-authored assemblies
   into one machine that was wired up by somebody.

   It also runs AFTER the mirror, so the port side gets its own routing. Two
   identical arms still come out rigged differently, which is most of where a
   frame's individuality now comes from.

   Everything here starts from a point already on a surface, so nothing this
   pass adds can float. */

/* the runs worth making, in preference order — power and feed follow the same
   paths on a real machine that they do on a drawing */
const RUNS=[
  ["back","shoulder",2],["back","shoulderL",2],["back","neck",1],["back","head",1],
  ["shoulder","upper",2],["shoulderL","upperL",2],
  ["upper","fore",2],["upperL","foreL",2],
  ["chest","neck",1],["chest","shoulder",1],["chest","shoulderL",1],
  ["waist","hip",2],["hip","drive",3],["waist","drive",1],
  ["aux","back",1],["aux","chest",1],["neck","head",1],
  ["back","waist",1],["chassis","drive",2],["chassis","back",1]
];

/* a bolt circle in world space — GK's version builds in a socket frame, and
   this pass has no frame to build in */
function GKbolt(out,c,n,r,N,br){
  const [bu,bv]=basis(n);
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2+0.3;
    out.push(SPH(V.add(c,V.add(V.mul(bu,Math.cos(a)*r),V.mul(bv,Math.sin(a)*r))),br,{rig:true}));
  }
}
function rigMech(parts,R,rr,P,sr){
  const q=P&&P.detail!=null?P.detail:0.6;
  const out=[];
  const pick=a=>a[Math.floor(R()*a.length)|0];

  /* one bounding sphere per part, so "is this point buried?" only ever tests
     the handful of parts that could possibly contain it */
  const S=parts.map(p=>{
    const ex=partExtents(p); let c=[0,0,0],n=0,r=0;
    for(const [z] of ex){c=V.add(c,z);n++;}
    c=V.mul(c,1/Math.max(n,1));
    for(const [z,rd] of ex) r=Math.max(r,V.len(V.sub(z,c))+(rd||0));
    return {c,r};
  });
  const buried=(z,own)=>{
    for(let i=0;i<parts.length;i++){
      if(i===own)continue;
      if(V.len(V.sub(z,S[i].c))>S[i].r)continue;
      if(inSolid(z,parts[i]))return true;
    }
    return false;
  };

  /* a bank of exposed points per group, sampled rather than exhaustive */
  const bank={};
  const step=Math.max(1,Math.floor(parts.length/220));
  for(let i=0;i<parts.length;i+=step){
    const p=parts[i], g=(p.g||"chassis").replace(/#.*/,"");
    const ex=partExtents(p);
    /* One anchor per part spreads the bank evenly by COUNT, which is the wrong
       measure: a torso is three enormous parts and a greeble field is forty
       tiny ones, so the big surfaces — the ones with room for fittings — ended
       up bare while the clutter got wired to death. Anchors scale with size. */
    /* anchors in proportion to the surface, without a ceiling that a genuinely
       huge mass immediately hits — a dorsal pack three torso-radii across needs
       more than the four a shoulder pod gets */
    const want=Math.max(1,Math.min(9,Math.round(1+4.2*(S[i].r/sr))));
    let took=0;
    /* and stride through the extents rather than taking the first few — a
       lathe lists its points station by station, so the first four are all on
       the bottom ring and every fitting ends up round the machine's ankles */
    const jump=Math.max(1,Math.floor(ex.length/(want+1)));
    for(let j=0;j<ex.length&&took<want;j+=jump){
      const z=ex[j][0];
      if(buried(z,i))continue;
      (bank[g]=bank[g]||[]).push({z,n:V.len(V.sub(z,S[i].c))>1e-6
        ?V.norm(V.sub(z,S[i].c)):[0,1,0],big:S[i].r>sr*0.5});
      took++;
    }
  }

  /* ---- conduit ---- */
  const maxLen=sr*2.6;             /* long runs would cut straight through the body */
  const cable=(a,b,r,n)=>{
    const d=V.len(V.sub(b.z,a.z));
    /* pull the middle down and away, so it hangs instead of pointing */
    /* the sag is pushed OUT along both surface normals as well as down: a run
       that dips inward disappears behind the plate it started on, and hidden
       line removal is doing its job when it hides it. Conduit is only worth
       drawing where it can be seen. */
    const mid=V.add(V.mul(V.add(a.z,b.z),0.5),
      V.add([0,-d*rr(0.14,0.30),0],V.mul(V.norm(V.add(a.n,b.n)),d*rr(0.20,0.42))));
    const at=t=>{const u=1-t;
      return [u*u*a.z[0]+2*u*t*mid[0]+t*t*b.z[0],
              u*u*a.z[1]+2*u*t*mid[1]+t*t*b.z[1],
              u*u*a.z[2]+2*u*t*mid[2]+t*t*b.z[2]];};
    for(let i=0;i<n;i++){
      const p0=at(i/n), p1=at((i+0.88)/n);
      out.push(CAP(p0,p1,r*(i%2?0.76:1),{rig:true}));
    }
    /* the boss each end lands in, and its collar */
    for(const e of [a,b]){
      const o=V.add(e.z,V.mul(e.n,r*0.4));
      out.push(LTH(V.sub(o,V.mul(e.n,r*1.5)),e.n,
        [[0,r*2.0],[r*0.9,r*2.2],[r*2.1,r*1.5],[r*2.6,r*1.25]],
        {rings:[1,2],mer:6},{rig:true}));
      out.push(DSC(V.add(o,V.mul(e.n,r*1.1)),e.n,r*1.55,r*0.9,{rig:true}));
    }
  };

  const nRun=Math.round(7+17*q);
  /* a machine can legitimately publish none of the paired groups a route wants
     — a solo drive on a bare chassis, everything else dropped — and an empty
     route list must not be drawn from */
  const runs=RUNS.filter(([a,b])=>bank[a]&&bank[a].length&&bank[b]&&bank[b].length);
  let made=0;
  for(let guard=0;runs.length&&guard<nRun*6&&made<nRun;guard++){
    const [ga,gb,w]=pick(runs);
    if(R()>Math.min(1,w*0.5))continue;
    const A=pick(bank[ga]), B=pick(bank[gb]);
    const d=V.len(V.sub(A.z,B.z));
    if(d<sr*0.14||d>maxLen)continue;
    cable(A,B,sr*rr(0.075,0.145),Math.max(5,Math.round(5+d/sr*3)));
    made++;
  }

  /* ---- plug sockets: a receptacle with nothing in it says the machine comes
     apart, which is half of why a technical drawing reads as a machine ---- */
  const all=[].concat(...Object.values(bank));
  const wide=all.filter(e=>e.big);
  const nSock=Math.round(4+11*q);
  for(let i=0;i<nSock&&all.length;i++){
    /* two fittings in three go on a big surface, because that is where a
       fitting would go and where there is room to read it */
    const e=pick(wide.length&&R()<0.66?wide:all), r=sr*rr(0.085,0.155);
    const o=V.add(e.z,V.mul(e.n,r*0.2));
    out.push(LTH(V.sub(o,V.mul(e.n,r*0.8)),e.n,
      [[0,r*1.35],[r*0.6,r*1.5],[r*1.5,r*1.4]],{rings:[1],mer:8},{rig:true}));
    out.push(DSC(V.add(o,V.mul(e.n,r*0.75)),e.n,r*1.32,r*0.72,{rig:true}));
    const [bu,bv]=basis(e.n);
    const N=3+((R()*3)|0);
    for(let j=0;j<N;j++){
      const a2=j/N*Math.PI*2+R();
      const s2=V.add(o,V.add(V.mul(bu,Math.cos(a2)*r*0.86),V.mul(bv,Math.sin(a2)*r*0.86)));
      out.push(TUB(s2,V.add(s2,V.mul(e.n,r*0.55)),r*0.17,r*0.15,{rig:true}));
    }
  }

  /* ---- panel fittings: a raised pad on a bolt circle. Not plumbing — the
     mark a plate leaves when it is designed to come off, which is what makes a
     large bare surface read as armour rather than as a blank. ---- */
  const nPad=Math.round(3+10*q);
  for(let i=0;i<nPad&&wide.length;i++){
    const e=pick(wide), r=sr*rr(0.11,0.22);
    const o=V.add(e.z,V.mul(e.n,r*0.06));
    out.push(LTH(V.sub(o,V.mul(e.n,r*0.5)),e.n,
      [[0,r*0.98],[r*0.42,r],[r*0.66,r*0.86]],{rings:[1],mer:8},{rig:true}));
    GKbolt(out,V.add(o,V.mul(e.n,r*0.18)),e.n,r*0.74,4+((R()*4)|0),r*0.10);
    out.push(DSC(V.add(o,V.mul(e.n,r*0.2)),e.n,r*0.5,r*0.22,{rig:true}));
  }

  /* ---- clamps: the brackets that stop all of the above swinging ---- */
  const nClamp=Math.round(3+9*q);
  for(let i=0;i<nClamp&&all.length;i++){
    const e=pick(all), r=sr*rr(0.075,0.135);
    const [bu]=basis(e.n);
    const a=V.sub(e.z,V.mul(bu,r*1.1)), b=V.add(e.z,V.mul(bu,r*1.1));
    out.push(TUB(a,b,r*0.42,r*0.42,{rig:true}));
    out.push(DSC(V.add(e.z,V.mul(e.n,r*0.3)),e.n,r*0.7,r*0.3,{rig:true}));
  }
  return out;
}

/* ===================== build =====================
   Order matters here in a way it never did for a ship. A hull's sockets all
   land on the hull, so they could be filled in any order; a mech's arm is a
   chain — the humerus roots on the yoke, the forearm roots on the humerus —
   so each socket is filled against everything already standing, not against
   the chassis alone. SLOTS is that dependency order, and `on` names the group
   a variant is allowed to root in. */
const SLOTS=[
 {id:"neck",     on:null},
 {id:"head",     on:"neck"},
 {id:"chest",    on:null},
 {id:"back",     on:null},
 {id:"waist",    on:null},
 {id:"hip",      on:null},
 {id:"drive",    on:"hip"},
 {id:"aux",      on:null},
 /* ---- the arms are HANDED ----
    Everything else on the machine is bilateral, and the mirror pass gives that
    away for free. Arms are the exception, and making them the exception is the
    single biggest jump in what the yard can build: one close-combat arm and one
    ranged arm is not a variation on the Dreadnought pattern, it IS the pattern,
    and a mirror can only ever produce a machine holding two of the same thing.
    So each arm is a chain of its own — its own yoke, its own humerus, its own
    forearm — and the mirror pass is told to leave both of them alone.
    They still agree often, because a matched pair is also a real machine; see
    MATCH below. */
 {id:"shoulder", on:null,       handed:true},
 {id:"upper",    on:"shoulder", handed:true},
 {id:"fore",     on:"upper",    handed:true}
];
/* how often the port arm simply copies the starboard one */
const MATCH=0.42;
const HAND=["","L"];
const SLOT_IDS=[].concat(...SLOTS.map(s=>s.handed?HAND.map(h=>s.id+h):[s.id]));

function buildMech(seed,P,lock){
  const R=mulberry32(seed|0), rr=(a,b)=>a+(b-a)*R(), pick=a=>a[Math.floor(R()*a.length)|0];
  const parts=[], envs=[], chosen={};
  GK.q=P&&P.detail!=null?P.detail:0.6;

  const tIdx=(lock&&lock.topo!=null)?Math.min(lock.topo,TOPO.length-1):Math.floor(R()*TOPO.length);
  const topo=TOPO[tIdx];
  chosen.topo={i:tIdx,n:topo.n};
  const chassis=topo.make(R,rr,P,parts,lock);
  const T=chassis.torso;
  chosen.nsec={i:T.nSec-2,n:T.nSec+" SECTION"+(T.nSec>1?"S":"")};
  chosen.tlo=T.tlo; chosen.thi=T.thi; chosen.joint=T.joint;
  chosen.recipe=T.recipe;

  /* The mount is a point, but a variant that spreads out — a six-leg drive, a
     shield — needs the surface under each of its feet, not under the socket. */
  const standing=parts.slice();
  const probeFor=(fr,E)=>{
    const back=V.mul(V.norm(fr.f),-1);
    const M=Math.max(chassis.sr*5,E.x*1.7+E.y*0.9), N=48;
    const hit=(u,v)=>{
      const base2=V.add(fr.o,V.add(V.mul(fr.u,u),V.mul(fr.s,v)));
      for(let i=0;i<=N;i++){
        const d=M*i/N, q=V.add(base2,V.mul(back,d));
        for(const cp of standing) if(inSolid(q,cp)) return d;
      }
      return -1;
    };
    const home=Math.max(0,hit(0,0));
    const du=E.y*0.11, dv=E.z*0.11;
    return (u,v)=>{
      let d=hit(u,v);
      if(d<0)for(const [au,av] of [[du,0],[-du,0],[0,dv],[0,-dv],[du,dv],[-du,-dv]]){
        d=hit(u+au,v+av);
        if(d>=0)break;
      }
      return d<0?home:d;
    };
  };

  /* How close is touching? The probes carry each point's own radius and step
     out by it, which was meant to help a thin part find a neighbour and instead
     let a fat one claim contact from several units away — a limb nine units
     thick counted as attached to a pad it was nowhere near, and the drag that
     should have pulled it home stopped the moment the test went true. The
     tolerance is a small fixed slack off the chassis now, not the size of
     whatever happens to be asking. */
  const TOL=chassis.sr*0.05;
  const groups={};
  /* Mirroring a socket frame is just negating every z: the frame goes
     left-handed, so a variant authored for the starboard side comes out as its
     own reflection on the port side without knowing anything about it. */
  const mirFrame=f=>({o:[f.o[0],f.o[1],-f.o[2]],f:[f.f[0],f.f[1],-f.f[2]],
                      u:[f.u[0],f.u[1],-f.u[2]],s:[f.s[0],f.s[1],-f.s[2]]});
  const inSet=(q,set)=>set.some(c=>inSolid(q,c));
  const touches=(grp,set)=>{
    for(const p of grp)
      for(const [q,rd] of partExtents(p)){
        if(inSet(q,set))return true;
        const t=Math.min(rd,TOL);
        if(t>0) for(const ax of [[t,0,0],[-t,0,0],[0,t,0],[0,-t,0],[0,0,t],[0,0,-t]])
          if(inSet(V.add(q,ax),set))return true;
      }
    return false;
  };
  const shift=(p,d)=>{
    const t=v=>[v[0]+d[0],v[1]+d[1],v[2]+d[2]];
    for(const k of ["c","a","b"]) if(p[k])p[k]=t(p[k]);
    if(p.pts)p.pts=p.pts.map(t);
    if(p.pts2)p.pts2=p.pts2.map(t);
  };
  const chassisSolids=parts.slice();
  const dropped=new Set();

  /* ---- connectivity, at the part level ----
     The guarantee above asks one question per socket: does this variant, taken
     as a whole, touch the thing it hangs off? That is the right question for a
     variant that is one object, and the wrong one for a variant that is nine —
     a launcher can be bolted on by its root while its cells hang in mid-air,
     and the group-level test passes it, because SOMETHING in the group is
     attached. About one part in a hundred was floating on that technicality.

     So: split each group into what is actually connected to what, keep every
     island that reaches the anchor, and drag the ones that do not until they
     bite. A sphere test first, because this runs on every part of every group
     and the exact answer is only needed for pairs that could possibly touch. */
  const sphOf=p=>{
    const ex=partExtents(p); let c=[0,0,0],n=0,r=0;
    for(const [q] of ex){c=V.add(c,q);n++;}
    c=V.mul(c,1/Math.max(n,1));
    for(const [q,rd] of ex) r=Math.max(r,V.len(V.sub(q,c))+(rd||0));
    return {c,r:r*1.08};
  };
  const near=(a,b)=>V.len(V.sub(a.c,b.c))<=a.r+b.r;
  const hits=(p,q)=>{
    for(const [z,rd] of partExtents(p)){
      if(inSolid(z,q))return true;
      const t=Math.min(rd,TOL);
      if(t>0)for(const ax of [[t,0,0],[-t,0,0],[0,t,0],[0,-t,0],[0,0,t],[0,0,-t]])
        if(inSolid(V.add(z,ax),q))return true;
    }
    return false;
  };
  const islands=list=>{
    const S=list.map(sphOf), par=list.map((_,i)=>i);
    const find=i=>{while(par[i]!==i){par[i]=par[par[i]];i=par[i];}return i;};
    for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
      if(find(i)===find(j)||!near(S[i],S[j]))continue;
      if(hits(list[i],list[j])||hits(list[j],list[i])){const a=find(i),b=find(j);if(a!==b)par[a]=b;}
    }
    const m=new Map();
    for(let i=0;i<list.length;i++){const r=find(i);if(!m.has(r))m.set(r,[]);m.get(r).push(list[i]);}
    return [...m.values()];
  };

  /* Jobs, not slots: the handed ones are built twice, starboard chain first so
     the port chain can decide whether to copy it. */
  const jobs=[];
  for(const spec of SLOTS) if(!spec.handed)
    jobs.push({id:spec.id,gid:spec.id,on:spec.on,port:false});
  for(const h of HAND) for(const spec of SLOTS) if(spec.handed)
    jobs.push({id:spec.id,gid:spec.id+h,on:spec.on?spec.on+h:null,port:h==="L"});

  /* ---- the chain rule, measured rather than assumed ----
     A chained socket is placed a fixed way along its parent's ENVELOPE — the
     head at 0.84 of the neck's allowance, the humerus at 0.68 of the yoke's.
     That is only right if variants fill their envelopes, and they do not: a
     missile box takes half the yoke it is given and varies the rest, so the arm
     was left hanging at a spread the yoke never reached. Nothing was wrong with
     the arm or the yoke; the join was placed against a promise instead of
     against the part.
     So ask the parent where it actually got to. Project everything it built
     onto its own outward axis, take the furthest, and put the child there —
     keeping whatever sideways offset the chassis asked for. Self-correcting for
     every variant that already exists and every one added later. */
  const REACH={head:0.92,upper:0.70,fore:0.86,drive:0.88};
  const usedFr={};
  for(const spec of jobs){
    const id=spec.id, gid=spec.gid, base=chassis.sockets[id];
    if(!base)continue;
    let sock=spec.port?Object.assign({},base,{fr:mirFrame(base.fr)}):base;
    const pf=spec.on&&usedFr[spec.on];
    if(pf&&groups[spec.on]&&groups[spec.on].length&&REACH[id]!=null){
      const f=V.norm(pf.f);
      let reach=0;
      for(const q of groups[spec.on]) for(const [z] of partExtents(q))
        reach=Math.max(reach,V.dot(V.sub(z,pf.o),f));
      if(reach>1e-6){
        const d=V.sub(sock.fr.o,pf.o), along=V.dot(d,f);
        const perp=V.sub(d,V.mul(f,along));
        sock=Object.assign({},sock,{fr:Object.assign({},sock.fr,
          {o:V.add(pf.o,V.add(perp,V.mul(f,reach*REACH[id])))})});
      }
    }
    usedFr[gid]=sock.fr;
    const list=VAR[id];
    let idx;
    if(lock&&lock[gid]!=null) idx=Math.min(lock[gid],list.length-1);
    else if(spec.port&&chosen[id]&&R()<MATCH) idx=chosen[id].i;
    else idx=Math.floor(R()*list.length);
    const v=list[idx];
    chosen[gid]={i:idx,n:v.n,crew:v.crew||0,cls:v.cls||""};
    const out=[];
    const mr=sock.sr||Math.min(chassis.sr,sock.E.y*0.8,sock.E.z*0.8);
    v.make(builder(sock.fr,out),mr,rr,R,sock.E,probeFor(sock.fr,sock.E),P);
    for(const p of out){applyOps(p,sock.fr);p.slot=true;p.g=gid;p.sd=V.norm(sock.fr.f);
      if(sock.solo)p.solo=true;
      if(spec.port||SLOTS.some(q=>q.handed&&q.id===id))p.handed=true;}

    /* ---- attachment guarantee, per group, against its own parent ----
       A variant that ends up in mid-air is drawn back along its mounting
       direction until it bites. Dropped only if it never can. */
    /* A chained socket must root in ITS PARENT, not in whatever happens to be
       nearby. Handing it the chassis as well let an arm count as attached
       because it grazed the torso, and the drag then stopped the moment it did
       — leaving the humerus short of the yoke it is supposed to hang from,
       which is the join anyone actually looks at. Parent only; the chassis is
       the fallback for when the parent was dropped. */
    const anchor=spec.on&&groups[spec.on]&&groups[spec.on].length&&!dropped.has(spec.on)
      ? groups[spec.on] : chassisSolids;
    if(out.length&&!touches(out,anchor)){
      let cen=[0,0,0];
      for(const p of out)cen=V.add(cen,partCentroid(p));
      cen=V.mul(cen,1/out.length);
      const rad=Math.hypot(cen[1],cen[2]);
      const dirs=[V.mul(V.norm(sock.fr.f),-1)];
      if(rad>1e-6)dirs.push([0,-cen[1]/rad,-cen[2]/rad]);
      dirs.push([cen[0]>0?-1:1,0,0]);
      let fixed=false;
      for(const dir of dirs){
        const span=Math.max(rad,Math.abs(cen[0]),chassis.sr)||1;
        const stepv=V.mul(dir,span/26);
        for(let k2=1;k2<=30;k2++){
          for(const p of out)shift(p,stepv);
          if(touches(out,anchor)){fixed=true;break;}
        }
        if(fixed)break;
        for(const p of out)shift(p,V.mul(stepv,-30));
      }
      if(!fixed){dropped.add(gid);continue;}
    }
    /* now the islands. Whatever reaches the anchor is rooted; the rest is
       pulled toward the rooted mass along the line between them, and dropped
       only if it never bites — a floating cell block is worse than no cell
       block, and both are better than one welded to nothing. */
    if(out.length>2){
      const isl=islands(out);
      if(isl.length>1){
        const rooted=[], loose=[];
        for(const c of isl)(touches(c,anchor)?rooted:loose).push(c);
        if(rooted.length){
          let pool=[].concat(...rooted);
          for(const c of loose){
            let cen=[0,0,0];for(const q of c)cen=V.add(cen,partCentroid(q));
            cen=V.mul(cen,1/c.length);
            let root=[0,0,0];for(const q of pool)root=V.add(root,partCentroid(q));
            root=V.mul(root,1/pool.length);
            let dir=V.sub(root,cen); const dl=V.len(dir);
            dir=dl>1e-6?V.mul(dir,1/dl):V.mul(V.norm(sock.fr.f),-1);
            const step=V.mul(dir,Math.max(dl,chassis.sr)/24);
            let ok=false;
            for(let k2=1;k2<=26;k2++){
              for(const q of c)shift(q,step);
              if(touches(c,pool)||touches(c,anchor)){ok=true;break;}
            }
            if(ok)pool=pool.concat(c);
            else for(let i2=out.length-1;i2>=0;i2--) if(c.indexOf(out[i2])>=0) out.splice(i2,1);
          }
        }
      }
    }
    groups[gid]=out;
    parts.push(...out);
    standing.push(...out);
    const f=sock.fr;
    envs.push({id:gid,c:V.add(f.o,V.mul(f.f,sock.E.x*0.5)),
      u:V.mul(f.f,sock.E.x*0.5),v:V.mul(f.u,sock.E.y),w:V.mul(f.s,sock.E.z)});
  }

  /* Symmetry is a design axis, not a constant. The chassis always mirrors about
     the centreline; what is bolted to it can instead be repeated radially,
     which turns two arms into four. Only offered where the chassis is actually
     centred on its own axis — a split torso has no axis to rotate about. */
  const mir=p=>{
    const g=v=>[v[0],v[1],-v[2]];
    const q=Object.assign({},p);
    for(const k of ["c","a","b","n","u","v","w","axis","sd"]) if(q[k])q[k]=g(q[k]);
    if(q.pts)q.pts=q.pts.map(g);
    if(q.pts2)q.pts2=q.pts2.map(g);
    return q;
  };
  const zOf=p=>{
    if(p.pts)return p.pts.reduce((s,q)=>s+q[2],0)/p.pts.length;
    if(p.c)return p.c[2];
    return (p.a[2]+p.b[2])/2;
  };
  const rotY=(p,th)=>{
    const c=Math.cos(th),sn=Math.sin(th);
    const g=v=>[v[0]*c-v[2]*sn,v[1],v[0]*sn+v[2]*c];
    const q=Object.assign({},p);
    for(const k of ["c","a","b","n","u","v","w","axis","sd"]) if(q[k])q[k]=g(q[k]);
    if(q.pts)q.pts=q.pts.map(g);
    if(q.pts2)q.pts2=q.pts2.map(g);
    return q;
  };
  const radOf=p=>{const c=partCentroid(p);return Math.hypot(c[0],c[2]);};

  const axialOK=!!topo.axial;
  const syI=axialOK?((lock&&lock.sym!=null)?Math.min(lock.sym,SYM.length-1):Math.floor(R()*SYM.length)):0;
  chosen.sym={i:syI,n:axialOK?SYM[syI].n:"BILATERAL"};

  for(const p of parts.slice()) if(!p.solo&&!p.slot&&Math.abs(zOf(p))>1e-4) parts.push(mir(p));
  /* handed groups were built on both sides already; mirroring them would put
     four arms on the machine */
  const slotParts=parts.filter(p=>p.slot&&!p.solo&&!p.handed);
  if(syI===0){
    for(const p of slotParts) if(Math.abs(zOf(p))>1e-4){const q=mir(p);q.g=p.g+"#m";parts.push(q);}
  }else{
    /* radial repeat is about the mech's own vertical, not a flight axis */
    const N=SYM[syI].k, thr=chassis.sr*0.25;
    for(const p of slotParts){
      if(radOf(p)<thr)continue;
      for(let k2=1;k2<N;k2++){const q=rotY(p,k2*Math.PI*2/N);q.g=p.g+"#"+k2;parts.push(q);}
    }
  }

  /* The layout is final here — placed, attached, mirrored — which is the first
     moment anything can see the whole machine. Rig it.
     Note what is measured before that happens: the plate quotes the STRUCTURE.
     Fittings stick out, so a bounding box taken after them grows with the
     Greebling slider, and everything read off that box — height, tonnage, the
     mass band, the name pool the band chooses — moved with a drawing setting.
     A designation is a bijection of the seed and must not know how densely the
     drawing was dressed. */
  const coreCount=parts.length;
  parts.push(...rigMech(parts,R,rr,P,chassis.sr));

  /* registry, derived from what actually got built */
  let vol=0;const pts=[];
  for(const p of parts){
    if(p.k==="sphere"){vol+=4/3*Math.PI*p.r**3;pts.push([p.c,p.r]);}
    else if(p.k==="capsule"){vol+=Math.PI*p.r*p.r*V.len(V.sub(p.b,p.a))+4/3*Math.PI*p.r**3;
      pts.push([p.a,p.r],[p.b,p.r]);}
    else if(p.k==="tube"){vol+=Math.PI/3*(p.r1*p.r1+p.r1*p.r2+p.r2*p.r2)*V.len(V.sub(p.b,p.a));
      pts.push([p.a,p.r1],[p.b,p.r2]);}
    else if(p.k==="disc"){vol+=Math.PI*p.r*p.r*p.r*0.18;pts.push([p.c,p.r]);}
    else if(p.k==="lathe"){
      const e=p.ell?p.ell[0]*p.ell[1]:1;
      for(let i=1;i<p.prof.length;i++){
        const h=Math.abs(p.prof[i][0]-p.prof[i-1][0]),r1=p.prof[i-1][1],r2=p.prof[i][1];
        vol+=Math.PI/3*(r1*r1+r1*r2+r2*r2)*h*e;
      }
      for(const [tt,r] of p.prof)pts.push([V.add(p.c,V.mul(p.axis,tt)),r*Math.max(p.ell?p.ell[0]:1,p.ell?p.ell[1]:1)]);}
    else if(p.k==="box"){vol+=8*V.len(p.u)*V.len(p.v)*V.len(p.w);
      for(let i=0;i<8;i++)pts.push([V.add(p.c,V.add(V.mul(p.u,i&1?1:-1),
        V.add(V.mul(p.v,i&2?1:-1),V.mul(p.w,i&4?1:-1)))),0]);}
    else if(p.k==="panel"){
      let a2=0;for(let i=1;i<p.pts.length-1;i++)
        a2+=V.len(V.cross(V.sub(p.pts[i],p.pts[0]),V.sub(p.pts[i+1],p.pts[0])))/2;
      vol+=a2*p.th;
      for(const q of p.pts)pts.push([q,p.th]);
      if(p.pts2)for(const q of p.pts2)pts.push([q,p.th]);}
  }
  const bb=[[1e9,1e9,1e9],[-1e9,-1e9,-1e9]];
  for(const [q,r] of pts)for(let i=0;i<3;i++){
    bb[0][i]=Math.min(bb[0][i],q[i]-r);bb[1][i]=Math.max(bb[1][i],q[i]+r);}
  /* the structural box: the same measurement, taken over the machine only */
  const cb=[[1e9,1e9,1e9],[-1e9,-1e9,-1e9]];
  for(let i=0;i<coreCount;i++) if(!parts[i].trim) for(const [q,r] of partExtents(parts[i]))
    for(let k2=0;k2<3;k2++){
      cb[0][k2]=Math.min(cb[0][k2],q[k2]-(r||0));cb[1][k2]=Math.max(cb[1][k2],q[k2]+(r||0));}

  /* Build units are not metres. The ship inherited a hull-sized unit and read
     it straight off; a mech is an order of magnitude smaller, so the drawing
     scale and the plate would disagree by that order if this were skipped.
     One build unit is 15.5 cm, which puts a standing humanoid at 16–19 m and
     a light scout under 12 — and the same factor cubed turns swept volume into
     a displacement that reads like armour over voids rather than solid steel. */
  const U2M=0.155;
  const height=(cb[1][1]-cb[0][1])*U2M, width=(cb[1][2]-cb[0][2])*U2M,
        depth=(cb[1][0]-cb[0][0])*U2M;
  /* Mass comes off the envelope, not off the sum of the parts. Swept volume is
     the better model of a mass and the wrong basis for THIS number, because it
     counts fittings: turning the Greebling slider added tonnes, the tonnage
     moved the machine across a role band, the band picked a different name
     pool — and the plate renamed itself because someone changed a drawing
     setting. A designation is a bijection of the seed and has no business
     depending on how densely the drawing is dressed.
     0.055 t/m³ is armour over voids, and it reproduces what the swept sum was
     giving at mid detail. */
  /* Tonnage from the same stable figure the band uses. Quoting it off the
     measured box left it wandering by a tonne or two as fittings were added,
     and a DRY weight that moves when a drawing slider moves is nonsense on a
     plate. 2.35 t per cubic metre of chassis bulk reproduces what the measured
     box was giving at mid detail. */
  const mass=chassis.bulk*2.35;

  /* ---- what did this turn out to be? ----
     The role is read off the finished machine, not rolled: a drive class, a
     mass band, and whether anything on it is a weapon. That is what picks the
     name pool, so the plate reads back the build. */
  const dc=(chosen.drive&&chosen.drive.cls)||"WALKER";
  const armed=[chosen.fore,chosen.foreL,chosen.shoulder,chosen.shoulderL,
               chosen.back,chosen.chest,chosen.head]
    .filter(Boolean).some(c=>/CANNON|RIFLE|GATLING|MISSILE|LAUNCH|TURRET|BEAM|MELTA|PLASMA|FIST|CYCLONE|TWIN/.test(c.n));
  /* The bands are read off the fleet, not guessed: roughly the top and bottom
     third of what the yard actually turns out. Capping torso width moved every
     mass down, and a band left where it was would have called nine machines in
     ten a scout. */
  /* the bands are the top and bottom third of what the yard actually turns
     out, read off 500 rolls rather than guessed */
  const heavy=chassis.bulk>27.3, light=chassis.bulk<22.2;
  let role;
  if(dc==="SKIMMER")                          role=ROLES[6];
  else if(!armed&&/DRILL|CLAMP|CLAW|MANIPULATOR/.test(
            (chosen.fore?chosen.fore.n:"")+" "+(chosen.foreL?chosen.foreL.n:"")))
                                              role=ROLES[dc==="WALKER"?4:5];
  else if(dc==="TANK")                        role=ROLES[3];
  else if(dc==="ROLLER")                      role=ROLES[heavy?3:7];
  else if(heavy)                              role=ROLES[2];
  else if(light)                              role=ROLES[0];
  else                                        role=ROLES[1];

  /* No two mechs may carry the same designation, and luck is not a good enough
     guarantee. The seed is a 32-bit word; read it as a mixed-radix number whose
     digits ARE the designation. Every pool is exactly 64 names long so the
     radix is fixed no matter which pool the build lands in — that is what keeps
     the extraction a bijection, and all 4,294,967,296 machines distinct by
     construction rather than by odds.
       64 names x 26 x 26 block letters x 99,273 serials > 2^32. */
  const K=64, AZ=26, names=POOL[role.pool];
  let u=seed>>>0;
  const name=names[u%K];   u=(u-u%K)/K;
  const b1=u%AZ;           u=(u-b1)/AZ;
  const b2=u%AZ;           u=(u-b2)/AZ;
  const block=String.fromCharCode(65+b1,65+b2), serial=u;
  /* drawn from the seed, not from the stream: the rigging pass runs before this
     and consumes randomness in proportion to the detail setting, so a rolled
     class name changed every time the Greebling slider moved. A name on a plate
     is part of the designation and belongs to the seed. */
  const klass=POOL[role.pool][((seed>>>13)^(seed>>>3))%K];

  return {parts,envs,chosen,bb,meta:{
    desig:`${role.pre}-${block}${String(serial).padStart(5,"0")} ${name}`,
    klass:`${klass}-CLASS ${role.kl}`,
    length:height, beam:width, height:depth,
    mass, crew:(chosen.head?chosen.head.crew:0)+(chosen.chest?chosen.chest.crew:0),
    note:topo.note||"", sym:chosen.sym.n, seed, bulk:chassis.bulk,
    drive:chosen.drive?chosen.drive.n:"—", role:role.k}};
}

/* variant post-ops: cant a fin, shift it outboard, lay it horizontal */
function applyOps(p,fr){
  if(p.k!=="panel")return;
  const rot=(q,ax,ang)=>{
    const c=Math.cos(ang),s=Math.sin(ang),k=V.sub(q,fr.o);
    const r=V.add(V.add(V.mul(k,c),V.mul(V.cross(ax,k),s)),V.mul(ax,V.dot(ax,k)*(1-c)));
    return V.add(fr.o,r);
  };
  if(p.cant){p.pts=p.pts.map(q=>rot(q,V.norm(fr.u),p.cant));p.n=V.norm(
    V.add(V.mul(p.n,Math.cos(p.cant)),V.mul(V.cross(V.norm(fr.u),p.n),Math.sin(p.cant))));}
  if(p.shiftZ)p.pts=p.pts.map(q=>V.add(q,V.mul(fr.s,p.shiftZ)));
}

/* ===================== targets ===================== */
function CanvasTarget(ctx){
  return {
    rect(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);},
    poly(pts,fill,stroke,w){
      if(pts.length<2)return;
      ctx.lineJoin="round";ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.closePath();
      if(fill){ctx.fillStyle=fill;ctx.fill();}
      if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.setLineDash([]);ctx.stroke();}
    },
    path(pts,stroke,w,dash){
      if(pts.length<2)return;
      ctx.lineJoin="round";ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.setLineDash(dash||[]);
      ctx.stroke();ctx.setLineDash([]);
    },
    text(str,x,y,o){
      ctx.fillStyle=o.color;
      ctx.font=`${o.weight||600} ${o.size}px "Saira Condensed","Arial Narrow",sans-serif`;
      ctx.textBaseline="alphabetic";ctx.textAlign="left";
      if(o.tracking){
        const ch=[...str];let tot=0;
        for(const c of ch)tot+=ctx.measureText(c).width+o.tracking;
        tot-=o.tracking;
        let cx=o.anchor==="end"?x-tot:o.anchor==="middle"?x-tot/2:x;
        for(const c of ch){ctx.fillText(c,cx,y);cx+=ctx.measureText(c).width+o.tracking;}
      }else{
        ctx.textAlign=o.anchor==="end"?"right":o.anchor==="middle"?"center":"left";
        ctx.fillText(str,x,y);
      }
    }
  };
}
function SvgTarget(W,H){
  const out=[],f=n=>Math.round(n*10)/10,d=p=>p.map(q=>`${f(q[0])},${f(q[1])}`).join(" ");
  return {
    rect(x,y,w,h,fill){out.push(`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${fill}"/>`);},
    poly(pts,fill,stroke,w){if(pts.length<2)return;
      out.push(`<polygon points="${d(pts)}" fill="${fill||"none"}" stroke-linejoin="round" ${stroke?`stroke="${stroke}" stroke-width="${f(w)}"`:'stroke="none"'}/>`);},
    path(pts,stroke,w,dash){if(pts.length<2)return;
      out.push(`<polyline points="${d(pts)}" fill="none" stroke="${stroke}" stroke-width="${f(w)}" stroke-linecap="round" stroke-linejoin="round"${dash?` stroke-dasharray="${dash.map(f).join(" ")}"`:""}/>`);},
    text(str,x,y,o){
      const esc=str.replace(/[<&>]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
      out.push(`<text x="${f(x)}" y="${f(y)}" fill="${o.color}" font-family="Saira Condensed, Arial Narrow, sans-serif" font-weight="${o.weight||600}" font-size="${f(o.size)}" letter-spacing="${f(o.tracking||0)}" text-anchor="${o.anchor==="end"?"end":o.anchor==="middle"?"middle":"start"}">${esc}</text>`);},
    serialize(){return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${out.join("")}</svg>`;}
  };
}

/* ===================== projections ===================== */
const PROJ={profile:p=>[-p[0],p[1],p[2]],plan:p=>[-p[0],p[2],p[1]],bow:p=>[p[2],p[1],p[0]]};
function isoProj(yaw,pitch){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  return p=>{const x1=p[0]*cy-p[2]*sy,z1=p[0]*sy+p[2]*cy,y1=p[1];
    return [x1,y1*cp-z1*sp,y1*sp+z1*cp];};
}
/* ===================== occlusion =====================
   The see-through flicker was the painter's algorithm. Bodies were sorted by
   centroid depth and each one painted a background-coloured fill beneath its
   own outline, erasing whatever had been drawn before it. Centroid order
   cannot describe two solids that interpenetrate — and on this ship every
   socket interpenetrates by design — so as the pictorial turned, the fill of
   a body behind would land on top of a body in front and punch a hole in it.

   The fills are gone. Each ship is tessellated once — the mesh is invariant
   under yaw, only the projection turns — rasterised into a depth buffer, and
   every line the renderer wants to draw is clipped against that buffer. Draw
   order stops mattering, interpenetration is handled for free, and the output
   is still pure vector polylines, so the SVG export gets the same treatment. */
function shipMesh(ship){
  if(ship._mesh)return ship._mesh;
  const T=[];
  const tri=(a,b,c)=>T.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]);
  const quad=(a,b,c,d)=>{tri(a,b,c);tri(a,c,d);};
  const fan=q=>{for(let i=1;i<q.length-1;i++)tri(q[0],q[i],q[i+1]);};
  const band=(A,B)=>{const n=A.length;
    for(let i=0;i<n;i++)quad(A[i],B[i],B[(i+1)%n],A[(i+1)%n]);};
  const bb=ship.bb;
  const diag=Math.hypot(bb[1][0]-bb[0][0],bb[1][1]-bb[0][1],bb[1][2]-bb[0][2])||1;
  /* the buffer, not the mesh, sets the accuracy floor — facet counts stay modest */
  const SG=r=>Math.max(8,Math.min(40,Math.round(8+r/diag*280)));
  for(const p of ship.parts){
    if(p.k==="sphere"){
      const n=SG(p.r),m=Math.max(4,n>>1),rg=[];
      for(let i=0;i<=m;i++){const th=i/m*Math.PI;
        rg.push(ringPts([p.c[0],p.c[1]+Math.cos(th)*p.r,p.c[2]],
                        Math.sin(th)*p.r,[0,1,0],n));}
      for(let i=0;i<m;i++)band(rg[i],rg[i+1]);
    }else if(p.k==="capsule"){
      const ax=V.norm(V.sub(p.b,p.a)),n=SG(p.r),m=Math.max(3,n>>2);
      const A=ringPts(p.a,p.r,ax,n),B=ringPts(p.b,p.r,ax,n);
      band(A,B);
      let pv=A;
      for(let i=1;i<=m;i++){const th=i/m*Math.PI/2;
        const rg=ringPts(V.add(p.a,V.mul(ax,-Math.sin(th)*p.r)),Math.cos(th)*p.r,ax,n);
        band(pv,rg);pv=rg;}
      pv=B;
      for(let i=1;i<=m;i++){const th=i/m*Math.PI/2;
        const rg=ringPts(V.add(p.b,V.mul(ax,Math.sin(th)*p.r)),Math.cos(th)*p.r,ax,n);
        band(pv,rg);pv=rg;}
    }else if(p.k==="tube"){
      const ax=V.norm(V.sub(p.b,p.a)),n=SG(Math.max(p.r1,p.r2));
      const A=ringPts(p.a,p.r1,ax,n),B=ringPts(p.b,p.r2,ax,n);
      band(A,B);fan(A);fan(B);
    }else if(p.k==="box"){
      const c=[];
      for(let j=0;j<8;j++)c.push(V.add(p.c,V.add(V.mul(p.u,j&1?1:-1),
        V.add(V.mul(p.v,j&2?1:-1),V.mul(p.w,j&4?1:-1)))));
      for(const f of [[0,2,6,4],[1,5,7,3],[0,4,5,1],[2,3,7,6],[0,1,3,2],[4,6,7,5]])
        quad(c[f[0]],c[f[1]],c[f[2]],c[f[3]]);
    }else if(p.k==="disc"){
      const nn=V.norm(p.n),th=V.mul(nn,p.r*0.10),n=SG(p.r);
      const a=V.sub(p.c,th),b=V.add(p.c,th);
      const oA=ringPts(a,p.r,nn,n),oB=ringPts(b,p.r,nn,n);
      band(oA,oB);
      if(p.ri>1e-6){
        const iA=ringPts(a,p.ri,nn,n),iB=ringPts(b,p.ri,nn,n);
        band(iB,iA);band(oA,iA);band(iB,oB);
      }else{fan(oA);fan(oB);}
    }else if(p.k==="lathe"){
      const mr=p.prof.reduce((m,q)=>Math.max(m,q[1]),0),n=SG(mr);
      const [bu,bv]=basis(p.axis),ea=p.ell?p.ell[0]:1,eb=p.ell?p.ell[1]:1;
      const rg=p.prof.map(([tt,r])=>{
        const c=V.add(p.c,V.mul(p.axis,tt)),o=[];
        for(let j=0;j<n;j++){const a=j/n*Math.PI*2;
          o.push(V.add(c,V.add(V.mul(bu,r*ea*Math.cos(a)),V.mul(bv,r*eb*Math.sin(a)))));}
        return o;});
      for(let i=0;i<rg.length-1;i++)band(rg[i],rg[i+1]);
      if(p.prof[0][1]>1e-6)fan(rg[0]);
      if(p.prof[p.prof.length-1][1]>1e-6)fan(rg[rg.length-1]);
    }else if(p.k==="panel"){
      const nn=V.norm(p.n),h=V.mul(nn,p.th*0.5),lo=p.pts2||p.pts;
      const up=p.pts.map(q=>V.add(q,h)),dn=lo.map(q=>V.sub(q,h));
      fan(up);fan(dn);band(up,dn);
    }
  }
  const m={t:new Float32Array(T),diag,tris:T.length/9};
  Object.defineProperty(ship,"_mesh",{value:m});
  return m;
}

/* Every projection here is linear, so it collapses to a 3x3 — that keeps the
   inner rasteriser free of array churn. Row 2 is the depth row; larger is nearer. */
function projMatrix(proj){
  const a=proj([1,0,0]),b=proj([0,1,0]),c=proj([0,0,1]);
  return [a[0],b[0],c[0], a[1],b[1],c[1], a[2],b[2],c[2]];
}
function buildDepth(z,ship,proj,res){
  const m=projMatrix(proj);
  const b=viewBBox(ship,proj);
  const sc=res/Math.max(b.w,b.h,1e-6);
  const W=Math.max(2,Math.min(2600,Math.ceil(b.w*sc)+4));
  const H=Math.max(2,Math.min(2600,Math.ceil(b.h*sc)+4));
  const need=W*H;
  if(!z.buf||z.buf.length<need)z.buf=new Float32Array(need);
  const buf=z.buf;
  buf.fill(-1e30,0,need);
  z.w=W;z.h=H;z.sc=sc;z.ox=2-b.x*sc;z.oy=2-b.y*sc;z.m=m;
  const M=shipMesh(ship);
  /* slope-scaled depth offset. Sockets are flush and detail lines lie exactly
     on the surface they belong to, so the mesh is pushed a hair away from the
     eye rather than biasing every query — the classic polygon-offset trade. */
  const flat=M.diag*0.0012;
  const T=M.t,nT=T.length/9;
  for(let i=0;i<nT;i++){
    const o=i*9;
    const ax=T[o],ay=T[o+1],az=T[o+2],bx=T[o+3],by=T[o+4],bz=T[o+5],
          cx=T[o+6],cy=T[o+7],cz=T[o+8];
    const x0=(m[0]*ax+m[1]*ay+m[2]*az)*sc+z.ox,
          y0=(m[3]*ax+m[4]*ay+m[5]*az)*sc+z.oy,
          z0=m[6]*ax+m[7]*ay+m[8]*az;
    const x1=(m[0]*bx+m[1]*by+m[2]*bz)*sc+z.ox,
          y1=(m[3]*bx+m[4]*by+m[5]*bz)*sc+z.oy,
          z1=m[6]*bx+m[7]*by+m[8]*bz;
    const x2=(m[0]*cx+m[1]*cy+m[2]*cz)*sc+z.ox,
          y2=(m[3]*cx+m[4]*cy+m[5]*cz)*sc+z.oy,
          z2=m[6]*cx+m[7]*cy+m[8]*cz;
    let lo=x0<x1?(x0<x2?x0:x2):(x1<x2?x1:x2);
    let hi=x0>x1?(x0>x2?x0:x2):(x1>x2?x1:x2);
    let minx=lo<0?0:Math.floor(lo), maxx=hi>W-1?W-1:Math.ceil(hi);
    if(minx>maxx)continue;
    lo=y0<y1?(y0<y2?y0:y2):(y1<y2?y1:y2);
    hi=y0>y1?(y0>y2?y0:y2):(y1>y2?y1:y2);
    let miny=lo<0?0:Math.floor(lo), maxy=hi>H-1?H-1:Math.ceil(hi);
    if(miny>maxy)continue;
    const area=(x1-x0)*(y2-y0)-(x2-x0)*(y1-y0);
    if(area<1e-9&&area>-1e-9)continue;
    const ia=1/area;
    const dzdx=((z1-z0)*(y2-y0)-(z2-z0)*(y1-y0))*ia;
    const dzdy=((z2-z0)*(x1-x0)-(z1-z0)*(x2-x0))*ia;
    const push=flat+(Math.abs(dzdx)+Math.abs(dzdy))*0.9;
    const s=area<0?-1:1;
    const A0=-(y2-y1),A1=-(y0-y2),A2=-(y1-y0);
    const fx0=minx+0.5;
    for(let py=miny;py<=maxy;py++){
      const fy=py+0.5;
      let w0=((x2-x1)*(fy-y1)-(y2-y1)*(fx0-x1))*s;
      let w1=((x0-x2)*(fy-y2)-(y0-y2)*(fx0-x2))*s;
      let w2=((x1-x0)*(fy-y0)-(y1-y0)*(fx0-x0))*s;
      const d0=A0*s,d1=A1*s,d2=A2*s;
      let zz=z0+dzdx*(fx0-x0)+dzdy*(fy-y0)-push;
      const row=py*W;
      for(let px=minx;px<=maxx;px++,w0+=d0,w1+=d1,w2+=d2,zz+=dzdx){
        if(w0>=0&&w1>=0&&w2>=0){
          const k=row+px;
          if(zz>buf[k])buf[k]=zz;
        }
      }
    }
  }
  return z;
}
/* one buffer per view slot: the pictorial rebuilds on every frame of a spin,
   the three elevations only when the ship or the sheet geometry changes */
/* the depth pass is the frame's real cost, and it scales with area. A phone
   holds the ceiling well below print resolution; the export lifts it. */
let ZCAP=1500;
const ZSLOT=Object.create(null);
function depthBuffer(ship,proj,res,slot,sig){
  const cur=ZSLOT[slot];
  if(cur&&cur.ship===ship&&cur.sig===sig&&cur.res===res)return cur.z;
  const z=(cur&&cur.z)||{buf:null};
  buildDepth(z,ship,proj,res);
  ZSLOT[slot]={ship,sig,res,z};
  return z;
}
function zVis(z,q){
  const m=z.m,qx=q[0],qy=q[1],qz=q[2];
  const px=Math.floor((m[0]*qx+m[1]*qy+m[2]*qz)*z.sc+z.ox);
  if(px<0||px>=z.w)return true;
  const py=Math.floor((m[3]*qx+m[4]*qy+m[5]*qz)*z.sc+z.oy);
  if(py<0||py>=z.h)return true;
  return (m[6]*qx+m[7]*qy+m[8]*qz)>=z.buf[py*z.w+px];

/* ===================== view =====================
   House rules from the reference plate: one silhouette weight, one lighter
   detail weight, nothing else; every body is a single closed outline; arc
   segment counts follow projected size so nothing facets at print scale.

   Nothing is filled and nothing is painted over. A line is drawn where the
   depth buffer says it is the nearest surface along that ray, so bodies never
   swap places as the pictorial turns and a body behind can never erase one in
   front. Silhouettes keep the 3D point each hull vertex came from, which is
   what lets the outline be clipped in depth like every other line. */
function drawView(t,ship,proj,scale,ox,oy,pal,lw,reveal,showEnv,slot,sig,hatch){
  const S=p=>{const q=proj(p);return [ox+q[0]*scale,oy-q[1]*scale];};
  const D=p=>proj(p)[2];
  const ink=pal.ink, dw=lw*0.75, hw=lw*0.55;
  const faces=(p,n)=>D(V.add(p,V.mul(n,1e-3)))>D(p);
  const SEG=rpx=>Math.max(14,Math.min(112,Math.round(6+rpx*1.35)));
  /* the eye direction falls out of the projection: it is the depth row */
  const EYE=V.norm([D([1,0,0]),D([0,1,0]),D([0,0,1])]);

  const bv=viewBBox(ship,proj);
  const res=Math.max(200,Math.min(ZCAP,Math.round(Math.max(bv.w,bv.h)*scale*1.2)));
  const z=depthBuffer(ship,proj,res,slot||"iso",sig||"");
  const VIS=q=>zVis(z,q);

  /* open polyline, cut wherever the depth buffer hides it */
  function runs3(pts3,ok,minLen){
    const out=[];let run=[];
    for(let i=0;i<pts3.length;i++){
      const q=pts3[i];
      if(ok(q))run.push(S(q));else{if(run.length>1)out.push(run);run=[];}
    }
    if(run.length>1)out.push(run);
    if(!minLen)return out;
    return out.filter(r=>{
      let L=0;for(let i=1;i<r.length;i++)L+=Math.hypot(r[i][0]-r[i-1][0],r[i][1]-r[i-1][1]);
      return L>minLen;});
  }
  /* closed loop */
  function runs(pts3,ok,minLen){
    const out=[];let run=[];
    for(let i=0;i<=pts3.length;i++){
      const q=pts3[i%pts3.length];
      if(ok(q))run.push(S(q));else{if(run.length>1)out.push(run);run=[];}
    }
    if(run.length>1)out.push(run);
    if(!minLen)return out;
    return out.filter(r=>{
      let L=0;for(let i=1;i<r.length;i++)L+=Math.hypot(r[i][0]-r[i-1][0],r[i][1]-r[i-1][1]);
      return L>minLen;});
  }
  /* a hidden-line cut can land anywhere along an edge, so long straight edges
     are resampled to roughly a 5 px stride before they are tested */
  function dens(pts3,closed,step){
    const out=[],n=pts3.length,last=closed?n:n-1;
    for(let i=0;i<last;i++){
      const A=pts3[i],B=pts3[(i+1)%n],a=S(A),b=S(B);
      const k=Math.max(1,Math.min(64,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/(step||5))));
      for(let j=0;j<k;j++)out.push(V.lerp(A,B,j/k));

    return out;
  }
  /* a depth test cut shorter than a line width is quantisation noise, not a
     visible sliver of hull — dropping it stops the outline speckling as it turns */
  const MINR=Math.max(1.6,lw*1.5);
  const stroke=(pts3,closed,w,minLen)=>{
    const mn=minLen===undefined?MINR:minLen;
    for(const r of (closed?runs(pts3,VIS,mn):runs3(pts3,VIS,mn)))
      t.path(r,ink,w===undefined?lw:w);
  };
  /* silhouette: hull vertices carry the 3D point they were projected from */
  const tag=(pts3,k)=>pts3.map(q=>{const s=S(q);return [s[0],s[1],k,q];});
  const hullLoop=H=>dens(H.map(h=>h[3]),true);

  /* ---- tone =====================================================
     One light, fixed to the eye rather than to the ship, so the shading stays
     put while the model turns. The hatch is cut in each surface's own parameter
     space — meridians on a body of revolution, small circles about the light on
     a sphere, chords in the plane of a flat face — so it sticks to the form
     instead of swimming across it, and it is clipped by the same depth buffer
     as every other line. Density is an ordered dither over the hatch index:
     eight interleaved passes are what let a coarse family read as continuous
     tone, and what makes the field grow a line at a time instead of popping. */
  const HATCH=!!hatch;
  const PM=projMatrix(proj);
  const LV=[-0.42,0.72,0.55];
  const LOBJ=V.norm([PM[0]*LV[0]+PM[3]*LV[1]+PM[6]*LV[2],
                     PM[1]*LV[0]+PM[4]*LV[1]+PM[7]*LV[2],
                     PM[2]*LV[0]+PM[5]*LV[1]+PM[8]*LV[2]]);
  /* a tight terminator: most of the lit side takes no hatch at all and most of
     the dark side takes the full family, so the two read as tone rather than as
     an even scatter of lines over everything */
  const tone=d=>{const v=(0.30-d)/0.55;return v<0?0:v>1?1:v;};
  const TONE=n=>tone(V.dot(n,LOBJ));
  const DITH=[0,4,2,6,1,5,3,7];
  const thrOf=i=>(DITH[i&7]+0.12)/8;
  /* hatch families are sized so the darkest pass lands near a 3.6 px pitch */
  const hatchN=cpx=>Math.max(8,Math.min(96,Math.round(cpx/22.4)*8));
  const HGAP=2.8/Math.max(scale,1e-6);
  /* a run of hatch is only kept where the surface faces us and is not buried */
  function hatchRun(pts,nrms,keep){
    const out=[];let run=[];
    for(let i=0;i<pts.length;i++){
      const q=pts[i];
      if((!keep||keep[i])&&faces(q,nrms[i])&&VIS(q))run.push(S(q));
      else{if(run.length>1)out.push(run);run=[];}
    }
    if(run.length>1)out.push(run);
    for(const r of out){
      let L=0;for(let i=1;i<r.length;i++)L+=Math.hypot(r[i][0]-r[i-1][0],r[i][1]-r[i-1][1]);
      if(L>MINR)t.path(r,ink,hw);
    }
  }
  function densPN(pts,nrms,step){
    const P=[],N=[],n=pts.length;
    for(let i=0;i<n-1;i++){
      const A=pts[i],B=pts[i+1],a=S(A),b=S(B);
      const k=Math.max(1,Math.min(32,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/(step||7))));
      for(let j=0;j<k;j++){P.push(V.lerp(A,B,j/k));N.push(V.norm(V.lerp(nrms[i],nrms[i+1],j/k)));}

  function hatchAxial(a,b,r1,r2,axis){

    const NH=hatchN(2*Math.PI*Math.max(r1,r2)*scale);
    for(let i=0;i<NH;i++){
      const th=i/NH*Math.PI*2;
      const rad=V.add(V.mul(u,Math.cos(th)),V.mul(v,Math.sin(th)));
      const n=V.norm(V.sub(rad,V.mul(axis,dr)));
      if(TONE(n)<thrOf(i))continue;
      const [P,N]=densPN([V.add(a,V.mul(rad,r1)),V.add(b,V.mul(rad,r2))],[n,n]);
      hatchRun(P,N);
    }
  }
  /* small circles about the light: every one is a line of constant tone, so the
     hatch follows the terminator round the ball however it is turned */
  function hatchSphere(c,r){
    const NH=hatchN(2*Math.PI*r*scale), half=Math.max(4,NH>>1);
    for(let i=0;i<half;i++){
      const phi=(i+0.5)/half*Math.PI, cp=Math.cos(phi);
      if(tone(cp)<thrOf(i))continue;
      const rr=r*Math.sin(phi);
      if(rr*scale<1.5)continue;
      const pts=ringPts(V.add(c,V.mul(LOBJ,r*cp)),rr,LOBJ,SEG(rr*scale));
      hatchRun(pts.concat([pts[0]]),pts.map(q=>V.norm(V.sub(q,c))).concat([V.norm(V.sub(pts[0],c))]));
    }
  }
  /* chords in the plane of a flat face, scan-line clipped to its outline */
  function hatchFace(poly3,nrm,hole){
    const tn=TONE(nrm);
    if(tn<thrOf(0))return;
    const [u,v]=basis(nrm), o=poly3[0];
    const P=poly3.map(q=>{const d=V.sub(q,o);return [V.dot(d,u),V.dot(d,v)];});
    let mn=1e30,mx=-1e30;
    for(const q of P){if(q[1]<mn)mn=q[1];if(q[1]>mx)mx=q[1];}
    const K=Math.min(160,Math.floor((mx-mn)/HGAP));
    const hv=hole?V.sub(hole.c,o):null;
    const hc=hv?[V.dot(hv,u),V.dot(hv,v)]:null;
    for(let k=0;k<K;k++){
      if(tn<thrOf(k))continue;
      const y=mn+(k+0.5)*HGAP, xs=[];
      for(let j=0,m=P.length;j<m;j++){
        const A=P[j],B=P[(j+1)%m];
        if((A[1]>y)!==(B[1]>y))xs.push(A[0]+(B[0]-A[0])*(y-A[1])/((B[1]-A[1])||1e-9));
      }
      xs.sort((a,b)=>a-b);
      for(let j=0;j+1<xs.length;j+=2){
        let spans=[[xs[j],xs[j+1]]];
        if(hc&&Math.abs(y-hc[1])<hole.r){            /* an annulus keeps its hole */
          const w=Math.sqrt(hole.r*hole.r-(y-hc[1])*(y-hc[1]));
          spans=[[xs[j],Math.min(xs[j+1],hc[0]-w)],[Math.max(xs[j],hc[0]+w),xs[j+1]]];
        }
        for(const [x0,x1] of spans){
          if(x1-x0<HGAP*0.4)continue;
          const q0=V.add(o,V.add(V.mul(u,x0),V.mul(v,y)));
          const q1=V.add(o,V.add(V.mul(u,x1),V.mul(v,y)));
          const [PP,NN]=densPN([q0,q1],[nrm,nrm]);
          hatchRun(PP,NN);
        }
      }
    }
  }

    const dash=[scale*0.55,scale*0.35];
    for(const e of ship.envs){
      const c=[];
      for(let i=0;i<8;i++)c.push(V.add(e.c,V.add(V.mul(e.u,i&1?1:-1),
        V.add(V.mul(e.v,i&2?1:-1),V.mul(e.w,i&4?1:-1)))));
      for(const [x,y] of [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]])

    }

  const items=ship.parts.map((p,i)=>({p,i,z:D(partCentroid(p))}))
                        .sort((a,b)=>a.z-b.z||a.i-b.i);
  const shown=Math.max(0,Math.min(items.length,Math.round(items.length*reveal)));

  /* walk a tagged hull, stroking every edge except the ones on a buried cap */

      return p[2]===0?drawA:drawB;

    for(let i=0;i<n;i++){

      const A=H[i][3],B=H[(i+1)%n][3],a=S(A),b=S(B);
      const k=Math.max(1,Math.min(64,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/5)));
      if(!run.length)run.push(A);
      for(let j=1;j<=k;j++)run.push(V.lerp(A,B,j/k));
    }
    flush();
  }
  function surfDet(p,axis,a,b,r1,r2,n){

    }
    const [u,v]=basis(axis);
    for(const th of (d.longs||[])){

      const pts=[];
      for(let i=0;i<=20;i++){const f=i/20;
        pts.push(V.add(V.lerp(a,b,f),V.mul(dir,r1+(r2-r1)*f)));}
      for(const run of runs3(pts,q=>faces(q,dir)&&VIS(q),0))

    }
    for(const po of (d.ports||[])){
      const dir=V.add(V.mul(u,Math.cos(po.th)),V.mul(v,Math.sin(po.th)));
      const c=V.add(V.lerp(a,b,po.t),V.mul(dir,r1+(r2-r1)*po.t));
      if(!faces(c,dir))continue;

                                    V.mul(bv,p.prof[i][1]*eb*Math.sin(a)))));}

      const rings=p.prof.map((q,i)=>ring(i));
      const all=[];for(const rg of rings)for(const q of rg)all.push(q);

        const pts=[],ok=[];
        for(let i=0;i<NP;i++){
          const q=V.add(cen(i),V.add(V.mul(bu,p.prof[i][1]*ea*Math.cos(th)),
                                     V.mul(bv,p.prof[i][1]*eb*Math.sin(th))));
          const [dt,dr]=slope(i);
          pts.push(q);ok.push(faces(q,V.norm(V.sub(V.mul(rad,dt),V.mul(p.axis,dr)))));
        }
        let seq=[];

        }

      }
      if(HATCH){
        const NH=hatchN(2*Math.PI*mr*scale);
        for(let i=0;i<NH;i++){
          const th=i/NH*Math.PI*2;
          const rad=V.add(V.mul(bu,Math.cos(th)),V.mul(bv,Math.sin(th)));
          const pts=[],nrm=[];let lit=0;
          for(let j=0;j<NP;j++){
            const q=V.add(cen(j),V.add(V.mul(bu,p.prof[j][1]*ea*Math.cos(th)),
                                       V.mul(bv,p.prof[j][1]*eb*Math.sin(th))));
            const [dt,dr]=slope(j);

    }

      let cor,F,N;
      if(p.k==="box"){
        cor=[];

          V.add(V.mul(p.v,j&2?1:-1),V.mul(p.w,j&4?1:-1)))));
        F=[[0,2,6,4],[1,5,7,3],[0,4,5,1],[2,3,7,6],[0,1,3,2],[4,6,7,5]];

        const n=p.n,h=V.mul(n,p.th*0.5),m=p.pts.length,lo=p.pts2||p.pts;

        F=[Array.from({length:m},(_,j)=>j),Array.from({length:m},(_,j)=>m+m-1-j)];
        N=[n,V.mul(n,-1)];
        for(let j=0;j<m;j++){
          if(p.skipSide===j)continue;
          const kk=(j+1)%m;
          F.push([j,kk,m+kk,m+j]);
          N.push(V.norm(V.cross(V.sub(p.pts[kk],p.pts[j]),n)));
        }
      }
      const m0=p.k==="panel"?p.pts.length:0;
      F.forEach((f,fi)=>{
        const ctr=V.mul(f.reduce((s,j)=>V.add(s,cor[j]),[0,0,0]),1/f.length);
        if(!faces(ctr,V.norm(N[fi])))return;
        if(p.k==="panel"&&fi<2&&p.skipSide!=null&&p.skipSide>=0){
          const off=fi===0?0:m0, sk=p.skipSide, idx=[];

        }else stroke(dens(f.map(j=>cor[j]),true),true);
        if(HATCH)hatchFace(f.map(j=>cor[j]),V.norm(N[fi]),null);
        const d=p.det;
        if(d&&d.ribs&&fi<2&&f.length===4){
          const q=f.map(j=>cor[j]);
          for(let kk=1;kk<d.ribs;kk++){
            const tk=kk/d.ribs;
            stroke(dens([V.lerp(q[0],q[q.length-1],tk),V.lerp(q[1],q[2],tk)],false),false,dw);
          }
        }

    }

    if(p.k==="disc"){
      const n=V.norm(p.n),thk=V.mul(n,p.r*0.10),sg=SEG(p.r*scale);
      const a=V.sub(p.c,thk),b=V.add(p.c,thk);
      const ca=ringPts(a,p.r,n,sg),cb=ringPts(b,p.r,n,sg);
      stroke(hullLoop(hull(tag(ca,0).concat(tag(cb,1)))),false);
      const near=faces(p.c,n)?b:a;
      stroke(ringPts(near,p.r,n,sg),true);
      if(p.ri>1e-6)stroke(ringPts(near,p.ri,n,sg),true);
      if(HATCH)hatchFace(ringPts(near,p.r,n,Math.min(sg,48)),faces(p.c,n)?n:V.mul(n,-1),
                         p.ri>1e-6?{c:near,r:p.ri}:null);

    }

    /* tube / capsule */
    const axis=V.norm(V.sub(p.b,p.a));
    const isCap=p.k==="capsule";
    const ra=isCap?p.r:p.r1, rb=isCap?p.r:p.r2;
    const n=Math.max(SEG(ra*scale),SEG(rb*scale));
    /* under an orthographic view a sphere's outline is the great circle
       square to the eye, so the capsule's caps get real 3D silhouettes */
    const pA=isCap?ringPts(p.a,p.r,EYE,n):ringPts(p.a,ra,axis,n);
    const pB=isCap?ringPts(p.b,p.r,EYE,n):ringPts(p.b,rb,axis,n);
    outline(hull(tag(pA,0).concat(tag(pB,1))),!p.hideA,!p.hideB);
    if(!isCap){
      if(!p.hideA&&faces(p.a,V.mul(axis,-1)))stroke(ringPts(p.a,p.r1,axis,n),true);
      if(!p.hideB&&faces(p.b,axis))stroke(ringPts(p.b,p.r2,axis,n),true);
    }
    surfDet(p,axis,p.a,p.b,ra,rb,n);
    if(HATCH){
      hatchAxial(p.a,p.b,ra,rb,axis);
      if(isCap){hatchSphere(p.a,p.r);hatchSphere(p.b,p.r);}
    }
  }
}
function hull(pts){
  const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}
  for(let i=p.length-1;i>=0;i--){const q=p[i];
    while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}
  lo.pop();up.pop();return lo.concat(up);
}
function partCentroid(p){
  if(p.k==="lathe")return p.c;
  if(p.pts)return V.mul(p.pts.reduce((s,q)=>V.add(s,q),[0,0,0]),1/p.pts.length);
  if(p.c)return p.c;
  return V.mul(V.add(p.a,p.b),0.5);
}
function partExtents(p){
  const o=[];
  if(p.k==="box"){
    /* Corners are the worst possible probe for "is this touching anything":
       they are the eight points of a box furthest from its own bulk, and a box
       seated snugly inside a curved neighbour has all eight of them poking out
       through the surface. A louvre lying flat on an armour shell reported
       itself as floating for exactly this reason. Offer the centre and the six
       face centres as well, so a part is judged on where its mass is and not
       only on where its extremities are. */
    o.push([p.c,0]);
    for(const ax of ["u","v","w"]) for(const sg of [1,-1]) o.push([V.add(p.c,V.mul(p[ax],sg)),0]);
    for(let i=0;i<8;i++)
      o.push([V.add(p.c,V.add(V.mul(p.u,i&1?1:-1),V.add(V.mul(p.v,i&2?1:-1),V.mul(p.w,i&4?1:-1)))),0]);}
  else if(p.k==="panel"){
    for(const q of p.pts)o.push([q,p.th]);
    if(p.pts2)for(const q of p.pts2)o.push([q,p.th]);
    /* and the middle of the plate, for the same reason */
    let c=[0,0,0];for(const q of p.pts)c=V.add(c,q);
    o.push([V.mul(c,1/Math.max(p.pts.length,1)),p.th]);}
  else if(p.k==="lathe"){
    /* A lathe used to offer only its axis stations, each carrying the profile
       radius — which is a lie the moment the section is elliptical, because the
       probe then steps `r` in a direction the solid only reaches `r*0.4` in and
       lands outside. Worse, everything the attachment guarantee knows about a
       lathe was those few collinear points, so a plate could be sitting flat on
       its neighbour and still report itself as floating.
       Give it real points ON the surface instead: four round each station,
       squashed by the same ellipse the renderer uses. */
    const [bu,bv]=basis(p.axis), ea=p.ell?p.ell[0]:1, eb=p.ell?p.ell[1]:1;
    for(const [tt,r] of p.prof){
      const c=V.add(p.c,V.mul(p.axis,tt));
      o.push([c,r*Math.min(ea,eb)]);
      if(r<=1e-6)continue;
      for(let j=0;j<4;j++){
        const a2=j/4*Math.PI*2;
        o.push([V.add(c,V.add(V.mul(bu,r*ea*Math.cos(a2)),V.mul(bv,r*eb*Math.sin(a2)))),0]);
      }
    }
  }
  else if(p.k==="sphere"||p.k==="disc")o.push([p.c,p.r]);
  else if(p.k==="capsule")o.push([p.a,p.r],[p.b,p.r]);
  else o.push([p.a,p.r1],[p.b,p.r2]);
  return o;
}
function viewBBox(ship,proj){
  let a=[1e9,1e9],b=[-1e9,-1e9];
  for(const p of ship.parts)for(const [q,r] of partExtents(p)){
    const s=proj(q);
    a[0]=Math.min(a[0],s[0]-r);b[0]=Math.max(b[0],s[0]+r);
    a[1]=Math.min(a[1],s[1]-r);b[1]=Math.max(b[1],s[1]+r);}

/* one estimator for both targets: text never overruns its cell */

  const w=str.length*size*0.58+Math.max(0,str.length-1)*tracking;

function renderSheet(t,W,H,ship,P,pal,opts){

  const U=Math.min(W,H);
  const portrait=W<H*1.02;
  const m=U*0.045,band=U*(portrait?0.20:0.165),gutH=U*0.032;
  const labelH=U*(portrait?0.062:0.052), gutV=labelH*1.05;
  const cw=W-m*2,chTop=m,chBot=H-m-band;
  const contH=chBot-chTop;
  const inset=U*0.020;
  const projs={profile:PROJ.profile,plan:PROJ.plan,bow:PROJ.bow,iso:isoProj(opts.yaw,opts.pitch)};
  t.rect(0,0,W,H,pal.bg);

  /* A general-arrangement sheet is four views because a draughtsman needs four.
     On a phone that is four thumbnails, and the pictorial — the only one anybody
     turns — comes out the size of a postage stamp. Solo throws the sheet away
     and gives the whole plate to the pictorial. The corner marks sit outside the
     cell the spin loop repaints, so a frame never wipes them. */
  if(opts.solo){
    const mk=U*0.016, mg=U*0.030, tk=U*0.020;
    const c={x:mg,y:mg,w:W-mg*2,h:H-mg*2};
    /* size from the hull box, not from this frame's silhouette: the spin only
       redraws the pictorial, so a scale that tracked the current yaw would make
       the ship breathe in and out and overrun the plate on its widest quarter */
    const bbS=ship.bb;
    const ctr=[(bbS[0][0]+bbS[1][0])/2,(bbS[0][1]+bbS[1][1])/2,(bbS[0][2]+bbS[1][2])/2];
    const dg=Math.hypot(bbS[1][0]-bbS[0][0],bbS[1][2]-bbS[0][2]);
    const hg=(bbS[1][1]-bbS[0][1])*Math.abs(Math.cos(opts.pitch))
            +dg*Math.abs(Math.sin(opts.pitch));
    const pj=projs.iso;
    const sc1=Math.min(c.w/Math.max(dg,1e-6),c.h/Math.max(hg,1e-6));
    const pc=pj(ctr);
    const o={ox:c.x+c.w/2-pc[0]*sc1, oy:c.y+c.h/2+pc[1]*sc1};
    drawView(t,ship,pj,sc1,o.ox,o.oy,pal,lw,reveal,false,"iso",
             `${opts.yaw},${opts.pitch},${k}`,opts.tone!==false);
    t.path([[mk,mk+tk],[mk,mk],[mk+tk,mk]],ink,lw);
    t.path([[W-mk-tk,mk],[W-mk,mk],[W-mk,mk+tk]],ink,lw);
    t.path([[mk,H-mk-tk],[mk,H-mk],[mk+tk,H-mk]],ink,lw);
    t.path([[W-mk-tk,H-mk],[W-mk,H-mk],[W-mk,H-mk-tk]],ink,lw);
    return {cells:{iso:c},sc:{iso:sc1},origin:{iso:o}};
  }

  const bProf=viewBBox(ship,projs.profile), bPlan=viewBBox(ship,projs.plan);
  const bBow=viewBBox(ship,projs.bow);
  const shipL=Math.max(bProf.w,bPlan.w);
  /* A hull is longer than it is tall, so its elevations stack: three wide, flat
     drawings down one column. A mech is the other way round, and stacking two
     portrait elevations makes the scale collapse — each one gets a third of the
     height it needs and the sheet fills with margin. So when the subject is
     tall, the elevations run ACROSS instead, three columns at one shared scale.
     Same sheet, same views, transposed to the thing being drawn.

     The threshold is not "taller than wide" but "not much wider than tall",
     because stacking costs the scale twice over: two full-height views in one
     column halve it, and a squat machine that is 1:1 in elevation gets the same
     punishment a standing one does. Only something genuinely long and flat —
     a hull — has anything to gain from the stack. */

  const boxes={profile:bProf,plan:bPlan,bow:bBow};
  const bbS=ship.bb;
  const isoCtr=[(bbS[0][0]+bbS[1][0])/2,(bbS[0][1]+bbS[1][1])/2,(bbS[0][2]+bbS[1][2])/2];
  const isoDiag=Math.hypot(bbS[1][0]-bbS[0][0],bbS[1][2]-bbS[0][2]);
  const isoHgt=(bbS[1][1]-bbS[0][1])*Math.abs(Math.cos(opts.pitch))
              +isoDiag*Math.abs(Math.sin(opts.pitch));
  let scale;

  if(portrait){
    /* narrow screens: pictorial first and as large as the projection set allows,
       each elevation row cut to the drawing rather than a fixed share */

    const stackFixed=inset*6+gutV*3;
    let sW=(cw-inset*2)/Math.max(shipL,1e-6);
    let stackH=sumH*sW+stackFixed;
    const minIso=contH*0.34;
    if(contH-stackH<minIso)

         under the pictorial suit a portrait plate better than three bands */

                  (contH*0.42-inset*2)/Math.max(bProf.h,bBow.h,1e-6));

    const isoNeed=isoHgt*((cw-inset*1.1)/Math.max(isoDiag,1e-6))+inset*2;
    let isoH=Math.max(minIso,Math.min(contH-stackH,isoNeed));
    /* both columns are width-bound, so share any slack instead of pooling it */
    const slack=Math.max(0,contH-stackH-isoH)/4;
    isoH+=slack;

         front elevation. Give each column the width its drawing actually needs

      const bowShare=contH*0.24, rem=contH-gutV*2-bowShare;
      scale=Math.min((leftW-inset*2)/Math.max(shipL,1e-6),
                     (rem-inset*4)/Math.max(bProf.h+bPlan.h,1e-6));
      const rP=bProf.h*scale+inset*2, rN=bPlan.h*scale+inset*2;
      cells.profile={x:m,y:chTop,w:leftW,h:rP};
      cells.plan={x:m,y:chTop+rP+gutV,w:leftW,h:rN};
      cells.bow={x:m,y:chTop+rP+rN+gutV*2,w:leftW,

       line back by ending the cell a label short of the band. */

                          (cells.bow.h-inset*2)/Math.max(bBow.h,1e-6));
  for(const key of ["profile","plan","bow"]){

    let tx=(tall?{profile:"SIDE — STBD",plan:"PLAN",bow:"FRONT",iso:"PICTORIAL"}

  const px=20*scale, by=H-m-band+(portrait?U*0.052:U*0.055),
        bx=portrait?Math.max(m+U*0.34,W-m-px-U*0.13):m;
  t.path([[bx,by],[bx+px,by]],ink,lw);
  for(let i=0;i<=4;i++)t.path([[bx+px*i/4,by],[bx+px*i/4,by-(i%2?U*0.009:U*0.016)]],ink,lw);
  t.text("0",bx,by+U*0.023,{size:U*0.0155,color:ink,weight:500,tracking:U*0.002});
  t.text("20 M",bx+px,by+U*0.023,{size:U*0.0155,color:ink,weight:500,tracking:U*0.002,anchor:"end"});
  const fx=bx+px+U*0.05,fh=1.8*scale,fw=fh*0.26;
  t.poly([[fx-fw*0.5,by],[fx-fw*0.5,by-fh*0.52],[fx-fw*0.85,by-fh*0.78],[fx-fw*0.35,by-fh*0.80],
          [fx,by-fh*0.62],[fx+fw*0.35,by-fh*0.80],[fx+fw*0.85,by-fh*0.78],[fx+fw*0.5,by-fh*0.52],

    t.path([[bxx,rMet],[bxx+bw,rMet]],ink,lw*0.8);

       then shrank the lot to fit the column, which is why it rendered as a grey
       smudge nobody could read. A caption is not a data dump. Keep the one part
       of it that says something a reader would want to know, at a size they can
       actually read it at. */

      .toUpperCase()+(ship.meta.sym!=="BILATERAL"?"   "+ship.meta.sym:"");
    T(cfg,bxx+pad,byy+bh*0.60,bh*0.105,bh*0.013,500,lw1);
    T("MECH YARD",bxx+bw-pad,byy+bh*0.26,bh*0.115,bh*0.018,600,rw1,"end");
    T("FRAME "+M.seed,bxx+bw-pad,byy+bh*0.44,bh*0.115,bh*0.018,500,rw1,"end");
    T("SHEET 1 OF 1",bxx+bw-pad,byy+bh*0.61,bh*0.095,bh*0.014,500,rw1,"end");

                ["CREW",M.crew?String(M.crew):"NIL"]];

      t.text(c[1],cx,byy+bh*0.96,{size:bh*0.135,color:ink,weight:600,tracking:bh*0.010});
    });
  }

  t.path([[m,m+tk],[m,m],[m+tk,m]],ink,lw);
  t.path([[W-m-tk,m],[W-m,m],[W-m,m+tk]],ink,lw);
  t.path([[m,H-m-tk],[m,H-m],[m+tk,H-m]],ink,lw);

}

  {id:"bone",bg:"#E9E2D2",ink:"#191512"},

  {id:"drive",label:"Drive",list:VAR.drive},
  {id:"sym",label:"Symmetry",list:SYM,adv:true},
  {id:"nsec",label:"Torso",list:SECN,adv:true},
  {id:"tlo",label:"Abdomen",list:SECT,adv:true},
  {id:"joint",label:"Coupling",list:JOINT,adv:true},
  {id:"thi",label:"Chest",list:SECT,adv:true}]
  .concat(SLOT_IDS.filter(id=>id!=="drive").map(id=>({id,label:LABEL[id],list:VAR[VARKEY(id)]})));

  const x=a.adv?3:o[SEC[a.id]]??3, y=b.adv?3:o[SEC[b.id]]??3;

   are two spellings of the same thing. */

  fuse:0.5,detail:0.6,line:1.0,pal:0,block:true,env:false,spin:true,tone:true,
  lock:Object.assign({topo:null,sym:null,nsec:null,tlo:null,thi:null,joint:null},
    SLOT_IDS.reduce((a,id)=>(a[id]=null,a),{})),
  /* The hull's default quarter looked at its stern, which for a ship is where

})();</script>

<script type="module">/* YARD WALKER — first-person sandbox over the three yard generators.

const SEED_MAX = 4294967296;
function hash2(a, b) {

  h = (h ^ (b | 0)) >>> 0;

  const m = location.hash.match(/\d+/);
  if (m) return (+m[0] >>> 0) % SEED_MAX;
  return Math.floor(Math.random() * SEED_MAX);

location.hash = worldSeed;

/* ===================== tuning ===================== */
const U_MECH = 0.155;             /* mech build units → metres (the yard's own U2M) */
const G = 1.62;                   /* lunar gravity */
const CELL = 4000;                /* one base site per ~cell */
const FLAT_R = 340, FEATHER = 240;/* graded apron around each site */
const BUILD_R = 2600, DISPOSE_R = 6800, BEACON_R = 52000;
const EDGE_DEG = 30;
const COLOR = {
  bgGround: new THREE.Color(0x071019), bgSpace: new THREE.Color(0x02040a),
  fill: 0x0b151f, baseLine: 0x4f92a8, vehLine: 0x9fe2f4,
  ground: new THREE.Color(0x0a1622), grid: new THREE.Color(0x35606f),
  marker: 0x35e0c8, beacon: 0x2fa8c8,

const siteCache = new Map();

function terrainMaterial(grid) {

    uniforms: {
      uGround: { value: COLOR.ground }, uGridC: { value: COLOR.grid },
      uFogC: { value: scene.fog.color }, uFogN: { value: 500 }, uFogF: { value: 3600 },
      uGrid: { value: grid },

    vertexShader: `#include <common>
      #include <logdepthbuf_pars_vertex>

      void main(){ vec4 w=modelMatrix*vec4(position,1.0); vw=w.xyz;
        gl_Position=projectionMatrix*viewMatrix*w;
        #include <logdepthbuf_vertex>

    fragmentShader: `#include <common>
      #include <logdepthbuf_pars_fragment>
      varying vec3 vw;
      uniform vec3 uGround,uGridC,uFogC; uniform float uFogN,uFogF,uGrid;
      float gridf(vec2 p,float s){ vec2 q=p/s;
        vec2 g=abs(fract(q-0.5)-0.5)/fwidth(q); return 1.0-min(min(g.x,g.y),1.0); }

      if (inPoly(f.poly, x, z)) g = Math.max(g, f.top);

/* capsule vs world: mutates p.x/p.z for pushout, returns the supporting ground */
function collideCapsule(p, rad, step, height) {
  let ground = terrainH(p.x, p.z);
  const head = p.y + height;
  for (const rec of bases.values()) {
    if (Math.hypot(p.x - rec.site.x, p.z - rec.site.z) > rec.extent) continue;
    for (const f of rec.floors) {
      if (p.x < f.minx - rad || p.x > f.maxx + rad || p.z < f.minz - rad || p.z > f.maxz + rad) continue;
      if (f.top <= p.y + step && inPoly(f.poly, p.x, p.z)) ground = Math.max(ground, f.top);
    }
    const seen = new Set();
    for (const a of [Math.floor((p.x - rad) / 24), Math.floor((p.x + rad) / 24)])
      for (const c of [Math.floor((p.z - rad) / 24), Math.floor((p.z + rad) / 24)]) {
        const list = rec.hash.get(a + "," + c);
        if (!list) continue;
        for (const w of list) {
          if (seen.has(w)) continue;
          seen.add(w);
          const ex0 = w.minx - rad, ex1 = w.maxx + rad, ez0 = w.minz - rad, ez1 = w.maxz + rad;
          if (p.x < ex0 || p.x > ex1 || p.z < ez0 || p.z > ez1) continue;
          if (w.top <= p.y + step) {
            if (p.x > w.minx && p.x < w.maxx && p.z > w.minz && p.z < w.maxz)
              ground = Math.max(ground, w.top);
            continue;
          }
          if (w.bot >= head) continue;
          const dx0 = p.x - ex0, dx1 = ex1 - p.x, dz0 = p.z - ez0, dz1 = ez1 - p.z;
          const m = Math.min(dx0, dx1, dz0, dz1);
          if (m === dx0) p.x = ex0; else if (m === dx1) p.x = ex1;
          else if (m === dz0) p.z = ez0; else p.z = ez1;
        }
      }
  }
  /* parked vehicles are obstacles too */
  for (const v of liveVehicles()) {
    if (v === player.vehicle) continue;
    if (v.kind === "mech") {
      const dx = p.x - v.pos.x, dz = p.z - v.pos.z, d = Math.hypot(dx, dz), r = v.radius + rad;
      if (d < r && d > 1e-6) { p.x = v.pos.x + dx / d * r; p.z = v.pos.z + dz / d * r; }
    } else {
      const c = Math.cos(v.yaw), s = Math.sin(v.yaw);
      const wx = p.x - v.pos.x, wz = p.z - v.pos.z;
      let lx = c * wx - s * wz - v.cx, lz = s * wx + c * wz - v.cz;
      const hx = v.hx + rad, hz = v.hz + rad;
      if (Math.abs(lx) < hx && Math.abs(lz) < hz && v.pos.y - v.gc < p.y + height && v.pos.y - v.gc + v.topY + v.gc > p.y) {
        const px = hx - Math.abs(lx), pz2 = hz - Math.abs(lz);
        if (px < pz2) lx += Math.sign(lx || 1) * px; else lz += Math.sign(lz || 1) * pz2;
        p.x = v.pos.x + (c * (lx + v.cx) + s * (lz + v.cz));
        p.z = v.pos.z + (-s * (lx + v.cx) + c * (lz + v.cz));
      }
    }
  }
  return ground;
}

function updateBeacons(px, pz) {
  const cx = Math.round(px / CELL), cz = Math.round(pz / CELL), R = Math.ceil(BEACON_R / CELL);
  const list = [];
  for (let i = cx - R; i <= cx + R; i++) for (let j = cz - R; j <= cz + R; j++) {
    const s = siteAt(i, j);
    if (s && Math.hypot(px - s.x, pz - s.z) < BEACON_R) list.push(s);
  }
  const stamp = list.map(s => s.key).join("|");
  if (stamp !== beaconStamp) {
    beaconStamp = stamp;
    const pos = new Float32Array(list.length * 6), col = new Float32Array(list.length * 6);
    list.forEach((s, i) => {
      pos.set([s.x, 0, s.z, s.x, 1100, s.z], i * 6);
      const k = Math.pow(Math.max(0, 1 - Math.hypot(px - s.x, pz - s.z) / BEACON_R), 1.6);
      col.set([beaconCol.r * k, beaconCol.g * k, beaconCol.b * k,
               beaconCol.r * k, beaconCol.g * k, beaconCol.b * k], i * 6);
    });
    beaconLines.geometry.dispose();
    beaconLines.geometry = new THREE.BufferGeometry();
    beaconLines.geometry.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    beaconLines.geometry.setAttribute("color", new THREE.BufferAttribute(col, 3));
  }
  return list;
}

/* ---------- per-mode simulation ---------- */
function stepFoot(dt) {
  player.yaw -= mouseDX * 0.0022;
  player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch - mouseDY * 0.0022));
  const run = keys.has("ShiftLeft") || keys.has("ShiftRight");
  const sp = run ? 6 : 2.8;
  let wx = 0, wz = 0;
  if (keys.has("KeyW")) wz -= 1;
  if (keys.has("KeyS")) wz += 1;
  if (keys.has("KeyA")) wx -= 1;
  if (keys.has("KeyD")) wx += 1;
  const L = Math.hypot(wx, wz) || 1;
  const c = Math.cos(player.yaw), s = Math.sin(player.yaw);
  const tx = (wx * c + wz * s) / L * sp, tz = (wz * c - wx * s) / L * sp;
  const k = 1 - Math.exp(-(player.grounded ? 12 : 2.2) * dt);
  player.vel.x += (tx - player.vel.x) * k;
  player.vel.z += (tz - player.vel.z) * k;
  player.vel.y -= G * dt;
  if (player.grounded && keys.has("Space")) { player.vel.y = 2.9; player.grounded = false; }
  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  player.pos.y += player.vel.y * dt;
  const ground = collideCapsule(player.pos, 0.42, 0.65, 1.9);
  if (player.pos.y <= ground) {
    player.pos.y = ground;
    player.vel.y = Math.max(0, player.vel.y);
    player.grounded = true;
  } else player.grounded = player.pos.y - ground < 0.05;
  nearVeh = findNearVehicle();
}
function findNearVehicle() {
  let found = null, best = 1e9;
  for (const v of liveVehicles()) {
    const r = v.kind === "mech" ? v.radius + 4.5 : Math.max(v.hx, v.hz) + 5;
    const d = Math.hypot(player.pos.x - v.pos.x, player.pos.z - v.pos.z);
    if (d < r && d < best) { best = d; found = v; }
  }
  return found;
}
function stepMech(dt) {
  const v = player.vehicle;
  player.look.yaw = Math.max(-2.6, Math.min(2.6, player.look.yaw - mouseDX * 0.0022));
  player.look.pitch = Math.max(-1.1, Math.min(0.9, player.look.pitch - mouseDY * 0.0022));
  const fwd = (keys.has("KeyW") ? 1 : 0) - (keys.has("KeyS") ? 1 : 0);
  const trn = (keys.has("KeyA") ? 1 : 0) - (keys.has("KeyD") ? 1 : 0);
  v.speed = v.speed || 0;
  const max = fwd >= 0 ? (keys.has("ShiftLeft") ? 13 : 10) : 4;
  v.speed += ((fwd ? fwd * max : 0) - v.speed) * (1 - Math.exp(-2.4 * dt));
  v.yaw += trn * 1.05 * dt * (1 - Math.abs(v.speed) / 40);
  const c = Math.cos(v.yaw), s = Math.sin(v.yaw);
  _v1.set(v.pos.x + c * v.speed * dt, v.pos.y, v.pos.z - s * v.speed * dt);
  const g = collideCapsule(_v1, 3.2, 3.2, (v.topY - v.gc) || 12);
  v.pos.x = _v1.x; v.pos.z = _v1.z;
  const ty = g + v.gc;
  v.pos.y += (ty - v.pos.y) * (1 - Math.exp(-7 * dt));
  /* gait: a stride fake, honest about speed */
  player.phase += Math.abs(v.speed) * dt * 0.9;
  player.bob = Math.sin(player.phase * Math.PI) * 0.22 * Math.min(1, Math.abs(v.speed) / 4);

}
function stepShip(dt) {
  const v = player.vehicle;
  const alt = v.pos.y - v.gc - groundForShip(v.pos.x, v.pos.z);
  const inSpace = alt > 2000;
  if (v.landed) {
    v.throttle = 0;
    /* settle level, yaw only */
    _v1.set(1, 0, 0).applyQuaternion(v.quat);
    const yaw = Math.atan2(-_v1.z, _v1.x);
    _q1.setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
    v.quat.slerp(_q1, 1 - Math.exp(-6 * dt));
    v.yaw = yaw;
    if (keys.has("Space") || keys.has("KeyW")) { v.landed = false; v.vel.y = 3.5; }
    syncVehicle(v);
    return;
  }
  v.throttle = Math.max(0, Math.min(1, v.throttle
    + ((keys.has("KeyW") ? 1 : 0) - (keys.has("KeyS") ? 1 : 0)) * 0.55 * dt));
  if (keys.has("KeyX")) { v.throttle = 0; v.vel.multiplyScalar(Math.exp(-1.6 * dt)); }
  v.pv = v.pv || 0; v.yv = v.yv || 0; v.rv = v.rv || 0;
  v.pv += -mouseDY * 0.0011; v.yv += -mouseDX * 0.0011;
  v.rv += ((keys.has("KeyD") ? 1 : 0) - (keys.has("KeyA") ? 1 : 0)) * 2.4 * dt;
  const ad = Math.exp(-3.2 * dt);
  v.pv *= ad; v.yv *= ad; v.rv *= ad;
  _q1.setFromAxisAngle(new THREE.Vector3(0, 0, 1), v.pv * dt * 60 * 0.02); v.quat.multiply(_q1);
  _q1.setFromAxisAngle(new THREE.Vector3(0, 1, 0), v.yv * dt * 60 * 0.02); v.quat.multiply(_q1);
  _q1.setFromAxisAngle(new THREE.Vector3(1, 0, 0), v.rv * dt * 60 * 0.02); v.quat.multiply(_q1);
  v.quat.normalize();
  const ACC = inSpace ? 60 : 30;
  _v1.set(1, 0, 0).applyQuaternion(v.quat);
  v.vel.addScaledVector(_v1, v.throttle * ACC * dt);
  _v1.set(0, 1, 0).applyQuaternion(v.quat);
  if (keys.has("Space")) v.vel.addScaledVector(_v1, 15 * dt);
  if (keys.has("ShiftLeft")) v.vel.addScaledVector(_v1, -11 * dt);
  const g = G * Math.max(0, Math.min(1, 1 - (alt - 2000) / 3000));
  v.vel.y -= g * dt;
  v.vel.multiplyScalar(Math.exp(-0.22 * dt));
  v.pos.addScaledVector(v.vel, dt);

    v.pos.y = gy + v.gc;

      /* arrival: which base is this? */
      for (const rec of bases.values()) {
        if (!rec.pad) continue;
        if (Math.hypot(v.pos.x - rec.pad.x, v.pos.z - rec.pad.z) < 180 && !visited.has(rec.site.key)) {
          visited.add(rec.site.key);
          showPlate(rec.meta.desig, rec.meta.klass + " · PAD SECURED", 6);
        }

      v.vel.y = Math.abs(vs) * 0.35;
      v.vel.x *= 0.55; v.vel.z *= 0.55;
    }
  }
  syncVehicle(v);
}

let last = performance.now(), fps = 60, worst = 0, beaconT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  const ms = now - last;
  last = now;
  fps = fps * 0.95 + (1000 / Math.max(ms, 1e-3)) * 0.05;
  worst = Math.max(worst * 0.98, ms);
  tick(dt, now);
  renderer.render(scene, camera);
}
function tick(dt, now) {
  if (mode === "foot") stepFoot(dt);
  else if (mode === "mech") stepMech(dt);
  else if (mode === "ship") stepShip(dt);
  else if (mode === "lerp") {
    lerpT += dt / lerpDur;
    if (lerpT >= 1) { mode = lerpNext; lerpT = 0; }
  }
  mouseDX = 0; mouseDY = 0;

  /* camera */
  if (mode === "foot") footPose(poseB);
  else if (mode === "mech") mechPose(poseB);
  else if (mode === "ship") shipPose(poseB);
  else if (mode === "lerp") {
    const target = { pos: poseB.pos, quat: poseB.quat };
    if (lerpNext === "foot") footPose(target);
    else if (lerpNext === "mech") mechPose(target);
    else shipPose(target);
    const t = lerpT * lerpT * (3 - 2 * lerpT);
    poseB.pos.lerpVectors(lerpFrom.pos, target.pos, t);
    poseB.quat.slerpQuaternions(lerpFrom.quat, target.quat, t);
  }
  if (mode !== "title") {
    camera.position.copy(poseB.pos);
    camera.quaternion.copy(poseB.quat);
  } else {
    /* slow establishing orbit behind the title card */
    const a = now * 0.00004;
    camera.position.set(Math.cos(a) * 420, 150, Math.sin(a) * 420);
    camera.lookAt(0, 10, 0);
  }

  /* pulse markers */
  const pulse = 0.72 + Math.sin(now * 0.004) * 0.25;
  markerMat.opacity = pulse;
  for (const v of liveVehicles())
    v.marker.visible = mode === "foot" && v !== player.vehicle
      && v.marker.position.distanceTo(camera.position) < 260;

  updateStreaming(camera.position.x, camera.position.z);
  pumpBuild();
  updateChunks(camera.position.x, camera.position.z, false);
  pumpChunks(5);
  beaconT -= dt;
  if (beaconT <= 0) { beaconT = 1.2; beaconList = updateBeacons(camera.position.x, camera.position.z); }
  updateAtmos();
  updateHUD(dt);

  if (dbgOn) {
    const info = renderer.info.render;
    dbg.textContent =
      `fps ${fps.toFixed(0)}  worst ${worst.toFixed(1)}ms\n` +
      `calls ${info.calls}  tris ${(info.triangles / 1000).toFixed(0)}k\n` +
      `pos ${camera.position.x.toFixed(0)},${camera.position.y.toFixed(0)},${camera.position.z.toFixed(0)}\n` +
      `mode ${mode}  bases ${bases.size}  buildQ ${buildQueue.length}\n` +
      `chunks ${TIERS.map(t => t.live.size).join("/")}  chunkQ ${chunkQueue.length}\n` +
      `seed ${worldSeed}  visited ${visited.size}`;
  }
}
requestAnimationFrame(frame);

/* debug handle (also used by the automated flythrough tests) */
window.YW = { player, bases, camera, keys, get mode() { return mode; }, set mode(m) { mode = m; },
  onUse, terrainH, groundForShip, liveVehicles, showPlate, renderer,
  step: (dt = 0.05, n = 1) => { for (let i = 0; i < n; i++) tick(dt, performance.now()); renderer.render(scene, camera); },
  stats: () => ({ fps, worst, bases: bases.size, queue: buildQueue.length }) };
</script>
</body>
