    T("ORBITAL YARD",bxx+bw-pad,byy+bh*0.26,bh*0.115,bh*0.018,600,rw1,"end");
    T("HULL "+M.seed,bxx+bw-pad,byy+bh*0.44,bh*0.115,bh*0.018,500,rw1,"end");
    T("SHEET 1 OF 1",bxx+bw-pad,byy+bh*0.61,bh*0.095,bh*0.014,500,rw1,"end");

    const cols=[["LENGTH",M.length.toFixed(1)+" M"],["BEAM",M.beam.toFixed(1)+" M"],
                ["HEIGHT",M.height.toFixed(1)+" M"],["DRY",Math.round(M.mass)+" T"],
                ["CREW",M.crew?String(M.crew):"NIL"]];
    cols.forEach((c,i)=>{
      const cx=bxx+pad+(bw-pad*2)*i/5;
      if(i)t.path([[cx-pad*0.6,rMet],[cx-pad*0.6,byy+bh]],ink,lw*0.6);
      t.text(c[0],cx,byy+bh*0.84,{size:bh*0.098,color:ink,weight:500,tracking:bh*0.016});
      t.text(c[1],cx,byy+bh*0.96,{size:bh*0.135,color:ink,weight:600,tracking:bh*0.010});
    });
  }
  const tk=U*0.020;
  t.path([[m,m+tk],[m,m],[m+tk,m]],ink,lw);
  t.path([[W-m-tk,m],[W-m,m],[W-m,m+tk]],ink,lw);
  t.path([[m,H-m-tk],[m,H-m],[m+tk,H-m]],ink,lw);
  return {cells,sc,origin};
}

/* ===================== app ===================== */
const PALETTES=[
  {id:"blueprint",bg:"#0E2E52",ink:"#D9E6F2"},
  {id:"vermilion",bg:"#F0450E",ink:"#150F0B"},
  {id:"bone",bg:"#E9E2D2",ink:"#191512"},
  {id:"sulphur",bg:"#E5C132",ink:"#161310"},
  {id:"slate",bg:"#1A1A1C",ink:"#C6CACE"}
];
const SLOT_IDS=["cockpit","wing","tail","booster","gear"];
const SECN=[{n:"2 SECTIONS"},{n:"3 SECTIONS"},{n:"4 SECTIONS"}];
/* adv rows are the ones that describe how a hull is put together — real
   controls, but not what anyone touches first, so they sit behind the fold */
const ROWS=[{id:"topo",label:"Hull",list:TOPO},
  {id:"hulls",label:"Hulls",list:HULLN},
  {id:"sym",label:"Symmetry",list:SYM,adv:true},
  {id:"nsec",label:"Chain",list:SECN,adv:true},
  {id:"fore",label:"Fore",list:SECT,adv:true},
  {id:"joint",label:"Joint",list:JOINT,adv:true},
  {id:"aft",label:"Aft",list:SECT,adv:true}]
  .concat(SLOT_IDS.map(id=>({id,label:id,list:VAR[id]})));

   space — 4.29 billion hulls, not the five-digit slice the roll used to take.

   serial, and a serial is allowed to be long. */
const SEED_MAX=4294967296;
const newSeed=()=>Math.floor(Math.random()*SEED_MAX);
const normSeed=v=>{v=Math.floor(Math.abs(v));return isFinite(v)?v%SEED_MAX:1;};
const S={seed:newSeed(),
  fuse:0.5,detail:0.6,line:1.0,pal:0,block:true,env:false,spin:true,tone:true,
  lock:{topo:null,hulls:null,sym:null,nsec:null,fore:null,joint:null,aft:null,cockpit:null,wing:null,tail:null,booster:null,gear:null},
  yaw:-0.62,pitch:0.34};
/* A phone's plate is tall and narrow; a ship is long and flat. Held at the
   desktop's shallow pitch it draws a thin band across the middle with half the
   plate empty either side of it. Looking further down the hull turns length
   into height and fills the frame. */
if(matchMedia("(max-width:820px)").matches)S.pitch=0.62;
const DEF={yaw:S.yaw,pitch:S.pitch};

/* one breakpoint, shared by the stylesheet and the renderer, so the sheet the
   canvas draws always matches the layout the page is in */
const MOBILE=matchMedia("(max-width:820px)");
const solo=()=>MOBILE.matches;
return {build:buildShip, mesh:shipMesh, partExtents:partExtents, inSolid:inSolid};
})();</script>
<script>window.BASEYARD=(function(){
"use strict";
/* ===================== vector ===================== */
const V={
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];},
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]
};
function basis(n){const t=Math.abs(n[0])<0.85?[1,0,0]:[0,1,0];const u=V.norm(V.cross(n,t));return [u,V.cross(n,u)];}
function ringPts(c,r,n,segs){
  const [u,v]=basis(n),o=[];
  for(let i=0;i<segs;i++){const a=i/segs*Math.PI*2;
    o.push(V.add(c,V.add(V.mul(u,r*Math.cos(a)),V.mul(v,r*Math.sin(a)))));}
  return o;
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296;};}

/* ===================== socket contract =====================
   Site space: +X east, +Y up, +Z north. The ground is the plane y = 0 and
   everything stands on it. There is no mirror pass and no symmetry axis,
   because a settlement, unlike a machine, has no centreline — what order it
   has comes from the road network, not from reflection.
   A district works in its socket's local frame (f = up out of the ground,
   u = the way it faces — toward the road that serves it, s = side) and
   obeys three rules:
     1. start at x = -inset          (foundations bury; never butt-joint)
     2. keep its feet on the plane   (nothing floats; y = 0 is truth)
     3. stay inside the envelope box (proportions survive any combination)
   Buried faces are flagged hidden so no line is stroked inside the ground. */

function builder(fr,out){
  const L=(x,y,z)=>V.add(fr.o,V.add(V.mul(fr.f,x),V.add(V.mul(fr.u,y),V.mul(fr.s,z))));
  const D=(x,y,z)=>V.add(V.mul(fr.f,x),V.add(V.mul(fr.u,y),V.mul(fr.s,z)));
  const push=p=>{out.push(p);return p;};
  return {
    L,D,
    tube:(a,b,r1,r2,o)=>push(Object.assign({k:"tube",a:L(a[0],a[1],a[2]),b:L(b[0],b[1],b[2]),r1,r2},o||{})),
    cap:(a,b,r,o)=>push(Object.assign({k:"capsule",a:L(a[0],a[1],a[2]),b:L(b[0],b[1],b[2]),r},o||{})),
    ball:(c,r,o)=>push(Object.assign({k:"sphere",c:L(c[0],c[1],c[2]),r},o||{})),
    disc:(c,n,r,ri,o)=>push(Object.assign({k:"disc",c:L(c[0],c[1],c[2]),n:V.norm(D(n[0],n[1],n[2])),r,ri},o||{})),
    box:(c,hx,hy,hz,o)=>push(Object.assign({k:"box",c:L(c[0],c[1],c[2]),
        u:D(hx,0,0),v:D(0,hy,0),w:D(0,0,hz)},o||{})),
    lathe:(c,axis,prof,det,o)=>push(Object.assign({k:"lathe",c:L(c[0],c[1],c[2]),
        axis:V.norm(D(axis[0],axis[1],axis[2])),prof,det},o||{})),
    /* pts are [up, side] standing square to the facing axis — a wall, a fin,
       a radiator. Local x is up, so every panel authored this way is vertical,
       which on the Moon is what a solar array is too: at the poles the sun
       lives on the horizon, and a flat-lying panel is a mistake. */
    panel:(y,pts,th,o)=>push(Object.assign({k:"panel",pts:pts.map(p=>L(p[0],y,p[1])),
        n:V.norm(D(0,1,0)),th,skipSide:-1},o||{})),
    /* a slab lying in the ground plane — aprons, footings, floor plates */
    slab:(pts,y,th,o)=>push(Object.assign({k:"panel",pts:pts.map(p=>L(y,p[0],p[1])),
        n:V.norm(D(1,0,0)),th,skipSide:-1},o||{}))
  };
}

const CAP=(a,b,r,o)=>Object.assign({k:"capsule",a,b,r},o||{});
const TUB=(a,b,r1,r2,o)=>Object.assign({k:"tube",a,b,r1,r2},o||{});
const BOX=(c,u,v,w,o)=>Object.assign({k:"box",c,u,v,w},o||{});
const SPH=(c,r,o)=>Object.assign({k:"sphere",c,r},o||{});
const DSC=(c,n,r,ri,o)=>Object.assign({k:"disc",c,n,r,ri},o||{});
const LTH=(c,axis,prof,det,o)=>Object.assign({k:"lathe",c,axis,prof,det},o||{});
const PNL=(pts,pts2,n,th,det,o)=>Object.assign({k:"panel",pts,pts2,n,th,skipSide:-1,det},o||{});
const FR=(o,f,u,s,E,solo,sr)=>({fr:{o,f,u,s},E,solo:!!solo,sr});
const hullDet=(rings,longs,ports)=>({rings,longs,ports});

   const rows=2+Math.floor(R()*2), cols=3+Math.floor(R()*2);
   for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){
     const y=(i-(rows-1)/2)*E.y*0.55, z=(j-(cols-1)/2)*E.z*rr(0.32,0.4);
     const h=sr*rr(2.0,2.6), w=sr*rr(1.1,1.5);
     B.tube([-0.8,y,z],[h*0.42,y,z],sr*0.13,sr*0.11,{hideA:true});
     B.panel(y,[[h*0.42,z-w],[h,z-w],[h,z+w],[h*0.42,z+w]],0.18,{det:{ribs:3}});
   }
   B.box([sr*0.4,E.y*0.62,0],sr*0.4,sr*0.5,sr*0.75,{det:{ribs:3}});
   /* the battery row that carries the base through eclipse */
   for(let j=0;j<3;j++)
     B.box([sr*0.35,E.y*0.62,sr*(j-1)*1.6+sr*3.2],sr*0.35,sr*0.4,sr*0.6,{det:{ribs:2}});
 }},
 {n:"PIT + MASTS",kw:400,make(B,sr,rr,R,E){
   /* belt and braces: a two-unit pit for the night and masts for the day */
   const brad=sr*2.8;
   for(const z of [-sr*0.95,sr*0.95]){
     B.tube([-0.8,0,z],[sr*1.1,0,z],sr*0.44,sr*0.40,{hideA:true,det:hullDet([0.45],[],[])});
     B.disc([sr*1.13,0,z],[1,0,0],sr*0.48,sr*0.19);
   }
   const seg=8;
   for(let i=0;i<seg;i++){
     const t0=-2.1+4.2*i/seg, t1=-2.1+4.2*(i+1)/seg;
     B.cap([0.4,Math.cos(t0)*brad,Math.sin(t0)*brad],
           [0.4,Math.cos(t1)*brad,Math.sin(t1)*brad],sr*0.66,{hideA:true,hideB:true});
   }
   for(const zz of [-1,1]){
     const h=E.x*rr(0.6,0.85), z=zz*E.z*0.42, w=sr*rr(1.5,2.0);
     B.tube([-1.0,-brad*0.2,z],[h,-brad*0.2,z],sr*0.16,sr*0.12,{hideA:true});
     B.panel(-brad*0.2,[[h*0.46,z-w],[h,z-w],[h,z+w],[h*0.46,z+w]],0.2,{det:{ribs:4}});
   }
   B.box([sr*0.42,brad+sr*1.1,0],sr*0.42,sr*0.55,sr*0.8,{det:{ribs:3}});
 }}
],
/* ---- pad: local x = up, y = facing (toward the base), z = side ---- */
pad:[
 {n:"SINTERED APRON",pads:1,make(B,sr,rr,R,E){
   padApron(B,sr,rr,R,0,0,E.y*rr(0.55,0.7),true);
 }},
 {n:"APRON + GANTRY",pads:1,make(B,sr,rr,R,E){
   const Rp=E.y*rr(0.52,0.66);
   padApron(B,sr,rr,R,0,0,Rp,true);
   /* the service gantry stands at the apron edge on the base side */
   const gx=E.x*rr(0.75,0.95), gy=Rp*1.02;
   for(const dz of [-sr*0.8,sr*0.8]){
     B.tube([-1.0,gy,dz],[gx,gy,dz],sr*0.2,sr*0.15,{hideA:true});
     for(let i2=1;i2<4;i2++)
       B.tube([gx*i2/4,gy,-sr*0.8],[gx*i2/4,gy,sr*0.8],sr*0.08,sr*0.08,
              {hideA:true,hideB:true,bare:true});
   }
   B.box([gx,gy,0],sr*0.2,sr*0.4,sr*1.1);
   B.box([gx*0.55,gy-sr*0.9,0],sr*0.35,sr*0.6,sr*0.5,{det:{ribs:2}});
   /* crane jib reaching over the pad */
   B.tube([gx*0.96,gy,0],[gx*0.96,gy-Rp*0.55,0],sr*0.12,sr*0.09,{hideA:true});
   B.tube([gx*0.96,gy-Rp*0.55,0],[gx*0.7,gy-Rp*0.55,0],0.06,0.06,{hideA:true,hideB:true,bare:true});
   if(R()<0.6)lander(B,sr,rr,R,0,0,E.x);
 }},
 {n:"TWIN APRONS",pads:2,make(B,sr,rr,R,E){
   const Rp=E.y*rr(0.40,0.48), off=Rp*rr(1.35,1.55);
   padApron(B,sr,rr,R,0,-off,Rp,false);
   padApron(B,sr,rr,R,0, off,Rp,false);
   /* one shared berm between them: each pad shields the other's neighbour */
   const seg=5;
   for(let i=0;i<seg;i++){
     const z0=-Rp*0.9+Rp*1.8*i/seg, z1=-Rp*0.9+Rp*1.8*(i+1)/seg;
     B.cap([0.4,z0*0.0,z0],[0.4,z1*0.0,z1],sr*0.7,{hideA:true,hideB:true});
   }
   B.box([sr*0.4,Rp*0.9,0],sr*0.4,sr*0.5,sr*0.7,{det:{ribs:2}});
   if(R()<0.5)lander(B,sr,rr,R,0,off,E.x);
 }},
 {n:"PORT ROW",pads:3,make(B,sr,rr,R,E){
   const Rp=E.y*rr(0.30,0.36), off=Rp*rr(2.3,2.6);
   for(const k of [-1,0,1])padApron(B,sr,rr,R,0,k*off,Rp,false);
   /* the tower with the flight deck looking down the row */
   const h=E.x*rr(0.7,0.95);
   B.tube([-1.0,Rp*1.9,0],[h*0.8,Rp*1.9,0],sr*0.34,sr*0.28,{hideA:true,
     det:hullDet([0.4,0.75],[],[])});
   B.box([h*0.88,Rp*1.9,0],sr*0.34,sr*0.6,sr*0.85,{det:{ribs:3}});
   B.disc([h*1.02,Rp*1.9,0],[1,0,0],sr*0.3,sr*0.12);
   if(R()<0.7)lander(B,sr,rr,R,0,-off,E.x);
   if(R()<0.35)lander(B,sr,rr,R,0,off,E.x*0.7);
 }},
 {n:"MASS DRIVER",pads:1,drv:1,make(B,sr,rr,R,E){
   /* the O'Neill machine: an open coil barrel on trestles, throwing
      canisters of regolith at escape velocity down a surveyed azimuth — the
      Moon supplies the vacuum, so there is no tube, only the coils. At
      eighteen hundred gravities the whole accelerator is shorter than the
      base is wide. Habitats live abeam the breech and never on the azimuth;
      the muzzle end is uninhabited machinery; the buckets come home along a
      return loop, so the machine reads as a hairpin. */
   const y0=E.y*0.92, y1=-E.y*0.82, L=y0-y1;
   const h=t=>1.3+t*2.1;                  /* the embankment climbs downrange */
   const at=t=>[h(t),y0-L*t,0];
   for(const dz of [-0.55,0.55])
     B.tube([h(0),y0,dz],[h(1),y1,dz],0.22,0.22,{hideA:true,hideB:true});
   /* drive coils: dense through the acceleration section, sparse and finer
      through the trim section where the exit velocity is surveyed true */
   const dir=[(h(1)-h(0))/L,-1,0];
   for(let t=0.02;t<0.62;t+=0.045)B.disc(at(t),dir,1.25,0.78);
   for(let t=0.66;t<0.99;t+=0.082)B.disc(at(t),dir,1.05,0.72);
   for(let t=0.06;t<1;t+=0.115){
     const q=at(t);
     for(const dz of [-1,1])
       B.tube([q[0]-0.3,q[1],dz*1.3],[0,q[1],dz*1.9],0.14,0.17,{hideB:true});
     B.box([q[0]-0.45,q[1],0],0.12,0.4,1.4);
   }
   /* sector capacitor banks hug the barrel, alternating sides; the pulses
      live here, the grid feed is two orders of magnitude smaller */
   let cside=1;
   for(let t=0.08;t<0.6;t+=0.1){
     const q=at(t);
     B.box([0.8,q[1],cside*2.7],0.8,1.0,0.7,{det:{ribs:3}});
     cside=-cside;
   }
   /* the trim section is shaded — thermal drift is aim error */
   B.box([h(0.85)+1.5,y0-L*0.85,0],0.1,L*0.14,2.0,{det:{ribs:4}});
   /* the breech complex: loading gallery, bucket carousel, cryo plant with
      its radiators, the covered conveyor in from the pelletizer mound */
   B.box([1.6,y0+sr*1.3,0],1.6,sr*1.25,sr*0.9,{det:{ribs:3}});
   B.tube([-0.6,y0+sr*1.3,sr*1.9],[2.6,y0+sr*1.3,sr*1.9],sr*0.55,sr*0.5,
          {hideA:true,det:hullDet([0.5],[],[])});
   B.disc([2.75,y0+sr*1.3,sr*1.9],[1,0,0],sr*0.55,sr*0.2);
   B.box([0.9,y0+sr*1.3,-sr*1.8],0.9,sr*0.65,sr*0.5,{det:{ribs:2}});
   for(let i=0;i<3;i++)
     B.panel(y0+sr*2.6,[[0.3,-sr*(1.4+i*0.7)],[sr*1.6,-sr*(1.4+i*0.7)],
                        [sr*1.6,-sr*(1.1+i*0.7)],[0.3,-sr*(1.1+i*0.7)]],0.18,{});
   B.cap([1.0,y0+sr*3.8,-sr*2.4],[1.0,y0+sr*3.8,-sr*0.8],1.5,{hideA:true,hideB:true});
   B.tube([0.6,y0+sr*3.6,-sr*1.9],[3.3,y0+sr*1.7,-sr*0.4],0.3,0.3,
          {hideA:true,hideB:true});
   B.tube([3.6,y0+sr*1.4,0],[2.5,y0+sr*1.3,0],0.72,0.34);
   /* the return loop, and the brake radiators where the buckets dump
      their speed back into the sky */
   B.tube([0.9,y1+1.2,2.9],[0.9,y0-1.0,2.9],0.16,0.16,{hideA:true,hideB:true,bare:true});
   for(const [ye,he] of [[y1,h(1)],[y0-0.6,h(0)]]){
     B.tube([he,ye,0.55],[Math.max(he*0.7,1.2),ye+(ye<0?0.9:-0.4),1.8],0.14,0.14,
            {hideA:true,hideB:true,bare:true});
     B.tube([Math.max(he*0.7,1.2),ye+(ye<0?0.9:-0.4),1.8],[0.9,ye+(ye<0?1.2:-0.6),2.9],
            0.14,0.14,{hideA:true,hideB:true,bare:true});
   }
   for(const dy of [3,9])
     B.panel(y1+dy,[[0.4,3.8],[sr*1.5,3.8],[sr*1.5,5.3],[0.4,5.3]],0.18,{});
   /* the control bunker, bermed, abeam the loading end */
   B.cap([1.1,y0-L*0.15,-E.z*0.5-2.1],[1.1,y0-L*0.15,-E.z*0.5+2.1],1.85,
         {hideA:true,hideB:true});
   B.box([0.8,y0-L*0.15+2.6,-E.z*0.5],0.8,0.5,1.0,{det:{ribs:2}});
   B.disc([2.6,y0-L*0.15,-E.z*0.5],[0.4,1,0.2],0.8,0);
   /* downrange: the tracking post and the keep-out beacons on the azimuth */
   for(const dy of [5,10]){
     B.tube([-0.4,y1-dy,0],[2.6,y1-dy,0],0.09,0.07,{hideA:true});
     B.ball([2.75,y1-dy,0],0.18);
   }
   /* the base still receives landers: one small apron, bermed, off the line */
   padApron(B,sr,rr,R,y0-L*0.5,E.z*0.55,E.z*0.26,true);
   if(R()<0.4)lander(B,sr,rr,R,y0-L*0.5,E.z*0.55,E.x*0.55);
 }}
],
/* ---- isru: local x = up, y = facing, z = side ---- */
isru:[
 {n:"ICE RIGS",ind:1,make(B,sr,rr,R,E){
   /* drill rigs walk the cold trap; each is a tripod over a bore */
   const n=3+Math.floor(R()*3);
   for(let i=0;i<n;i++){
     const y=rr(-0.8,0.5)*E.y*0.8, z=(i-(n-1)/2)*E.z*rr(0.4,0.55);
     const h=sr*rr(1.9,2.6);
     for(let l=0;l<3;l++){
       const a=l/3*Math.PI*2+0.4;
       B.tube([h,y,z],[0,y+Math.cos(a)*h*0.55,z+Math.sin(a)*h*0.55],sr*0.09,sr*0.07,
              {hideB:true});
     }
     B.box([h,y,z],sr*0.28,sr*0.28,sr*0.28,{det:{ribs:2}});
     B.tube([h*0.96,y,z],[-1.2,y,z],sr*0.07,sr*0.07,{hideB:true,bare:true});
     B.ball([sr*0.5,y+h*0.7,z],sr*rr(0.45,0.6),{det:{rings:[0.4,0.6]}});
   }
   /* the field tank the rigs pump to */
   B.cap([sr*0.9,E.y*0.65,-sr*1.2],[sr*0.9,E.y*0.65,sr*1.2],sr*0.85,
         {det:hullDet([0.3,0.7],[],[])});
   for(const t of [-0.6,0.6])B.box([sr*0.3,E.y*0.65,sr*1.2*t],sr*0.32,sr*0.45,sr*0.6);
 }},
 {n:"STRIP MINE",ind:2,make(B,sr,rr,R,E){
   /* spoil heaps in a rank, the excavator between them, the conveyor out */
   const n=3+Math.floor(R()*3);
   for(let i=0;i<n;i++){
     const y=-E.y*rr(0.25,0.7), z=(i-(n-1)/2)*E.z*rr(0.32,0.42);
     B.cap([sr*rr(0.5,0.8),y,z-sr*rr(0.8,1.3)],[sr*rr(0.5,0.8),y,z+sr*rr(0.8,1.3)],
           sr*rr(0.9,1.3),{hideA:true,hideB:true});
   }
   /* the excavator: tracks, house, boom */
   const ey=-E.y*0.15, ez=rr(-0.4,0.4)*E.z*0.3;
   for(const dz of [-sr*0.65,sr*0.65])
     B.box([sr*0.28,ey,ez+dz],sr*0.28,sr*1.0,sr*0.3,{det:{ribs:4}});
   B.box([sr*0.85,ey,ez],sr*0.42,sr*0.8,sr*0.6,{det:{ribs:2}});
   B.tube([sr*1.1,ey-sr*0.6,ez],[sr*2.2,ey-sr*2.6,ez],sr*0.13,sr*0.10);
   B.box([sr*2.1,ey-sr*2.8,ez],sr*0.3,sr*0.4,sr*0.34);
   /* conveyor on trestles to the hopper on the road side */
   const hy=E.y*0.62;
   B.box([sr*1.6,hy,0],sr*0.55,sr*0.55,sr*0.55,{det:{ribs:3}});
   B.tube([sr*1.9,hy-sr*0.5,0],[sr*0.9,ey+sr*1.2,ez*0.5],sr*0.14,sr*0.14,
          {hideA:true,hideB:true});
   for(const t of [0.3,0.6])
     B.tube([-0.5,hy+(ey+sr*1.2-hy)*t,ez*0.5*t],[sr*1.55,hy+(ey+sr*1.2-hy)*t,ez*0.5*t],
            sr*0.07,sr*0.06,{hideA:true});
 }},
 {n:"OX REFINERY",ind:2,make(B,sr,rr,R,E){
   /* molten regolith electrolysis: the hot hall, the columns, the slag row */
   B.box([sr*1.05,0,0],sr*1.05,sr*1.6,sr*2.1,{det:{ribs:4}});
   const nc=2+Math.floor(R()*3);
   for(let i=0;i<nc;i++){
     const z=(i-(nc-1)/2)*sr*1.15;
     B.tube([-0.8,-sr*2.5,z],[sr*rr(2.4,3.1),-sr*2.5,z],sr*0.4,sr*0.34,{hideA:true,
       det:hullDet([0.3,0.6,0.85],[],[])});
     B.ball([sr*rr(2.5,3.2),-sr*2.5,z],sr*0.42,{det:{rings:[0.5]}});
   }
   /* pipe bridge from columns to hall */
   B.tube([sr*1.8,-sr*1.6,0],[sr*1.8,-sr*0.4,0],sr*0.12,sr*0.12,{hideA:true,hideB:true});
   /* slag pots on the off side */
   for(let i=0;i<3;i++)
     B.tube([-0.5,sr*2.6,(i-1)*sr*1.1],[sr*0.7,sr*2.6,(i-1)*sr*1.1],sr*0.38,sr*0.3,
            {hideA:true,det:hullDet([0.6],[],[])});
   B.box([sr*0.4,E.y*0.7,0],sr*0.4,sr*0.5,sr*0.7,{det:{ribs:2}});
 }},
 {n:"PRINT WORKS",ind:1,make(B,sr,rr,R,E){
   /* the regolith printer: a portal gantry parked over its current job,
      hoppers of feedstock behind it */
   const w=E.z*rr(0.32,0.42), h=sr*rr(2.6,3.4);
   for(const dz of [-w,w]){
     for(const dy of [-sr*1.4,sr*1.4])
       B.tube([-0.8,dy,dz],[h,dy,dz],sr*0.14,sr*0.11,{hideA:true});
     B.box([h*0.35,0,dz],sr*0.12,sr*1.55,sr*0.2,{det:{ribs:2}});
   }
   B.box([h,0,0],sr*0.18,sr*0.5,w*1.12,{det:{ribs:3}});
   B.tube([h*0.94,0,rr(-0.5,0.5)*w*0.8],[h*0.4,0,rr(-0.5,0.5)*w*0.8],sr*0.1,sr*0.08,
          {hideA:true});
   /* the job: a dome shell part-way up its courses */
   const jr=w*rr(0.5,0.7), jh=jr*rr(0.35,0.6);
   B.lathe([-0.6,0,0],[1,0,0],
     [[0,jr],[jh*0.6,jr*0.93],[jh,jr*0.84]],{rings:[1,2],mer:0});
   /* feedstock hoppers */
   for(let i=0;i<2;i++){
     B.tube([sr*2.2,-E.y*0.55,(i-0.5)*sr*1.7],[sr*1.0,-E.y*0.55,(i-0.5)*sr*1.7],
            sr*0.55,sr*0.28,{det:hullDet([0.4],[],[])});
     B.tube([sr*2.2,-E.y*0.55,(i-0.5)*sr*1.7],[sr*2.5,-E.y*0.55,(i-0.5)*sr*1.7],
            sr*0.55,sr*0.55,{hideB:true});
   }
 }}

/* ---- depot: tank farm ---- */
depot:[
 {n:"SPHERE FARM",make(B,sr,rr,R,E){
   const n=2+Math.floor(R()*2), m=2+Math.floor(R()*2);
   for(let i=0;i<n;i++)for(let j=0;j<m;j++){
     const y=(i-(n-1)/2)*E.y*0.55, z=(j-(m-1)/2)*E.z*0.55;
     const tr=sr*rr(1.0,1.35);
     B.ball([tr*0.9,y,z],tr,{det:{rings:[0.35,0.5,0.65]}});
     B.tube([0.4,y,z],[tr*0.25,y,z],tr*0.55,tr*0.5,{hideA:true,hideB:true});
     /* manifold off the crown */
     B.tube([tr*1.9,y,z],[tr*2.15,y,z],sr*0.09,sr*0.08);
   }
   /* the header pipe linking the crowns */
   B.tube([sr*2.4,-E.y*0.55*(n-1)/2,0],[sr*2.4,E.y*0.55*(n-1)/2,0],sr*0.08,sr*0.08,
          {hideA:true,hideB:true,bare:true});
   B.box([sr*0.4,E.y*0.75,0],sr*0.4,sr*0.45,sr*0.6,{det:{ribs:2}});
 }},
 {n:"SLEEPER TANKS",make(B,sr,rr,R,E){

 {n:"CRYO DEPOT",make(B,sr,rr,R,E){

 {n:"DRUM YARD",make(B,sr,rr,R,E){

/* ---- garage: the motor pool, and the mech bay ---- */
garage:[
 {n:"ROVER BARN",make(B,sr,rr,R,E){

     B.tube([-0.8,dy,dz],[h,dy,dz],sr*0.18,sr*0.15,{hideA:true});

 {n:"TERRAFORM PILOT",pop:6,ter:1,make(B,sr,rr,R,E){
   /* paraterraforming, one cell at a time: nobody gives the Moon an
      atmosphere, they rope a crater, stretch a film dome over it on a cable
      net, and grow the sky indoors. The magnetosphere is a hundred-metre
      superconducting ring around the fence line, because the occupants of a

   const cr=E.y*rr(0.56,0.66);
   B.disc([cr*0.05,0,0],[1,0,0],cr,cr*0.84);          /* the roped crater rim */
   const dh=Math.min(E.x*0.9,cr*rr(0.48,0.58));
   B.lathe([0.3,0,0],[1,0,0],                          /* the film dome, netted */

     {rings:[1,2,3],mer:12});
   for(let i=0;i<8;i++){                               /* anchor blocks on the ring */
     const a=i/8*Math.PI*2+0.39;
     B.box([0.5,Math.cos(a)*cr*1.14,Math.sin(a)*cr*1.14],0.5,0.6,0.6);
   }
   /* the airlock ridge, facing the road */
   B.cap([sr*0.4,cr*1.02,0],[sr*0.4,cr+sr*2.2,0],sr*0.36,{hideA:true,hideB:true});
   B.box([sr*0.55,cr+sr*2.7,0],sr*0.55,sr*0.8,sr*0.65,{det:{ribs:2}});
   /* the blower house that keeps the sky up, and the air it is making:
      an oxygen cell, a volatile kiln for the nitrogen, the gas holder */
   const py=-cr*0.5, pz=cr*1.35;
   B.box([sr*0.5,py,pz],sr*0.5,sr*0.7,sr*0.55,{det:{ribs:3}});
   B.tube([sr*1.5,py,pz],[sr*2.0,py,pz],sr*0.11,sr*0.09);
   B.tube([-0.6,py+sr*1.8,pz],[sr*1.6,py+sr*1.8,pz],sr*0.42,sr*0.38,{hideA:true,
     det:hullDet([0.5,0.85],[],[])});
   B.cap([sr*0.7,py+sr*3.6,pz-sr*0.9],[sr*0.7,py+sr*3.6,pz+sr*0.9],sr*0.6,
     {det:hullDet([0.35,0.7],[],[])});
   B.ball([sr*0.95,py+sr*5.6,pz],sr*rr(0.8,1.0),{det:{rings:[0.5]}});
   B.tube([sr*0.5,py+sr*1.8,pz],[sr*0.5,cr*0.9,0],0.14,0.14,
          {hideA:true,hideB:true,bare:true});
   /* the mini-magnetosphere: a conduit torus on posts around the whole cell,
      with the cryocooler huts that keep it superconducting */
   const mr=Math.min(E.y,E.z)*0.95, seg=14;
   for(let i=0;i<seg;i++){
     const a0=i/seg*Math.PI*2, a1=(i+1)/seg*Math.PI*2;
     B.tube([1.0,Math.cos(a0)*mr,Math.sin(a0)*mr],
            [1.0,Math.cos(a1)*mr,Math.sin(a1)*mr],0.16,0.16,
            {hideA:true,hideB:true,bare:true});
     if(i%5===0){
       B.box([0.55,Math.cos(a0)*mr,Math.sin(a0)*mr],0.55,0.55,0.45,{det:{ribs:2}});
       B.tube([1.4,Math.cos(a0)*mr,Math.sin(a0)*mr],
              [2.2,Math.cos(a0)*mr,Math.sin(a0)*mr],0.1,0.08);
     }
   }
 }},

/* a landing apron: the sintered disc, its markings, the berm that keeps the
   sandblast off the base, and the approach lights on the open side */
function padApron(B,sr,rr,R,cy,cz,Rp,berm){
  const n=12, poly=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2;
    poly.push([cy+Math.cos(a)*Rp,cz+Math.sin(a)*Rp]);}
  B.slab(poly,0.45,0.5,{bare:true});
  B.disc([0.62,cy,cz],[1,0,0],Rp*0.34,Rp*0.30,{bare:true});
  B.disc([0.62,cy,cz],[1,0,0],Rp*0.06,0,{bare:true});
  if(berm){
    /* the berm shields the base side; the horseshoe opens on the approach
       azimuth, because a lander must never overfly the people it is visiting.
       Local +y faces the base, so the arc is centred there. */
    const brad=Rp*1.28, a0=-2.2, a1=2.2;
    const seg=Math.max(6,Math.round((a1-a0)*brad/9));
    for(let i=0;i<seg;i++){
      const t0=a0+(a1-a0)*i/seg, t1=a0+(a1-a0)*(i+1)/seg;
      B.cap([0.4,cy+Math.cos(t0)*brad,cz+Math.sin(t0)*brad],
            [0.4,cy+Math.cos(t1)*brad,cz+Math.sin(t1)*brad],sr*0.78,
            {hideA:true,hideB:true});
    }
  }
  /* approach lights walk out on the open side */
  for(let i=0;i<4;i++){
    const yi=cy-Rp*(1.14+i*0.22);
    B.tube([-0.3,yi,cz],[sr*0.55,yi,cz],0.09,0.07,{hideA:true});
    B.ball([sr*0.62,yi,cz],0.16);
  }
}
/* a lander on the pad: the other yard's business end, parked */
function lander(B,sr,rr,R,cy,cz,hmax){
  if(R()<0.45){
    /* the big one: a cargo ship stood on its skirt */
    const hr=sr*rr(1.25,1.45), h=Math.min(hmax*0.96,hr*rr(6.5,8.5));
    B.tube([1.6,cy,cz],[h*0.82,cy,cz],hr,hr,{hideA:true,
      det:hullDet([0.3,0.55,0.8],[0.5,2.6,4.3],[])});
    B.tube([h*0.82,cy,cz],[h,cy,cz],hr,hr*0.2,{det:hullDet([0.5],[],[])});
    B.tube([2.2,cy,cz],[0.3,cy,cz],hr*1.0,hr*1.12);
    for(let i=0;i<4;i++){const a=i/4*Math.PI*2+0.4;
      B.tube([2.6,cy+Math.cos(a)*hr,cz+Math.sin(a)*hr],
             [0.2,cy+Math.cos(a)*hr*1.6,cz+Math.sin(a)*hr*1.6],sr*0.13,sr*0.11);
      B.disc([0.3,cy+Math.cos(a)*hr*1.6,cz+Math.sin(a)*hr*1.6],[1,0,0],sr*0.4,0);}
  }else{
    /* the small one: a hopper on four legs */
    const br=sr*rr(0.7,0.9), h=br*rr(2.6,3.4);
    B.tube([h*0.35,cy,cz],[h,cy,cz],br,br*0.8,{hideA:true,
      det:hullDet([0.4,0.75],[],[])});
    B.cap([h,cy,cz],[h*1.12,cy,cz],br*0.55);
    B.tube([h*0.35,cy,cz],[h*0.18,cy,cz],br*0.5,br*0.62,{hideA:true});
    for(let i=0;i<4;i++){const a=i/4*Math.PI*2+0.79;
      B.tube([h*0.4,cy+Math.cos(a)*br*0.8,cz+Math.sin(a)*br*0.8],
             [0.15,cy+Math.cos(a)*br*1.8,cz+Math.sin(a)*br*1.8],sr*0.08,sr*0.07);
      B.disc([0.25,cy+Math.cos(a)*br*1.8,cz+Math.sin(a)*br*1.8],[1,0,0],sr*0.26,0);}
  }
}
/* an unpressurised rover, parked nose to the road */
function rover(B,sr,rr,y,z){
  B.box([sr*0.55,y,z],sr*0.22,sr*0.75,sr*0.42,{det:{ribs:2}});
  B.box([sr*0.9,y-sr*0.45,z],sr*0.14,sr*0.28,sr*0.36);
  for(const dy of [-0.5,0.5])for(const dz of [-1,1])
    B.disc([sr*0.28,y+dy*sr*1.05,z+dz*sr*0.5],[0,0,1],sr*0.27,sr*0.1);
  B.tube([sr*1.0,y+sr*0.5,z],[sr*1.5,y+sr*0.5,z],0.04,0.04,{hideA:true});
}

/* ===================== site plans =====================
   A plan decides where the districts go and which roads serve them; it
   publishes the same eight sockets wherever they land. Districts never learn
   which plan they are on, so the whole library survives every new masterplan.
   The distances are the programme speaking: pads a long walk out behind
   their berms, the reactor a shorter one, the farm and the garage against
   the houses, and the mine wherever the ore is. */
const DIST=[
 {id:"hab",   E:{x:48,y:26,z:26}, d:[0.00,0.18]},
 {id:"garage",E:{x:15,y:20,z:20}, d:[0.28,0.42]},
 {id:"green", E:{x:10,y:22,z:22}, d:[0.28,0.46]},
 {id:"comms", E:{x:58,y:16,z:16}, d:[0.34,0.55]},
 {id:"depot", E:{x:16,y:20,z:20}, d:[0.48,0.66]},
 {id:"power", E:{x:42,y:30,z:30}, d:[0.52,0.76]},
 {id:"isru",  E:{x:22,y:34,z:34}, d:[0.62,0.92]},
 {id:"pad",   E:{x:52,y:56,z:56}, d:[1.00,1.35]}
];
const DKEY={};DIST.forEach(d2=>DKEY[d2.id]=d2);
const gsock=(x,z,tx,tz,E)=>{
  const dx=tx-x,dz=tz-z,L=Math.hypot(dx,dz);
  const u=L>1e-6?[dx/L,0,dz/L]:[1,0,0];
  return FR([x,0,z],[0,1,0],u,[u[2],0,-u[0]],E);
};

const TOPO=[
/* -------- hub & spoke: the classic — everything a spoke off the square -------- */
{n:"HUB & SPOKE",role:["FOB","FORWARD OPERATING BASE"],make(R,rr,P){
  const k=110+P.fuse*130;
  const a0=R()*Math.PI*2, sockets={}, roads=[];
  DIST.forEach((d2,i)=>{
    const dd=(d2.d[0]+(d2.d[1]-d2.d[0])*R())*k;
    const a=d2.id==="hab"?0:a0+i/DIST.length*Math.PI*2+rr(-0.25,0.25);
    const x=Math.cos(a)*dd, z=Math.sin(a)*dd;
    sockets[d2.id]=gsock(x,z,0,0,d2.E);
    if(d2.id!=="hab")roads.push({a:[x,z],b:[0,0],w:d2.id==="pad"?6:4.5});
  });
  return {sockets,roads,hub:[0,0]};
}},
/* -------- main street: one road, the base strung along it -------- */
{n:"MAIN STREET",role:["WAY","WAYSTATION"],make(R,rr,P){
  const k=95+P.fuse*115, L=k*1.5;
  const sockets={}, roads=[];
  const order=["garage","hab","green","comms","depot","power","isru"];
  const xs=[];
  order.forEach((id,i)=>{
    const d2=DKEY[id];
    const x=-L*0.55+L*1.05*i/(order.length-1)+rr(-k*0.05,k*0.05);
    const side=(i%2?1:-1);
    const z=side*(k*rr(0.20,0.34));
    sockets[id]=gsock(x,z,x,0,d2.E);
    roads.push({a:[x,z*0.55],b:[x,0],w:4});
    xs.push(x);
  });
  /* the street is laid junction to junction, so the services can walk it */
  xs.sort((a,b)=>a-b);
  const stops=[-L*0.62].concat(xs,[L*0.55]);
  for(let i=0;i<stops.length-1;i++)
    roads.push({a:[stops[i],0],b:[stops[i+1],0],w:6});
  /* and the pad hangs off its far end */
  const px=L*0.55+k*rr(0.55,0.8), pz=rr(-0.3,0.3)*k*0.5;
  sockets.pad=gsock(px,pz,L*0.45,0,DKEY.pad.E);
  roads.push({a:[L*0.55,0],b:[px*0.86,pz*0.86],w:6});
  return {sockets,roads,hub:[-L*0.1,0]};
}},
/* -------- rim arc: the base wears a crater like a collar, and mines it -------- */
{n:"RIM ARC",role:["ICE","POLAR ICE STATION"],note:"PSR SITE",make(R,rr,P){
  const k=95+P.fuse*110;
  const Rc=k*rr(0.55,0.75);                        /* the crater the base is for */
  const ring=Rc+k*rr(0.30,0.42);
  const a0=R()*Math.PI*2, span=Math.PI*rr(0.95,1.25);
  const sockets={}, roads=[];
  const order=["garage","hab","green","comms","depot","power"];
  order.forEach((id,i)=>{
    const d2=DKEY[id];
    const a=a0+span*(i/(order.length-1)-0.5);
    const x=Math.cos(a)*ring, z=Math.sin(a)*ring;
    sockets[id]=gsock(x,z,0,0,d2.E);
    if(i)roads.push({a:[Math.cos(a0+span*((i-1)/(order.length-1)-0.5))*ring,
                        Math.sin(a0+span*((i-1)/(order.length-1)-0.5))*ring],
                     b:[x,z],w:4.5,arc:[0,0,ring]});
  });
  /* the rigs go down into the shadow; the pad stays well outside the ring.
     Both spurs leave from a junction the arc road actually visits, so the
     services can find their way along it. */
  const node=i=>{const a=a0+span*(i/(order.length-1)-0.5);
                 return [Math.cos(a)*ring,Math.sin(a)*ring];};
  sockets.isru=gsock(Math.cos(a0)*Rc*0.25,Math.sin(a0)*Rc*0.25,
                     Math.cos(a0)*ring,Math.sin(a0)*ring,DKEY.isru.E);
  roads.push({a:node(3),b:[Math.cos(a0)*Rc*0.3,Math.sin(a0)*Rc*0.3],w:4});
  const pa=a0+span*0.72, pd=ring+k*rr(0.62,0.9);
  sockets.pad=gsock(Math.cos(pa)*pd,Math.sin(pa)*pd,
                    Math.cos(pa)*ring,Math.sin(pa)*ring,DKEY.pad.E);
  roads.push({a:node(order.length-1),b:[Math.cos(pa)*pd*0.88,Math.sin(pa)*pd*0.88],w:6});
  return {sockets,roads,hub:[Math.cos(a0+span*0.1)*ring,Math.sin(a0+span*0.1)*ring],
          crater:{x:0,z:0,r:Rc}};
}},
/* -------- twin site: the town and the works, a haul road apart -------- */
{n:"TWIN SITE",role:["MIN","EXTRACTION COLONY"],make(R,rr,P){
  const k=95+P.fuse*115, D=k*rr(1.0,1.3);
  const th=R()*Math.PI*2, ex=Math.cos(th), ez=Math.sin(th);
  const A=[-ex*D*0.5,-ez*D*0.5], B2=[ex*D*0.5,ez*D*0.5];
  const sockets={}, roads=[];
  const put=(id,cx,cz,ang,dd)=>{
    const d2=DKEY[id];
    const x=cx+Math.cos(ang)*dd, z=cz+Math.sin(ang)*dd;
    sockets[id]=gsock(x,z,cx,cz,d2.E);
    roads.push({a:[x,z],b:[cx,cz],w:4});
  };
  sockets.hab=gsock(A[0],A[1],B2[0],B2[1],DKEY.hab.E);
  put("green",A[0],A[1],th+Math.PI*0.5+rr(-0.4,0.4),k*0.32);
  put("garage",A[0],A[1],th-Math.PI*0.5+rr(-0.4,0.4),k*0.30);
  put("comms",A[0],A[1],th+Math.PI+rr(-0.4,0.4),k*0.38);
  put("isru",B2[0],B2[1],th+rr(-0.5,0.5),k*0.42);
  put("depot",B2[0],B2[1],th+Math.PI*0.5+rr(-0.4,0.4),k*0.30);
  put("power",B2[0],B2[1],th-Math.PI*0.5+rr(-0.4,0.4),k*0.36);
  const pa=th+rr(-0.6,0.6), pd=k*rr(0.75,1.0);
  sockets.pad=gsock(B2[0]+Math.cos(pa)*pd,B2[1]+Math.sin(pa)*pd,B2[0],B2[1],DKEY.pad.E);
  roads.push({a:[B2[0]+Math.cos(pa)*pd*0.86,B2[1]+Math.sin(pa)*pd*0.86],b:B2,w:6});
  roads.push({a:A,b:B2,w:6});
  return {sockets,roads,hub:A};
}},
/* -------- scatter: instruments want distance from everything, including
   each other. The roads make a chain, not a star. -------- */
{n:"SCATTER",role:["RSO","RESEARCH OUTPOST"],make(R,rr,P){
  const k=105+P.fuse*125;
  const sockets={}, roads=[], placed=[];
  DIST.forEach(d2=>{
    const dd=(d2.d[0]+(d2.d[1]-d2.d[0])*R())*k;
    const a=R()*Math.PI*2;
    let x=Math.cos(a)*dd, z=Math.sin(a)*dd;
    /* one nudge apart if the roll landed on a neighbour */
    for(const q of placed){
      const dx=x-q[0],dz=z-q[1],L2=Math.hypot(dx,dz);
      if(L2<k*0.42){x+=dx/(L2||1)*(k*0.42-L2);z+=dz/(L2||1)*(k*0.42-L2);}
    }
    placed.push([x,z,d2.id]);
    sockets[d2.id]=gsock(x,z,0,0,d2.E);
  });
  /* chain: each site roads to the nearest already-connected one */
  const done=[placed[0]];
  for(let i=1;i<placed.length;i++){
    let best=done[0],bd=1e9;
    for(const q of done){
      const L2=Math.hypot(placed[i][0]-q[0],placed[i][1]-q[1]);
      if(L2<bd){bd=L2;best=q;}
    }
    roads.push({a:[placed[i][0],placed[i][1]],b:[best[0],best[1]],
                w:placed[i][2]==="pad"?6:4});
    done.push(placed[i]);
  }
  return {sockets,roads,hub:[placed[0][0],placed[0][1]]};
}}
];

/* ===================== roads and services =====================
   A district is authored blind: it does not know where the power is, so it
   cannot run its own feeder. Once the plan has settled, this pass looks at
   the finished site and asks the question no district can — what is near
   what — and lays the network: the roads the plan asked for, one feeder from
   the switchyard to every district, and the propellant line that walks from
   the plant to the tank farm to the pad on its own trestles. */
const ROAD_Y=0.28;
function ribbon(a,b,w,out,jog){
  const dx=b[0]-a[0],dz=b[1]-a[1],L=Math.hypot(dx,dz);
  if(L<1e-3)return;
  const px=-dz/L,pz=dx/L;
  const P=[a];
  if(L>40)P.push([a[0]+dx*0.5+px*jog,a[1]+dz*0.5+pz*jog]);
  P.push(b);
  const lft=[],rgt=[];
  for(let i=0;i<P.length;i++){
    const A2=P[Math.max(0,i-1)],B3=P[Math.min(P.length-1,i+1)];
    const ddx=B3[0]-A2[0],ddz=B3[1]-A2[1],LL=Math.hypot(ddx,ddz)||1;
    const nx=-ddz/LL,nz=ddx/LL;
    lft.push([P[i][0]+nx*w/2,ROAD_Y,P[i][1]+nz*w/2]);
    rgt.push([P[i][0]-nx*w/2,ROAD_Y,P[i][1]-nz*w/2]);
  }
  out.push(PNL(lft.concat(rgt.reverse()),null,[0,1,0],0.4,null,{bare:true,g:"road",slot:true}));
}
function services(lay,parts,R,rr,P){
  for(const rd of lay.roads)ribbon(rd.a,rd.b,rd.w,parts,rr(-1,1)*8);
  /* Cables and pipes walk the roads. A straight chord from the reactor to
     every district is how a diagram thinks; a base trenches its lines beside
     the routes it has already graded, so the network is routed over the road
     graph and offset to the verge — power down one side, propellant down the
     other. */
  const key=q=>Math.round(q[0])+","+Math.round(q[1]);
  const adj={};
  const link=(a,b)=>{(adj[key(a)]=adj[key(a)]||[]).push(b);
                     (adj[key(b)]=adj[key(b)]||[]).push(a);};
  for(const rd of lay.roads)link(rd.a,rd.b);
  const near=q=>{
    let best=null,bd=1e9;
    for(const k in adj){const p=k.split(",").map(Number);
      const d=Math.hypot(p[0]-q[0],p[1]-q[2]);
      if(d<bd){bd=d;best=p;}}
    return best;
  };
  const route=(from,to)=>{
    const s=near(from),t=near(to);
    const fb=[[from[0],from[2]],[to[0],to[2]]];
    if(!s||!t)return fb;
    const Q=[[s]],seen=new Set([key(s)]);
    while(Q.length){
      const path=Q.shift(), cur=path[path.length-1];
      if(key(cur)===key(t))return [[from[0],from[2]]].concat(path,[[to[0],to[2]]]);
      for(const nx of adj[key(cur)]||[])
        if(!seen.has(key(nx))){seen.add(key(nx));Q.push(path.concat([nx]));}
    }
    return fb;      /* two islands: the line goes cross-country after all */
  };
  /* offset a route to the verge: each vertex slides along the average normal
     of its adjacent legs, so the line hugs the road through every bend */
  const verge=(pts2,off)=>{
    const o=[];
    for(let i2=0;i2<pts2.length;i2++){
      const A2=pts2[Math.max(0,i2-1)],B3=pts2[Math.min(pts2.length-1,i2+1)];
      const dx=B3[0]-A2[0],dz=B3[1]-A2[1],L=Math.hypot(dx,dz)||1;
      o.push([pts2[i2][0]-dz/L*off,pts2[i2][1]+dx/L*off]);
    }
    return o;
  };
  const pw=lay.sockets.power.fr.o;
  for(const d2 of DIST){
    if(d2.id==="power")continue;
    const keep=d2.id==="pad"||d2.id==="isru"||d2.id==="hab";
    if(!keep&&P.detail<0.34)continue;
    const o=lay.sockets[d2.id].fr.o;
    const pts2=verge(route(pw,o),3.4);
    for(let i2=0;i2<pts2.length-1;i2++)
      parts.push(TUB([pts2[i2][0],0.42,pts2[i2][1]],[pts2[i2+1][0],0.42,pts2[i2+1][1]],
        0.2,0.2,{hideA:true,hideB:true,bare:true,g:"svc",slot:true}));
    parts.push(BOX([pts2[pts2.length-1][0],0.5,pts2[pts2.length-1][1]],
      [0.5,0,0],[0,0.5,0],[0,0,0.5],{bare:true,g:"svc",slot:true}));
  }
  /* the propellant line: plant → farm → pad, up on trestles on the far verge */
  const runs=[[lay.sockets.isru.fr.o,lay.sockets.depot.fr.o],
              [lay.sockets.depot.fr.o,lay.sockets.pad.fr.o]];
  for(const [a,b] of runs){
    const pts2=verge(route(a,b),-4.2);
    for(let i2=0;i2<pts2.length-1;i2++){
      const p0=pts2[i2],p1=pts2[i2+1];
      parts.push(TUB([p0[0],1.05,p0[1]],[p1[0],1.05,p1[1]],0.38,0.38,
        {hideA:true,hideB:true,g:"svc",slot:true}));
      const L=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]), nT=Math.floor(L/15);
      for(let t2=1;t2<=nT;t2++){
        const x=p0[0]+(p1[0]-p0[0])*t2/(nT+1),z=p0[1]+(p1[1]-p0[1])*t2/(nT+1);
        if(P.detail>0.22)parts.push(BOX([x,0.5,z],[0.15,0,0],[0,0.55,0],[0,0,0.15],
          {bare:true,g:"svc",slot:true}));
      }
    }
  }
}

/* ===================== the ground =====================
   The site is a slab of the Moon, cut out and set on the sheet like a
   survey model. Everything below grade is swallowed by it, which is what
   lets foundations bury themselves the way sockets do. The craters were
   here first; the plan is what had to work around them. */
function terrain(lay,parts,R,rr,P,ext){
  /* the plinth: the hull of everything built, walked outward and roughened */
  const h2=hull(ext.map(q=>[q[0],q[1]]));
  let cx=0,cz=0;
  for(const q of h2){cx+=q[0];cz+=q[1];}
  cx/=h2.length;cz/=h2.length;
  const poly=[];
  for(let i=0;i<h2.length;i++){
    const q=h2[i], nq=h2[(i+1)%h2.length];
    for(const [qa,qb,t] of [[q,nq,0],[q,nq,0.5]]){
      const x=qa[0]+(qb[0]-qa[0])*t, z=qa[1]+(qb[1]-qa[1])*t;
      const dx=x-cx,dz=z-cz,L=Math.hypot(dx,dz)||1;
      const m=(t?rr(24,44):rr(30,50));
      poly.push([x+dx/L*m,-1.62,z+dz/L*m]);
    }
  }
  parts.push(PNL(poly,null,[0,1,0],3.3,null,{ter:true}));

  /* the craters: rolled from a fixed table, kept where nothing was built */
  const keep=[];
  for(const d2 of DIST)keep.push(lay.sockets[d2.id].fr.o);
  const bb2=poly.reduce((s,q)=>[Math.min(s[0],q[0]),Math.max(s[1],q[0]),
                                Math.min(s[2],q[2]),Math.max(s[3],q[2])],[1e9,-1e9,1e9,-1e9]);
  if(lay.crater)
    parts.push(DSC([lay.crater.x,lay.crater.r*0.045,lay.crater.z],[0,1,0],
                   lay.crater.r,lay.crater.r*0.82,{ter:true}));
  const pado=lay.sockets.pad.fr.o;
  for(let i=0;i<14;i++){
    const x=bb2[0]+(bb2[1]-bb2[0])*R(), z=bb2[2]+(bb2[3]-bb2[2])*R();
    const cr=rr(3.5,13);
    let ok=Math.hypot(x-cx,z-cz)<Math.max(bb2[1]-bb2[0],bb2[3]-bb2[2])*0.40;
    for(const q of keep)if(Math.hypot(x-q[0],z-q[2])<cr+34)ok=false;
    if(Math.hypot(x-pado[0],z-pado[2])<cr+60)ok=false;
    if(lay.crater&&Math.hypot(x-lay.crater.x,z-lay.crater.z)<lay.crater.r+cr)ok=false;
    if(ok)parts.push(DSC([x,cr*0.05,z],[0,1,0],cr,cr*0.58,{ter:true}));
  }
  /* the boulders: the ones too big to bother dragging away */
  for(let i=0;i<22;i++){
    const x=bb2[0]+(bb2[1]-bb2[0])*R(), z=bb2[2]+(bb2[3]-bb2[2])*R();
    const br=rr(0.7,2.1);
    let ok=Math.hypot(x-cx,z-cz)<Math.max(bb2[1]-bb2[0],bb2[3]-bb2[2])*0.44;
    for(const q of keep)if(Math.hypot(x-q[0],z-q[2])<26)ok=false;
    if(lay.crater&&Math.hypot(x-lay.crater.x,z-lay.crater.z)<lay.crater.r)ok=false;
    if(ok&&P.detail>0.16)parts.push(SPH([x,br*0.35,z],br,{ter:true}));
  }
  /* the flag, planted where the first crew stepped off */
  const fa=R()*Math.PI*2, fd=rr(28,44);
  const fx=lay.hub[0]+Math.cos(fa)*fd, fz=lay.hub[1]+Math.sin(fa)*fd;
  parts.push(TUB([fx,0,fz],[fx,5.2,fz],0.05,0.05,{hideA:true,bare:true}));
  parts.push(PNL([[fx,5.1,fz],[fx+2.1,5.1,fz+0.4],[fx+2.1,4.0,fz+0.4],[fx,4.0,fz]],
                 null,[-0.19,0,0.98],0.06,null,{bare:true}));
  /* one lander in six came in hot and went over. Every yard has one; it is
     kept where it fell, as a warning and a spares bin. */
  if(R()<0.17){
    const ta=R()*Math.PI*2, td=rr(46,66);
    const tx2=pado[0]+Math.cos(ta)*td, tz2=pado[2]+Math.sin(ta)*td;
    const la=R()*Math.PI*2, ll=rr(3.4,4.4);
    const ex2=Math.cos(la),ez2=Math.sin(la);
    parts.push(TUB([tx2,0.82,tz2],[tx2+ex2*ll,0.82,tz2+ez2*ll],0.84,0.72,{}));
    parts.push(DSC([tx2-ex2*0.1,0.82,tz2-ez2*0.1],[-ex2,0,-ez2],0.86,0.4,{}));
    for(const lg of [0.8,2.4])
      parts.push(TUB([tx2+ex2*lg,1.2,tz2+ez2*lg],[tx2+ex2*(lg+0.9),2.6,tz2+ez2*(lg+0.6)],
                     0.07,0.06,{hideA:true}));
  }
}

function buildShip(seed,P,lock){
  const R=mulberry32(seed|0), rr=(a,b)=>a+(b-a)*R(), pick=a=>a[Math.floor(R()*a.length)|0];
  const parts=[], envs=[], chosen={};
  const sr=3.2;

  const tIdx=(lock&&lock.topo!=null)?Math.min(lock.topo,TOPO.length-1):Math.floor(R()*TOPO.length);
  const topo=TOPO[tIdx];
  chosen.topo={i:tIdx,n:topo.n};
  const lay=topo.make(R,rr,P);

  let pop=0,kw=0,pads=0,ind=0,ter=0,drv=0;
  for(const d2 of DIST){
    const id=d2.id, sock=lay.sockets[id], list=VAR[id];
    const idx=(lock&&lock[id]!=null)?Math.min(lock[id],list.length-1):Math.floor(R()*list.length);
    const v=list[idx];
    chosen[id]={i:idx,n:v.n};
    pop+=v.pop||0;kw+=v.kw||0;pads+=v.pads||0;ind+=v.ind||0;
    ter+=v.ter||0;drv+=v.drv||0;
    const out=[];
    v.make(builder(sock.fr,out),sr,rr,R,sock.E);
    for(const p of out){p.slot=true;p.g=id;}
    parts.push(...out);
    const f=sock.fr;
    envs.push({id,c:V.add(f.o,V.mul(f.f,sock.E.x*0.5)),
      u:V.mul(f.f,sock.E.x*0.5),v:V.mul(f.u,sock.E.y),w:V.mul(f.s,sock.E.z)});
  }

  services(lay,parts,R,rr,P);

  /* registry, derived from what actually got built — the ground doesn't weigh */
  const extPts=[];
  let vol=0;const pts=[];
  for(const p of parts){
    if(p.k==="sphere"){vol+=4/3*Math.PI*p.r**3;pts.push([p.c,p.r]);}
    else if(p.k==="capsule"){vol+=Math.PI*p.r*p.r*V.len(V.sub(p.b,p.a))+4/3*Math.PI*p.r**3;
      pts.push([p.a,p.r],[p.b,p.r]);}
    else if(p.k==="tube"){vol+=Math.PI/3*(p.r1*p.r1+p.r1*p.r2+p.r2*p.r2)*V.len(V.sub(p.b,p.a));
      pts.push([p.a,p.r1],[p.b,p.r2]);}
    else if(p.k==="disc"){vol+=Math.PI*p.r*p.r*p.r*0.18;pts.push([p.c,p.r]);}
    else if(p.k==="lathe"){
      const e=p.ell?p.ell[0]*p.ell[1]:1;
      for(let i=1;i<p.prof.length;i++){
        const h=Math.abs(p.prof[i][0]-p.prof[i-1][0]),r1=p.prof[i-1][1],r2=p.prof[i][1];
        vol+=Math.PI/3*(r1*r1+r1*r2+r2*r2)*h*e;
      }
      for(const [tt,r] of p.prof)pts.push([V.add(p.c,V.mul(p.axis,tt)),r]);}
    else if(p.k==="box"){vol+=8*V.len(p.u)*V.len(p.v)*V.len(p.w);
      for(let i=0;i<8;i++)pts.push([V.add(p.c,V.add(V.mul(p.u,i&1?1:-1),
        V.add(V.mul(p.v,i&2?1:-1),V.mul(p.w,i&4?1:-1)))),0]);}
    else if(p.k==="panel"){
      let a2=0;for(let i=1;i<p.pts.length-1;i++)
        a2+=V.len(V.cross(V.sub(p.pts[i],p.pts[0]),V.sub(p.pts[i+1],p.pts[0])))/2;
      vol+=a2*p.th;
      for(const q of p.pts)pts.push([q,p.th]);}
    for(const [q] of partExtents(p))extPts.push([q[0],q[2]]);
  }
  const bbB=[[1e9,1e9,1e9],[-1e9,-1e9,-1e9]];
  for(const [q,r] of pts)for(let i=0;i<3;i++){
    bbB[0][i]=Math.min(bbB[0][i],q[i]-r);bbB[1][i]=Math.max(bbB[1][i],q[i]+r);}
  const built={length:bbB[1][0]-bbB[0][0],beam:bbB[1][2]-bbB[0][2],
               height:bbB[1][1]-bbB[0][1]};
  const mass=vol*0.24;

  terrain(lay,parts,R,rr,P,extPts);

  /* the whole sheet frames on everything, ground included */
  const bb=[[1e9,1e9,1e9],[-1e9,-1e9,-1e9]];
  for(const p of parts)for(const [q,r] of partExtents(p))for(let i=0;i<3;i++){
    bb[0][i]=Math.min(bb[0][i],q[i]-r);bb[1][i]=Math.max(bb[1][i],q[i]+r);}

  /* No two bases may share a designation, and luck is not a guarantee. The
     seed is a 32-bit word read as a mixed-radix number whose digits ARE the
     designation — one names the site, two are the survey block letters, and
     the remainder is the plot number. A bijection, so every one of the
     4,294,967,296 sites is distinct by construction. */
  const NB=CRATERS.length, AZ=26;
  let u=seed>>>0;
  const name=CRATERS[u%NB];           u=(u-u%NB)/NB;
  const b1=u%AZ;                      u=(u-b1)/AZ;
  const b2=u%AZ;                      u=(u-b2)/AZ;
  const block=String.fromCharCode(65+b1,65+b2), plot=u;
  const klass=pick(CRATERS);
  /* the role is read off the finished base, not asserted by the plan: three
     pads make a port whatever else is true, a catapult or a roofed sky names
     the base over its size, a big enough town is a town, and heavy extraction
     kit names it only when nothing else does */
  const role = pads>=3?["PRT","LUNAR SPACEPORT"]

/* ===================== targets ===================== */
function CanvasTarget(ctx){

    rect(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);},
    poly(pts,fill,stroke,w){
      if(pts.length<2)return;
      ctx.lineJoin="round";ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.closePath();
      if(fill){ctx.fillStyle=fill;ctx.fill();}
      if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.setLineDash([]);ctx.stroke();}
    },
    path(pts,stroke,w,dash){
      if(pts.length<2)return;
      ctx.lineJoin="round";ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.setLineDash(dash||[]);
      ctx.stroke();ctx.setLineDash([]);
    },
    text(str,x,y,o){
      ctx.fillStyle=o.color;
      ctx.font=`${o.weight||600} ${o.size}px "Saira Condensed","Arial Narrow",sans-serif`;
      ctx.textBaseline="alphabetic";ctx.textAlign="left";
      if(o.tracking){
        const ch=[...str];let tot=0;
        for(const c of ch)tot+=ctx.measureText(c).width+o.tracking;
        tot-=o.tracking;
        let cx=o.anchor==="end"?x-tot:o.anchor==="middle"?x-tot/2:x;
        for(const c of ch){ctx.fillText(c,cx,y);cx+=ctx.measureText(c).width+o.tracking;}
      }else{
        ctx.textAlign=o.anchor==="end"?"right":o.anchor==="middle"?"center":"left";
        ctx.fillText(str,x,y);
      }
    }
  };
}
function SvgTarget(W,H){

    rect(x,y,w,h,fill){out.push(`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${fill}"/>`);},
    poly(pts,fill,stroke,w){if(pts.length<2)return;
      out.push(`<polygon points="${d(pts)}" fill="${fill||"none"}" stroke-linejoin="round" ${stroke?`stroke="${stroke}" stroke-width="${f(w)}"`:'stroke="none"'}/>`);},
    path(pts,stroke,w,dash){if(pts.length<2)return;
      out.push(`<polyline points="${d(pts)}" fill="none" stroke="${stroke}" stroke-width="${f(w)}" stroke-linecap="round" stroke-linejoin="round"${dash?` stroke-dasharray="${dash.map(f).join(" ")}"`:""}/>`);},
    text(str,x,y,o){

/* ===================== projections ===================== */
const PROJ={profile:p=>[-p[0],p[1],p[2]],plan:p=>[-p[0],p[2],p[1]],bow:p=>[p[2],p[1],p[0]]};
function isoProj(yaw,pitch){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  return p=>{const x1=p[0]*cy-p[2]*sy,z1=p[0]*sy+p[2]*cy,y1=p[1];

/* ===================== occlusion =====================
   The see-through flicker was the painter's algorithm. Bodies were sorted by
   centroid depth and each one painted a background-coloured fill beneath its
   own outline, erasing whatever had been drawn before it. Centroid order
   cannot describe two solids that interpenetrate — and on this ship every
   socket interpenetrates by design — so as the pictorial turned, the fill of
   a body behind would land on top of a body in front and punch a hole in it.

   The fills are gone. Each ship is tessellated once — the mesh is invariant
   under yaw, only the projection turns — rasterised into a depth buffer, and
   every line the renderer wants to draw is clipped against that buffer. Draw
   order stops mattering, interpenetration is handled for free, and the output
   is still pure vector polylines, so the SVG export gets the same treatment. */
function shipMesh(ship){
  if(ship._mesh)return ship._mesh;

      const n=SG(p.r),m=Math.max(4,n>>1),rg=[];

                        Math.sin(th)*p.r,[0,1,0],n));}

    }else if(p.k==="capsule"){
      const ax=V.norm(V.sub(p.b,p.a)),n=SG(p.r),m=Math.max(3,n>>2);

        const rg=ringPts(V.add(p.a,V.mul(ax,-Math.sin(th)*p.r)),Math.cos(th)*p.r,ax,n);
        band(pv,rg);pv=rg;}
      pv=B;
      for(let i=1;i<=m;i++){const th=i/m*Math.PI/2;
        const rg=ringPts(V.add(p.b,V.mul(ax,Math.sin(th)*p.r)),Math.cos(th)*p.r,ax,n);

      const ax=V.norm(V.sub(p.b,p.a)),n=SG(Math.max(p.r1,p.r2));
      const A=ringPts(p.a,p.r1,ax,n),B=ringPts(p.b,p.r2,ax,n);

      const c=[];
      for(let j=0;j<8;j++)c.push(V.add(p.c,V.add(V.mul(p.u,j&1?1:-1),
        V.add(V.mul(p.v,j&2?1:-1),V.mul(p.w,j&4?1:-1)))));
      for(const f of [[0,2,6,4],[1,5,7,3],[0,4,5,1],[2,3,7,6],[0,1,3,2],[4,6,7,5]])

      band(oA,oB);

      const [bu,bv]=basis(p.axis),ea=p.ell?p.ell[0]:1,eb=p.ell?p.ell[1]:1;

/* Every projection here is linear, so it collapses to a 3x3 — that keeps the

  const flat=M.diag*0.0012;

          y1=(m[3]*bx+m[4]*by+m[5]*bz)*sc+z.oy,

          y2=(m[3]*cx+m[4]*cy+m[5]*cz)*sc+z.oy,

    hi=y0>y1?(y0>y2?y0:y2):(y1>y2?y1:y2);
    let miny=lo<0?0:Math.floor(lo), maxy=hi>H-1?H-1:Math.ceil(hi);

    const dzdy=((z2-z0)*(x1-x0)-(z1-z0)*(x2-x0))*ia;

/* one buffer per view slot: the pictorial rebuilds on every frame of a spin,

   holds the ceiling well below print resolution; the export lifts it. */

function depthBuffer(ship,proj,res,slot,sig){
  const cur=ZSLOT[slot];

      let L=0;for(let i=1;i<r.length;i++)L+=Math.hypot(r[i][0]-r[i-1][0],r[i][1]-r[i-1][1]);

      let L=0;for(let i=1;i<r.length;i++)L+=Math.hypot(r[i][0]-r[i-1][0],r[i][1]-r[i-1][1]);

  function hatchAxial(a,b,r1,r2,axis){
    const [u,v]=basis(axis), L=V.len(V.sub(b,a))||1, dr=(r2-r1)/L;
    const NH=hatchN(2*Math.PI*Math.max(r1,r2)*scale);
    for(let i=0;i<NH;i++){
      const th=i/NH*Math.PI*2;
      const rad=V.add(V.mul(u,Math.cos(th)),V.mul(v,Math.sin(th)));
      const n=V.norm(V.sub(rad,V.mul(axis,dr)));
      if(TONE(n)<thrOf(i))continue;
      const [P,N]=densPN([V.add(a,V.mul(rad,r1)),V.add(b,V.mul(rad,r2))],[n,n]);
      hatchRun(P,N);
    }
  }
  /* small circles about the light: every one is a line of constant tone, so the
     hatch follows the terminator round the ball however it is turned */
  function hatchSphere(c,r){
    const NH=hatchN(2*Math.PI*r*scale), half=Math.max(4,NH>>1);
    for(let i=0;i<half;i++){
      const phi=(i+0.5)/half*Math.PI, cp=Math.cos(phi);
      if(tone(cp)<thrOf(i))continue;
      const rr=r*Math.sin(phi);
      if(rr*scale<1.5)continue;
      const pts=ringPts(V.add(c,V.mul(LOBJ,r*cp)),rr,LOBJ,SEG(rr*scale));
      hatchRun(pts.concat([pts[0]]),pts.map(q=>V.norm(V.sub(q,c))).concat([V.norm(V.sub(pts[0],c))]));
    }
  }
  /* chords in the plane of a flat face, scan-line clipped to its outline */
  function hatchFace(poly3,nrm,hole){
    const tn=TONE(nrm);
    if(tn<thrOf(0))return;
    const [u,v]=basis(nrm), o=poly3[0];
    const P=poly3.map(q=>{const d=V.sub(q,o);return [V.dot(d,u),V.dot(d,v)];});
    let mn=1e30,mx=-1e30;
    for(const q of P){if(q[1]<mn)mn=q[1];if(q[1]>mx)mx=q[1];}
    const K=Math.min(160,Math.floor((mx-mn)/HGAP));
    const hv=hole?V.sub(hole.c,o):null;
    const hc=hv?[V.dot(hv,u),V.dot(hv,v)]:null;
    for(let k=0;k<K;k++){
      if(tn<thrOf(k))continue;
      const y=mn+(k+0.5)*HGAP, xs=[];
      for(let j=0,m=P.length;j<m;j++){
        const A=P[j],B=P[(j+1)%m];
        if((A[1]>y)!==(B[1]>y))xs.push(A[0]+(B[0]-A[0])*(y-A[1])/((B[1]-A[1])||1e-9));
      }
      xs.sort((a,b)=>a-b);
      for(let j=0;j+1<xs.length;j+=2){
        let spans=[[xs[j],xs[j+1]]];
        if(hc&&Math.abs(y-hc[1])<hole.r){            /* an annulus keeps its hole */
          const w=Math.sqrt(hole.r*hole.r-(y-hc[1])*(y-hc[1]));
          spans=[[xs[j],Math.min(xs[j+1],hc[0]-w)],[Math.max(xs[j],hc[0]+w),xs[j+1]]];
        }
        for(const [x0,x1] of spans){
          if(x1-x0<HGAP*0.4)continue;
          const q0=V.add(o,V.add(V.mul(u,x0),V.mul(v,y)));
          const q1=V.add(o,V.add(V.mul(u,x1),V.mul(v,y)));
          const [PP,NN]=densPN([q0,q1],[nrm,nrm]);
          hatchRun(PP,NN);
        }
      }
    }
  }

  if(showEnv){
    const dash=[scale*0.55,scale*0.35];
    for(const e of ship.envs){
      const c=[];
      for(let i=0;i<8;i++)c.push(V.add(e.c,V.add(V.mul(e.u,i&1?1:-1),
        V.add(V.mul(e.v,i&2?1:-1),V.mul(e.w,i&4?1:-1)))));
      for(const [x,y] of [[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]])
        for(const r of runs3(dens([c[x],c[y]],false,6),VIS,MINR))t.path(r,ink,lw*0.5,dash);
    }
  }

  /* order no longer decides what is visible — it only decides the order in
     which bodies land during the reveal wipe, back to front */
  const items=ship.parts.map((p,i)=>({p,i,z:D(partCentroid(p))}))
                        .sort((a,b)=>a.z-b.z||a.i-b.i);
  const shown=Math.max(0,Math.min(items.length,Math.round(items.length*reveal)));

  /* walk a tagged hull, stroking every edge except the ones on a buried cap */
  function outline(H,drawA,drawB,w){
    const n=H.length;
    const keep=i=>{
      const p=H[i],q=H[(i+1)%n];
      if(p[2]!==q[2])return true;
      return p[2]===0?drawA:drawB;
    };
    let run=[];
    const flush=()=>{if(run.length>1)stroke(run,false,w);run=[];};
    for(let i=0;i<n;i++){
      if(!keep(i)){flush();continue;}
      const A=H[i][3],B=H[(i+1)%n][3],a=S(A),b=S(B);
      const k=Math.max(1,Math.min(64,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/5)));
      if(!run.length)run.push(A);
      for(let j=1;j<=k;j++)run.push(V.lerp(A,B,j/k));
    }
    flush();
  }
  function surfDet(p,axis,a,b,r1,r2,n){
    if(!p.det)return;
    const d=p.det, minL=Math.max(r1,r2)*scale*0.35;
    for(const tt of (d.rings||[])){
      const c=V.lerp(a,b,tt),r=r1+(r2-r1)*tt,ref=D(c);
      for(const run of runs(ringPts(c,r,axis,n),q=>D(q)>ref&&VIS(q),minL))t.path(run,ink,dw);
    }
    const [u,v]=basis(axis);
    for(const th of (d.longs||[])){
      const dir=V.add(V.mul(u,Math.cos(th)),V.mul(v,Math.sin(th)));
      const pts=[];
      for(let i=0;i<=20;i++){const f=i/20;
        pts.push(V.add(V.lerp(a,b,f),V.mul(dir,r1+(r2-r1)*f)));}
      for(const run of runs3(pts,q=>faces(q,dir)&&VIS(q),0))
        if(run.length>2)t.path(run,ink,dw);
    }
    for(const po of (d.ports||[])){
      const dir=V.add(V.mul(u,Math.cos(po.th)),V.mul(v,Math.sin(po.th)));
      const c=V.add(V.lerp(a,b,po.t),V.mul(dir,r1+(r2-r1)*po.t));
      if(!faces(c,dir))continue;
      for(const run of runs(ringPts(c,po.r,dir,SEG(po.r*scale)),VIS,MINR))t.path(run,ink,dw);
    }
  }

  for(let k=0;k<shown;k++){
    const it=items[k], p=it.p;

    if(p.k==="sphere"){

      stroke(ringPts(p.c,p.r,EYE,n),true);
      if(p.det&&p.det.rings)for(const tt of p.det.rings){
        const kk=(tt-0.5)*1.72,ax=[1,0,0];
        const cc=V.add(p.c,V.mul(ax,p.r*kk));
        for(const run of runs(ringPts(cc,p.r*Math.sqrt(Math.max(0,1-kk*kk)),ax,n),
                              q=>D(q)>ref&&VIS(q),R2*0.35))t.path(run,ink,dw);
      }
      if(HATCH)hatchSphere(p.c,p.r);
      continue;
    }

    /* body of revolution: silhouette by hull, then only the stations that are
       real edges, plus meridians — never every facet */
    if(p.k==="lathe"){
      const mr=p.prof.reduce((m,q)=>Math.max(m,q[1]),0);
      const n=p.facets||SEG(mr*scale), NP=p.prof.length;
      const cen=i=>V.add(p.c,V.mul(p.axis,p.prof[i][0]));
      const [bu,bv]=basis(p.axis), ea=p.ell?p.ell[0]:1, eb=p.ell?p.ell[1]:1;
      const ring=(i)=>{const o=[];
        for(let j=0;j<n;j++){const a=j/n*Math.PI*2;
          o.push(V.add(cen(i),V.add(V.mul(bu,p.prof[i][1]*ea*Math.cos(a)),
                                    V.mul(bv,p.prof[i][1]*eb*Math.sin(a)))));}
        return o;};
      const rings=p.prof.map((q,i)=>ring(i));
      const all=[];for(const rg of rings)for(const q of rg)all.push(q);
      stroke(hullLoop(hull(tag(all,0))),false);
      const slope=i=>{
        const i0=Math.max(0,i-1),i1=Math.min(NP-1,i+1);
        return [p.prof[i1][0]-p.prof[i0][0],p.prof[i1][1]-p.prof[i0][1]];
      };
      const nrmAt=(i,q)=>{
        const [dt,dr]=slope(i);
        const rad=V.norm(V.sub(q,cen(i)));
        return V.norm(V.sub(V.mul(rad,dt),V.mul(p.axis,dr)));
      };
      const d=p.det||{};
      for(const idx of (d.rings||[])){
        if(idx<0||idx>=NP||p.prof[idx][1]<1e-6)continue;
        for(const run of runs(rings[idx],q=>faces(q,nrmAt(idx,q))&&VIS(q),mr*scale*0.25))
          t.path(run,ink,dw);
      }
      for(let mI=0;mI<(d.mer||0);mI++){
        const th=mI/d.mer*Math.PI*2+(d.merOff||0);
        const rad=V.add(V.mul(bu,Math.cos(th)),V.mul(bv,Math.sin(th)));
        const pts=[],ok=[];
        for(let i=0;i<NP;i++){
          const q=V.add(cen(i),V.add(V.mul(bu,p.prof[i][1]*ea*Math.cos(th)),
                                     V.mul(bv,p.prof[i][1]*eb*Math.sin(th))));
          const [dt,dr]=slope(i);
          pts.push(q);ok.push(faces(q,V.norm(V.sub(V.mul(rad,dt),V.mul(p.axis,dr)))));
        }
        let seq=[];
        for(let i=0;i<NP;i++){
          if(ok[i])seq.push(pts[i]);
          else{if(seq.length>1)stroke(dens(seq,false),false,dw);seq=[];}
        }
        if(seq.length>1)stroke(dens(seq,false),false,dw);
      }
      if(HATCH){
        const NH=hatchN(2*Math.PI*mr*scale);
        for(let i=0;i<NH;i++){
          const th=i/NH*Math.PI*2;
          const rad=V.add(V.mul(bu,Math.cos(th)),V.mul(bv,Math.sin(th)));
          const pts=[],nrm=[];let lit=0;
          for(let j=0;j<NP;j++){
            const q=V.add(cen(j),V.add(V.mul(bu,p.prof[j][1]*ea*Math.cos(th)),
                                       V.mul(bv,p.prof[j][1]*eb*Math.sin(th))));
            const [dt,dr]=slope(j);
            const nq=V.norm(V.sub(V.mul(rad,dt),V.mul(p.axis,dr)));
            pts.push(q);nrm.push(nq);
            const tn=TONE(nq);if(tn>lit)lit=tn;
          }
          if(lit<thrOf(i))continue;
          /* tone varies along an ogive, so the line is cut where it lightens
             rather than dropped whole — that is what keeps the field from popping */
          const [P,N]=densPN(pts,nrm), th0=thrOf(i);
          hatchRun(P,N,N.map(q=>TONE(q)>=th0));
        }
      }
      continue;
    }

    if(p.k==="box"||p.k==="panel"){
      let cor,F,N;
      if(p.k==="box"){
        cor=[];
        for(let j=0;j<8;j++)cor.push(V.add(p.c,V.add(V.mul(p.u,j&1?1:-1),
          V.add(V.mul(p.v,j&2?1:-1),V.mul(p.w,j&4?1:-1)))));
        F=[[0,2,6,4],[1,5,7,3],[0,4,5,1],[2,3,7,6],[0,1,3,2],[4,6,7,5]];
        N=[V.mul(p.u,-1),p.u,V.mul(p.v,-1),p.v,V.mul(p.w,-1),p.w];
      }else{
        const n=p.n,h=V.mul(n,p.th*0.5),m=p.pts.length,lo=p.pts2||p.pts;
        cor=p.pts.map(q=>V.add(q,h)).concat(lo.map(q=>V.sub(q,h)));
        F=[Array.from({length:m},(_,j)=>j),Array.from({length:m},(_,j)=>m+m-1-j)];
        N=[n,V.mul(n,-1)];
        for(let j=0;j<m;j++){
          if(p.skipSide===j)continue;
          const kk=(j+1)%m;
          F.push([j,kk,m+kk,m+j]);
          N.push(V.norm(V.cross(V.sub(p.pts[kk],p.pts[j]),n)));
        }
      }
      const m0=p.k==="panel"?p.pts.length:0;
      F.forEach((f,fi)=>{
        const ctr=V.mul(f.reduce((s,j)=>V.add(s,cor[j]),[0,0,0]),1/f.length);
        if(!faces(ctr,V.norm(N[fi])))return;
        if(p.k==="panel"&&fi<2&&p.skipSide!=null&&p.skipSide>=0){
          const off=fi===0?0:m0, sk=p.skipSide, idx=[];
          for(let j=1;j<=m0;j++)idx.push(off+((sk+j)%m0));
          stroke(dens(idx.map(j=>cor[j]),false),false);
        }else stroke(dens(f.map(j=>cor[j]),true),true);
        if(HATCH&&!p.bare)hatchFace(f.map(j=>cor[j]),V.norm(N[fi]),null);
        const d=p.det;
        if(d&&d.ribs&&fi<2&&f.length===4){
          const q=f.map(j=>cor[j]);
          for(let kk=1;kk<d.ribs;kk++){
            const tk=kk/d.ribs;
            stroke(dens([V.lerp(q[0],q[q.length-1],tk),V.lerp(q[1],q[2],tk)],false),false,dw);
          }
        }
      });
      continue;
    }

    if(p.k==="disc"){
      const n=V.norm(p.n),thk=V.mul(n,p.r*0.10),sg=SEG(p.r*scale);
      const a=V.sub(p.c,thk),b=V.add(p.c,thk);
      const ca=ringPts(a,p.r,n,sg),cb=ringPts(b,p.r,n,sg);
      stroke(hullLoop(hull(tag(ca,0).concat(tag(cb,1)))),false);
      const near=faces(p.c,n)?b:a;
      stroke(ringPts(near,p.r,n,sg),true);
      if(p.ri>1e-6)stroke(ringPts(near,p.ri,n,sg),true);
      if(HATCH&&!p.bare)hatchFace(ringPts(near,p.r,n,Math.min(sg,48)),faces(p.c,n)?n:V.mul(n,-1),
                         p.ri>1e-6?{c:near,r:p.ri}:null);
      continue;
    }

    /* tube / capsule */
    const axis=V.norm(V.sub(p.b,p.a));
    const isCap=p.k==="capsule";
    const ra=isCap?p.r:p.r1, rb=isCap?p.r:p.r2;
    const n=Math.max(SEG(ra*scale),SEG(rb*scale));
    /* under an orthographic view a sphere's outline is the great circle
       square to the eye, so the capsule's caps get real 3D silhouettes */
    const pA=isCap?ringPts(p.a,p.r,EYE,n):ringPts(p.a,ra,axis,n);
    const pB=isCap?ringPts(p.b,p.r,EYE,n):ringPts(p.b,rb,axis,n);
    outline(hull(tag(pA,0).concat(tag(pB,1))),!p.hideA,!p.hideB,p.bare?dw:undefined);
    if(!isCap){
      if(!p.hideA&&faces(p.a,V.mul(axis,-1)))stroke(ringPts(p.a,p.r1,axis,n),true);
      if(!p.hideB&&faces(p.b,axis))stroke(ringPts(p.b,p.r2,axis,n),true);
    }
    surfDet(p,axis,p.a,p.b,ra,rb,n);
    if(HATCH&&!p.bare){
      hatchAxial(p.a,p.b,ra,rb,axis);
      if(isCap){hatchSphere(p.a,p.r);hatchSphere(p.b,p.r);}
    }
  }
}
function hull(pts){
  const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}
  for(let i=p.length-1;i>=0;i--){const q=p[i];
    while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}
  lo.pop();up.pop();return lo.concat(up);
}
function partCentroid(p){
  if(p.k==="lathe")return p.c;
  if(p.pts)return V.mul(p.pts.reduce((s,q)=>V.add(s,q),[0,0,0]),1/p.pts.length);
  if(p.c)return p.c;
  return V.mul(V.add(p.a,p.b),0.5);
}
function partExtents(p){
  const o=[];
  if(p.k==="box"){for(let i=0;i<8;i++)
    o.push([V.add(p.c,V.add(V.mul(p.u,i&1?1:-1),V.add(V.mul(p.v,i&2?1:-1),V.mul(p.w,i&4?1:-1)))),0]);}
  else if(p.k==="panel"){for(const q of p.pts)o.push([q,p.th]);
    if(p.pts2)for(const q of p.pts2)o.push([q,p.th]);}
  else if(p.k==="lathe"){for(const [tt,r] of p.prof)o.push([V.add(p.c,V.mul(p.axis,tt)),r]);}
  else if(p.k==="sphere"||p.k==="disc")o.push([p.c,p.r]);
  else if(p.k==="capsule")o.push([p.a,p.r],[p.b,p.r]);
  else o.push([p.a,p.r1],[p.b,p.r2]);
  return o;
}
function viewBBox(ship,proj){
  let a=[1e9,1e9],b=[-1e9,-1e9];
  for(const p of ship.parts)for(const [q,r] of partExtents(p)){
    const s=proj(q);
    a[0]=Math.min(a[0],s[0]-r);b[0]=Math.max(b[0],s[0]+r);
    a[1]=Math.min(a[1],s[1]-r);b[1]=Math.max(b[1],s[1]+r);}
  return {x:a[0],y:a[1],w:b[0]-a[0],h:b[1]-a[1]};
}
/* one estimator for both targets: text never overruns its cell */
function fitSize(str,size,tracking,max){
  const w=str.length*size*0.58+Math.max(0,str.length-1)*tracking;
  return w>max?size*max/w:size;
}
/* ===================== sheet ===================== */
function renderSheet(t,W,H,ship,P,pal,opts){
  const k=opts.k||1,lw=P.line*k,ink=pal.ink,reveal=opts.reveal===undefined?1:opts.reveal;
  const U=Math.min(W,H);
  const portrait=W<H*1.02;
  const m=U*0.045,band=U*(portrait?0.20:0.165),gutH=U*0.032;
  const labelH=U*(portrait?0.062:0.052), gutV=labelH*1.05;
  const cw=W-m*2,chTop=m,chBot=H-m-band;
  const contH=chBot-chTop;
  const inset=U*0.020;
  const projs={profile:PROJ.profile,plan:PROJ.plan,bow:PROJ.bow,iso:isoProj(opts.yaw,opts.pitch)};
  t.rect(0,0,W,H,pal.bg);

  /* A general-arrangement sheet is four views because a draughtsman needs four.
     On a phone that is four thumbnails, and the pictorial — the only one anybody
     turns — comes out the size of a postage stamp. Solo throws the sheet away
     and gives the whole plate to the pictorial. The corner marks sit outside the
     cell the spin loop repaints, so a frame never wipes them. */

    const c={x:mg,y:mg,w:W-mg*2,h:H-mg*2};

       redraws the pictorial, so a scale that tracked the current yaw would make
       the ship breathe in and out and overrun the plate on its widest quarter */
    const bbS=ship.bb;
    const ctr=[(bbS[0][0]+bbS[1][0])/2,(bbS[0][1]+bbS[1][1])/2,(bbS[0][2]+bbS[1][2])/2];
    const dg=Math.hypot(bbS[1][0]-bbS[0][0],bbS[1][2]-bbS[0][2]);
    const hg=(bbS[1][1]-bbS[0][1])*Math.abs(Math.cos(opts.pitch))
            +dg*Math.abs(Math.sin(opts.pitch));
    const pj=projs.iso;
    const sc1=Math.min(c.w/Math.max(dg,1e-6),c.h/Math.max(hg,1e-6));
    const pc=pj(ctr);
    const o={ox:c.x+c.w/2-pc[0]*sc1, oy:c.y+c.h/2+pc[1]*sc1};
    drawView(t,ship,pj,sc1,o.ox,o.oy,pal,lw,reveal,false,"iso",
             `${opts.yaw},${opts.pitch},${k}`,opts.tone!==false);
    t.path([[mk,mk+tk],[mk,mk],[mk+tk,mk]],ink,lw);
    t.path([[W-mk-tk,mk],[W-mk,mk],[W-mk,mk+tk]],ink,lw);
    t.path([[mk,H-mk-tk],[mk,H-mk],[mk+tk,H-mk]],ink,lw);
    t.path([[W-mk-tk,H-mk],[W-mk,H-mk],[W-mk,H-mk-tk]],ink,lw);
    return {cells:{iso:c},sc:{iso:sc1},origin:{iso:o}};
  }

  const bProf=viewBBox(ship,projs.profile), bPlan=viewBBox(ship,projs.plan);
  const bBow=viewBBox(ship,projs.bow);
