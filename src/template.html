<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YARD WALKER</title>
<style>
  :root{--ink:#cfe8f2;--dim:#6d8b99;--acc:#6fe3ff;--bg:#071019;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--ink);}
  canvas{display:block;}
  .ov{position:fixed;pointer-events:none;user-select:none;}
  #cross{left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;
    background:var(--acc);opacity:.7;}
  #plate{left:50%;top:9%;transform:translateX(-50%);text-align:center;opacity:0;
    transition:opacity .6s;}
  #plate .d{font-size:22px;letter-spacing:.28em;color:var(--acc);white-space:nowrap;}
  #plate .k{font-size:11px;letter-spacing:.34em;color:var(--dim);margin-top:6px;white-space:nowrap;}
  #prompt{left:50%;bottom:16%;transform:translateX(-50%);font-size:13px;letter-spacing:.22em;
    color:var(--acc);opacity:0;transition:opacity .25s;white-space:nowrap;}
  #prompt b{border:1px solid var(--acc);padding:1px 6px;margin-right:8px;font-weight:400;}
  #stat{left:22px;bottom:18px;font-size:11px;letter-spacing:.18em;color:var(--dim);line-height:1.9;}
  #stat .m{color:var(--ink);}
  #nav{right:22px;bottom:18px;font-size:11px;letter-spacing:.14em;color:var(--dim);
    text-align:right;line-height:1.9;}
  #nav .t{color:var(--acc);}
  #help{right:22px;top:18px;font-size:10px;letter-spacing:.16em;color:var(--dim);
    text-align:right;line-height:2;opacity:.85;}
  #dbg{left:22px;top:18px;font-size:10px;letter-spacing:.1em;color:var(--dim);line-height:1.8;
    display:none;white-space:pre;}
  #title{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,#0c1c2c 0%,#050b12 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    z-index:10;transition:opacity .8s;}
  #title h1{font-size:34px;font-weight:400;letter-spacing:.6em;text-indent:.6em;color:var(--ink);}
  #title .sub{margin-top:14px;font-size:11px;letter-spacing:.3em;color:var(--dim);}
  #title .seed{margin-top:34px;font-size:12px;letter-spacing:.24em;color:var(--acc);}
  #title .go{margin-top:44px;font-size:12px;letter-spacing:.3em;color:var(--ink);
    border:1px solid #2a4658;padding:10px 26px;animation:pulse 2.2s infinite;}
  #title .ld{margin-top:18px;font-size:10px;letter-spacing:.26em;color:var(--dim);}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .mark{position:fixed;transform:translate(-50%,-50%);font-size:10px;letter-spacing:.16em;
    color:var(--acc);pointer-events:none;white-space:nowrap;text-shadow:0 0 6px #041018;}
  .mark::before{content:"◇";display:block;text-align:center;font-size:12px;margin-bottom:2px;}
</style>
</head>
<body>
<div id="title">
  <h1>YARD WALKER</h1>
  <div class="sub">STARSHIPS &middot; MOONBASE &middot; MECH-YARD — ONE SITE, ON FOOT</div>
  <div class="seed" id="tseed"></div>
  <div class="go" id="tgo">SURVEYING SITE&hellip;</div>
  <div class="ld">WASD MOVE &nbsp; E BOARD / EXIT &nbsp; SPACE JUMP &nbsp; ` DEBUG</div>
</div>
<div class="ov" id="cross"></div>
<div class="ov" id="plate"><div class="d"></div><div class="k"></div></div>
<div class="ov" id="prompt"></div>
<div class="ov" id="stat"></div>
<div class="ov" id="nav"></div>
<div class="ov" id="help"></div>
<div class="ov" id="dbg"></div>
<script>/*INJECT:SHIPYARD*/</script>
<script>/*INJECT:BASEYARD*/</script>
<script>/*INJECT:MECHYARD*/</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">/*INJECT:GAME*/</script>
</body>
</html>
